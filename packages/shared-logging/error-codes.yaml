  # =====================================================
  # VV-AML — penzmosas elleni (Pmt. 2017. evi LIII. tv.)
  # =====================================================

  VV-AML-001:
    name: "AML 100k HUF identifikacios kuszob atlepve, identifikacio hianyzik"
    category: AML
    level: ERROR
    user_impact: "Tranzakcio elutasitva, ugyfel ertesitve identifikacio szuksegerol"
    ai_fix_hint: |
      AmlService.checkIdentification() KOTELEZO a tranzakcio commit ELOTT.
      NEM szabad commit utan ellenorizni. Lasd: backend AmlServiceTest.

  VV-AML-002:
    name: "PEP nyilatkozat hianyzik 300k HUF felett"
    category: AML
    level: ERROR
    user_impact: "Tranzakcio elutasitva, PEP form kotelezo"
    ai_fix_hint: |
      AmlService.checkPepDeclaration() hivas kotelezo 300k HUF felett,
      a checkIdentification() UTAN, commit ELOTT.

  VV-AML-003:
    name: "Sanction-list talalat (EU/OFAC/ENSZ)"
    category: AML
    level: FATAL
    user_impact: "Tranzakcio azonnal felfuggesztve, SAR auto-trigger"
    ai_fix_hint: |
      SOHA ne lazitsd. Ha cache-only-ra valtasz, a backend revalidate
      KOTELEZO commit elott.

  # =====================================================
  # VV-BIZ — uzleti szabaly (NAV/MNB/szamviteli)
  # =====================================================

  VV-BIZ-001:
    name: "Bizonylat-sorszam-ugras detektalva (V<iroda><seq> nem monoton)"
    category: BUSINESS
    level: FATAL
    ai_fix_hint: |
      ReceiptSequenceService.next() SELECT FOR UPDATE-tel mukodik?
      Ellenorizd a tranzakcio-izolaciot (REPEATABLE_READ minimum).

  VV-BIZ-002:
    name: "Sztorno probalkozas napzaras UTAN"
    category: BUSINESS
    level: ERROR
    ai_fix_hint: |
      ReversalService 5 szabalya kozul a 3. (csak napzaras elott) serul.
      Frontend gombnak disabled-nek kell lennie, ha dailyClosing.status=CLOSED.

  VV-BIZ-003:
    name: "Keszlet elteres: SUM(tranzakciok) != cache ertek"
    category: BUSINESS
    level: FATAL
    ai_fix_hint: |
      Kulon currentStock counter mezot vezettek be? Ez TILOS.
      A keszletet MINDIG rekonstrualni kell ledger-bol.

  VV-BIZ-004:
    name: "Sztorno indoklas hianyzik (kotelezo mezo)"
    category: BUSINESS
    level: ERROR
    ai_fix_hint: |
      ReversalDto.reason validacio @NotBlank. Frontend form-validacio
      is kell, mert szervergyenge.

  VV-BIZ-005:
    name: "Kezelesi koltseg nem rogzitheto (V227 sync_active_columns function)"
    category: BUSINESS
    level: ERROR
    ai_fix_hint: |
      V227 hotfix-ben CREATE OR REPLACE function. Ha hianyzik:
      Flyway repair + a hotfix migrate ujra.

  VV-BIZ-006:
    name: "Napzaras lepes hiba (DailyClosingService)"
    category: BUSINESS
    level: ERROR
    user_impact: "A napzaras kotelezo lepese elhasalt - manualis korrekcio + ujraindas szukseges"
    ai_fix_hint: |
      DailyClosingService.runStep(stepNumber, name, check) belso catch.
      A `step_number` attr mutatja melyik lepes (1..9, TOTAL_STEPS=9):
      1=MTCN, 2=Esti cimletezes, 3=Kezelesi dij, 4=WU, 5=AFA, 6=Foglalo,
      7=E-kereskedelem, 8=Egyeb (AXA/MoneyGram), 9=NAV kontroll. A public
      executeStepCheck(stepNumber, branchId, closingDate) az atugorhato
      hibadiagnosztikai endpoint. Tipikus okok: bizonylat-gap, merleg-elteres,
      POS-terminal offline.

  VV-BIZ-007:
    name: "POS terminal napzaras hiba"
    category: BUSINESS
    level: ERROR
    user_impact: "A POS terminal nem zart le - manualis zaras kell a terminal UI-jan"
    ai_fix_hint: |
      DailyClosingService POS-terminal closing loop catch (PosTerminalService.executeDailyClosing).
      A terminal_id attr azonositja a problemas eszkozt - LEHET NULL ha az
      inkonzisztens DB-rekordnal nincs id (a Map defensive copy null-szuressel keszul).
      Tipikus: halozati problema, terminal offline, vagy a POS terminal valasza
      error code. Kovetkezo napzaras elott manualis terminal-zaras a terminal UI-jan.

  VV-BIZ-008:
    name: "Esti zaras adatcsomag kuldes hiba (központ felé)"
    category: BUSINESS
    level: ERROR
    user_impact: "A nap zart, DE a kozponti rendszer nem kapta meg az adatokat - retry kell"
    ai_fix_hint: |
      EveningClosingService.sendDailyPackage(branchId, date) catch a
      DailyClosingService-bol. SFTP / HTTP transzfer fail.
      Retry: SyncController.runSync(branchId) vagy manualis push.

  VV-BIZ-009:
    name: "Dekadjelentes generalas hiba (MNB)"
    category: BUSINESS
    level: ERROR
    user_impact: "A 10 napos MNB jelentés nem keszult el - manualis ujragyartas szukseges"
    ai_fix_hint: |
      DecadeReportService.generateForBranch(branchId, year, decade) catch a
      DailyClosingService-bol. Az year / decade attr mutatja a problemas
      idoszakot. Tipikus: hianyzo bizonylat, AML adat hianyos.

  VV-BIZ-010:
    name: "Napi archivalas hiba (D-1 ledger snapshot)"
    category: BUSINESS
    level: ERROR
    user_impact: "Az aznapi ledger snapshot NEM mentődött - audit-szempontbol potolni kell"
    ai_fix_hint: |
      MonthlyArchiveService.archiveDailyTransactions(branchId, date) vagy
      DailyClosingArchiveService.executeFullDailyArchive(branchId, date) catch.
      A ledger-state visszateritheto a tranzakcio-tablabol, de a snapshot
      manualis ujragyartast igenyel - admin felulet POST
      /api/v1/admin/closing/rebuild-snapshot endpoint-jan, branch+date
      query-parameterekkel.

