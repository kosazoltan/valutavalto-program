# EBC Valutavalto belso log+audit modul — AI-olvashato hibakod-katalogus
#
# Formatum: VV-<KATEGORIA>-<3-jegyu sorszam>
# Session-start kotelezo olvasmany az AI Javito Programnak (Claude Code).
#
# Bovites: ha uj hibatipust talalsz a kodban, add hozza ide + irj `ai_fix_hint`-et.
# A `VVLogger.error(error_code, ...)` minden hivasakor a kodnak SZEREPELNIE KELL itt.

