  VV-SEC-001:
    name: "Jelszo/secret/PII detektalva log payloadban"
    category: SECURITY
    level: FATAL
    ai_fix_hint: |
      A PII masking layer ELOTT logoltak nyersen. AZONNAL torolni
      a logot (admin), es fixalni a redactor regex-et.

  VV-SEC-002:
    name: "Google OAuth backend signature mismatch"
    category: SECURITY
    level: ERROR
    ai_fix_hint: |
      worker_google_login_whitelist tablaban rossz email VAGY
      GOOGLE_DESKTOP_CLIENT_ID multi-ertekes config hibas.

  VV-SEC-003:
    name: "SetupWizard auth bypass attempt (BALI password NULL)"
    category: SECURITY
    level: WARN
    ai_fix_hint: |
      V230+V231 hotfix kezeli. NEM-NULL password_hash kell, NEM
      kerdezzunk current_password-ot uj telepiteskor.

  VV-SEC-004:
    name: "Audit-log iras meghiusult (currency_audit_log INSERT)"
    category: SECURITY
    level: ERROR
    user_impact: "A modositas megtortent, de az audit-bejegyzes NEM mentodott (audit-res)"
    ai_fix_hint: |
      AdminCurrencyService.writeAudit() catch-aga: a Currency-modositas mar commitalt,
      de a currency_audit_log INSERT bukott. Ellenorizd a DB-kapcsolatot/constraint-et.
      Pmt./NAV-megorzes szempontjabol a business-muvelet es az audit szetcsuszott.

  VV-SEC-005:
    name: "Grace token-nelkuli first-time worker-setup felhasznalva (V279 kohorsz)"
    category: SECURITY
    level: WARN
    user_impact: "Nincs kozvetlen hatas — null-hash kollega token nelkul allitott jelszot (deploy-kohorsz)"
    ai_fix_hint: |
      WorkerFirstTimeSetupService grace-aga (V279): a deploy-pillanatban null-hash dolgozo
      EGYSZER token nelkul fejezte be a setupot. Verseny-alapu fiokatvetel utolagos
      detektalasahoz strukturalt audit. A grace egyszer-hasznalatos (setup_grace=false utana).

  # =====================================================
  # VV-VOICE — Hangseged (voice-assistant) integracio
  # =====================================================

  VV-VOICE-001:
    name: "OpenAI Realtime API ephemeral token kerese sikertelen"
    category: INTEGRATION
    level: ERROR
    ai_fix_hint: |
      Backend OPENAI_API_KEY env var hianyzik vagy VOICE_OPENAI_ENABLED=false.
      Lasd: VoiceTokenService.requestEphemeralToken().

  VV-VOICE-002:
    name: "Per-worker rate-limit lepve (>10 token-keres/ora)"
    category: TECHNICAL
    level: WARN
    ai_fix_hint: |
      Kompromittalt JWT vagy bug-os UI? VOICE_OPENAI_RATE_LIMIT_PER_HOUR
      env var emelheto, de elobb root-cause vizsgalat.

  VV-VOICE-003:
    name: "WebRTC SDP exchange timeout (>15s)"
    category: NETWORK
    level: WARN
    ai_fix_hint: |
      Halozati problema az OpenAI Realtime API-val. realtimeClient.ts
      AbortController-rel mar implementalja.

  VV-VOICE-004:
    name: "OpenAI Realtime API hibas valasz (hianyzik client_secret)"
    category: INTEGRATION
    level: ERROR
    user_impact: "Hangsegéd nem aktivalhato — backend nem tudott ephemeral tokent atvenni"
    ai_fix_hint: |
      Az OpenAI valasz JSON nem tartalmaz `client_secret.value` mezot.
      Lehet model-deprecation (gpt-realtime-2 -> gpt-realtime-X), vagy
      OpenAI Realtime API breaking change. Lasd:
      https://platform.openai.com/docs/guides/realtime

  VV-VOICE-005:
    name: "OpenAI Realtime API valasz JSON-parser hiba"
    category: INTEGRATION
    level: ERROR
    user_impact: "Hangsegéd nem aktivalhato — szerver-szintu valasz-parser hiba"
    ai_fix_hint: |
      Az OpenAI HTTP 200 valasz nem ervenyes JSON. TILOS a raw body
      logolasa (tartalmazhat ephemeral tokent / API kulcsot!). Csak
      response.length() es egy SHA-256 hash logolando, plus a
      Content-Type / Content-Length fejlecek. A raw body csak fejlesztoi
      console-ban (NEM a structured log-ban) jelenitheto meg DEBUG modban.

  # =====================================================
  # VV-TECH — technikai (db, infra)
  # =====================================================

  VV-TECH-001:
    name: "Flyway checksum mismatch (V<n> migration changed)"
    category: TECHNICAL
    level: FATAL
    ai_fix_hint: |
      KOTELEZO debug: melyik migration? Soha NEM repair-rel megoldani
      production-ben enable.

  VV-TECH-002:
    name: "Database connection pool exhausted (HikariCP)"
    category: TECHNICAL
    level: FATAL
    ai_fix_hint: |
      maxLifetime / leakDetectionThreshold beallitas?
      spring.datasource.hikari.* property-k vizsgalata.

  VV-TECH-FATAL:
    name: "Uncaught exception / unhandled rejection"
    category: TECHNICAL
    level: FATAL
    ai_fix_hint: |
      Generikus catch-all. A stack trace-ben latszik a tenyleges hely.

  VV-TECH-003:
    name: "HUF currency lookup failure at startup (cache_huf_currency_id)"
    category: TECHNICAL
    level: ERROR
    user_impact: "Penztari kapcsolatos muveletek a HUF cache-elt ID hianyaban nem mukodnek (cash_balance)"
    ai_fix_hint: |
      TransactionService.@PostConstruct initHufCurrencyId() metodus catch-block.
      A currencies tabla tipusa lehet UUID vs Long mismatch. Ellenorizd a
      CurrencyRepository tipus-definiciot + a V31 migrationt.

  VV-TECH-004:
    name: "Camera-tranzakcio link sikertelen (CameraTransactionLinker)"
    category: TECHNICAL
    level: ERROR
    user_impact: "A tranzakcio rogzitve, de a kamerakep nem koto a bizonylathoz - utolagos osszekapcsolas kell"
    ai_fix_hint: |
      CameraTransactionLinker.linkTransaction() catch-all. Camera service offline?
      AML/audit ellenorzeshez kotelezo a kamerakep, manualis fix:
      - CameraExportController.linkManually(txId, branchId, timestamp, receiptNo)

  VV-TECH-005:
    name: "Kamera hash-lanc integritas serult (previousHash eltres)"
    category: TECHNICAL
    level: ERROR
    user_impact: "A kamera-felvetel utolagosan modosulhatott - a bizonyitekertek serult, hatosagi vizsgalat eseten jelezni kell"
    ai_fix_hint: |
      CameraHashChainService.verifyChain(): egy szegmens previousHash erteke
      nem egyezik az elozo szegmens chainHash-evel -> a lanc valahol megszakadt
      vagy manipulalt. Ellenorizd: hianyzik-e szegmens (sequenceNumber-ugras),
      vagy DB-manipulacio tortent. Az auditLogService is rogzit (CAMERA_CHAIN_INTEGRITY_FAILURE).

  VV-TECH-006:
    name: "Kamera hash-lanc ellenorzes szamitasi hiba"
    category: TECHNICAL
    level: ERROR
    user_impact: "A kamera hash-lanc nem ellenorizheto - a verifikacio megszakadt, ujraindas szukseges"
    ai_fix_hint: |
      CameraHashChainService.verifyChain() computeChainHash() Exception-t dobott
      (pl. SHA-256 algoritmus nem elerheto, vagy metadata olvasasi hiba).
      Ellenorizd a MessageDigest.getInstance("SHA-256") elerhetoseget + a recording metadata-t.

  VV-TECH-007:
    name: "Kamera chain hash mismatch (tamper-evidence)"
    category: TECHNICAL
    level: ERROR
    user_impact: "A kamera-szegmens tartalma elter a tarolt hash-tol - bizonyitekertek serult"
    ai_fix_hint: |
      CameraHashChainService.verifyChain(): az ujraszamolt chainHash nem egyezik
      a tarolt ertekkel -> a szegmens tartalma (fileHash/metadata) megvaltozott a rogzites ota.
      Az auditLogService is rogzit (CAMERA_CHAIN_HASH_MISMATCH). Hatosagi/forenzikus eskalacio.

  VV-AML-004:
    name: "AML service unavailable - tranzakcio blokkolva"
    category: AML
    level: FATAL
    user_impact: "Tranzakcio NEM hajthato vegre AML-szolgaltatas hibaja miatt"
    ai_fix_hint: |
      AmlService.checkTransaction() null-t adott vissza. Lasd:
      - Sanction-list cache lejart?
      - Customer-screening-service down?
      Tranzakciot soha NE engedj uregess AML-eredmenyt.
      Mindig nezz at egy konkretabb error_code-ra is.

  # =====================================================
  # VV-VALID — input/torzs-adat validacio
  # =====================================================

  VV-VALID-003:
    name: "Duplikalt egyediseg-ertek torzs-letrehozasnal/modositasnal — muvelet elutasitva"
    category: VALID
    level: ERROR
    user_impact: "A letrehozas/modositas nem tortent meg; masik (nem foglalt) erteket kell megadni"
    ai_fix_hint: |
      Kozos kod minden torzs-adat egyediseg-utkozesre (Codex PR #1096: NE szukitsd
      currency-only jelentesre). Hasznaloi:
      - RateWorkgroupService (FK02-D): duplikalt munkacsoport-sorszam vagy -kod
        (ValidationException uzenet-prefixkent hordozza a kodot).
      - AdminCurrencyService.createCurrency() (FK04): a currency.display_order egyedi
        (V318 UNIQUE constraint). existsByDisplayOrder eloszures + saveAndFlush ->
        DataIntegrityViolationException-bol is 409 + VV-VALID-003 (konkurens eset).
        A frontend (CurrencyManagerModal) az "Uj valuta" formot max(displayOrder)+1
        defaulttal tolti elo. NE kapcsold ki a constraintet.
