  VV-AML-001:
    name: "AML 100k HUF identifikacios kuszob atlepve, identifikacio hianyzik"
    category: AML
    level: ERROR
    user_impact: "Tranzakcio elutasitva, ugyfel ertesitve identifikacio szuksegerol"
    ai_fix_hint: |
      AmlService.checkIdentification() KOTELEZO a tranzakcio commit ELOTT.
      NEM szabad commit utan ellenorizni. Lasd: backend AmlServiceTest.

  VV-AML-002:
    name: "PEP nyilatkozat hianyzik 300k HUF felett"
    category: AML
    level: ERROR
    user_impact: "Tranzakcio elutasitva, PEP form kotelezo"
    ai_fix_hint: |
      AmlService.checkPepDeclaration() hivas kotelezo 300k HUF felett,
      a checkIdentification() UTAN, commit ELOTT.

  VV-AML-003:
    name: "Sanction-list talalat (EU/OFAC/ENSZ)"
    category: AML
    level: FATAL
    user_impact: "Tranzakcio azonnal felfuggesztve, SAR auto-trigger"
    ai_fix_hint: |
      SOHA ne lazitsd. Ha cache-only-ra valtasz, a backend revalidate
      KOTELEZO commit elott.

