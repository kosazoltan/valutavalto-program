  VV-VOICE-001:
    name: "OpenAI Realtime API ephemeral token kerese sikertelen"
    category: INTEGRATION
    level: ERROR
    ai_fix_hint: |
      Backend OPENAI_API_KEY env var hianyzik vagy VOICE_OPENAI_ENABLED=false.
      Lasd: VoiceTokenService.requestEphemeralToken().

  VV-VOICE-002:
    name: "Per-worker rate-limit lepve (>10 token-keres/ora)"
    category: TECHNICAL
    level: WARN
    ai_fix_hint: |
      Kompromittalt JWT vagy bug-os UI? VOICE_OPENAI_RATE_LIMIT_PER_HOUR
      env var emelheto, de elobb root-cause vizsgalat.

  VV-VOICE-003:
    name: "WebRTC SDP exchange timeout (>15s)"
    category: NETWORK
    level: WARN
    ai_fix_hint: |
      Halozati problema az OpenAI Realtime API-val. realtimeClient.ts
      AbortController-rel mar implementalja.

  VV-VOICE-004:
    name: "OpenAI Realtime API hibas valasz (hianyzik client_secret)"
    category: INTEGRATION
    level: ERROR
    user_impact: "Hangsegéd nem aktivalhato — backend nem tudott ephemeral tokent atvenni"
    ai_fix_hint: |
      Az OpenAI valasz JSON nem tartalmaz `client_secret.value` mezot.
      Lehet model-deprecation (gpt-realtime-2 -> gpt-realtime-X), vagy
      OpenAI Realtime API breaking change. Lasd:
      https://platform.openai.com/docs/guides/realtime

  VV-VOICE-005:
    name: "OpenAI Realtime API valasz JSON-parser hiba"
    category: INTEGRATION
    level: ERROR
    user_impact: "Hangsegéd nem aktivalhato — szerver-szintu valasz-parser hiba"
    ai_fix_hint: |
      Az OpenAI HTTP 200 valasz nem ervenyes JSON. Logoljuk a raw body-t
      a stack-ben es ellenorizzuk a Content-Type fejlecet.

