  # =====================================================

  VV-MT-001:
    name: "Cross-tenant lekerdezes detektalva (companyId mismatch)"
    category: SECURITY
    level: FATAL
    ai_fix_hint: |
      Repository-ban nincs companyId szures vagy a JWT-ben rossz ceg.
      Azonnal allitsd le, es nezd meg, hogy nem szivarogtak-e adatok.
      Lasd audit-iter5 P0.1 (IDOR fix TurnoverController).

  VV-MT-002:
    name: "RateApproval tenant izolacio violation"
    category: SECURITY
    level: FATAL
    ai_fix_hint: |
      PR #636-ban javitva. Ha ujra megjelenik: a 4 metod (approve/reject/
      list/get) mind companyId-szurest hasznaljon-e.

  # =====================================================
  # VV-SYNC — local-first / offline sync
  # =====================================================

  VV-SYNC-001:
    name: "Outbox replay duplikacio (Idempotency-Key egyezes)"
    category: TECHNICAL
    level: INFO
    ai_fix_hint: |
      Ez NEM hiba — az IdempotencyFilter helyesen kiszurte. Csak audit.

  VV-SYNC-002:
    name: "Offline outbox > 100 elem (sync hiba?)"
    category: TECHNICAL
    level: WARN
    ai_fix_hint: |
      Halozat? Heartbeat? Backend leallt? Ellenorizd a /api/v1/health-et.

  VV-SYNC-003:
    name: "Local SQLite outbox corrupted (better-sqlite3 IO error)"
    category: TECHNICAL
    level: ERROR
    ai_fix_hint: |
      penztar-client/electron/sqlite.ts - .db fajl serult.

  VV-SYNC-004:
    name: "Backend branch-to-branch szinkronizacio sikertelen"
    category: TECHNICAL
    level: ERROR
    user_impact: "Egy iroda tranzakciok/rates/sessions adatai nem szinkronizalodtak. Manualis retry vagy heartbeat-alapu auto-recovery szukseges."
    ai_fix_hint: |
      SyncService.runSync(branch, type) catch. Lehet:
      - integration_transport.outbox SFTP/HTTP unavailable
      - branch.code helytelen
      - sync_log status='FAILED' bejegyzes
      Retry: SyncController.retrySync(branchId).
      Megoldas: telepito uninstall + new install.

