  VV-RATE-001:
    name: "Lejart arfolyammal probaltak tranzakciot inditani"
    category: BUSINESS
    level: ERROR
    ai_fix_hint: |
      Rate.validTo > now() ellenorzes a tranzakcio BELEPESEKOR,
      NEM a vegen. RateValidityFilter kell.

  VV-RATE-002:
    name: "RFM publish konfliktus (optimistic locking version mismatch)"
    category: BUSINESS
    level: WARN
    ai_fix_hint: |
      Masodik RFM operator probalt publikalni. Frontend hibauzenet:
      'Egy masik operator idokozben frissitette az arfolyamokat'.

  VV-RATE-003:
    name: "Branch-iroda exclusivity violation (V234 - egy worker csak egy iroda)"
    category: BUSINESS
    level: ERROR
    ai_fix_hint: |
      V234 migration biztositja a constraint-et. Ha violation:
      rate_creator_branch.unique(workerId, ts_range).

  # =====================================================
