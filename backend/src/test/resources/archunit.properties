# ArchUnit FreezingArchRule — a védtelen-végpont baseline store konfigurációja.
# A store első létrehozását engedélyezzük; a rögzített violations.txt-eket verziókövetjük.
# A gate ezután minden ÚJ (baseline-on kívüli) sértést elkap; a meglévő, SecurityConfig-matcherrel
# védett végpontok (kódból verifikálva NEM rések) a baseline-ban maradnak.
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false

# Explicit store-path (GLM-review #4): a store MINDIG a backend-modul archunit_store/-jában legyen,
# függetlenül attól, hogy Maven a backend/-ből vagy IDE a projekt-gyökérből futtatja — így nem jön
# létre árva, nem-commitolt store rossz helyen. A path a working directory-hoz relatív; a CI és a
# `mvn` a backend/-ből fut, így ez a backend/archunit_store/-ra mutat.
freeze.store.default.path=archunit_store

# BIZTONSÁGI JAVÍTÁS WORKFLOW (GLM-review #3): ha egy meglévő, baseline-ban lévő védtelen végpontot
# JAVÍTASZ (hozzáadod a @PreAuthorize-t), a violation-sor eltűnik — a FreezingArchRule ezt elfogadja
# (kevesebb sértés = OK, nem bukik). Ha viszont a szabály szövege vagy a legitim baseline változik és
# frissíteni kell: futtasd egyszer `-Darchunit.freeze.refreeze=true`-val, majd COMMITOLD az új store-t.

