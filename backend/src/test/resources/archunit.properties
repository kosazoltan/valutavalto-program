# ArchUnit FreezingArchRule — a védtelen-végpont baseline store konfigurációja.
# A store első létrehozását engedélyezzük; a rögzített violations.txt-eket verziókövetjük.
# A gate ezután minden ÚJ (baseline-on kívüli) sértést elkap; a meglévő, SecurityConfig-matcherrel
# védett végpontok (kódból verifikálva NEM rések) a baseline-ban maradnak.
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
