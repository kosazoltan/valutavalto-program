# ============================================================
# Teszt konfiguráció — H2 in-memory adatbázis
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
jwt.secret=test-secret-key-for-testing-only-32chars!!
cors.allowed-origins=http://localhost:3000

# ErrorMailerService/ErrorLogController HMAC — CSAK teszt-érték, nem prod secret
errorlog.hmac.secret=test-only-hmac-secret

# RatePrintProofService HMAC — CSAK teszt-érték, hogy a @SpringBootTest context
# determinisztikus maradjon (ne random-fallback WARN zajt generaljon)
app.rate-print.hmac-secret=test-only-rate-print-secret
