# Test profil — helyi PostgreSQL (docker-compose)
spring.application.name=valuta-backend-test

# Lokális PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/valuta
spring.datasource.username=valuta_user
spring.datasource.password=valuta_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=test-secret-key-for-local-development-minimum-32-chars-long
jwt.expiration=86400000

# Deterministic local/test encryption defaults so JPA converters can initialize.
app.encryption.key=test-only-local-encryption-key-32chars
app.encryption.salt=00112233445566778899aabbccddeeff

# Logging
logging.level.root=INFO
logging.level.hu.puzzleir.valuta=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS — Electron dev server
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
