# Application Name
spring.application.name=valuta-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/valuta}
spring.datasource.username=${DATABASE_USERNAME:valuta_user}
spring.datasource.password=${DATABASE_PASSWORD:valuta_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.hu.puzzleir.valuta=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Security — JWT-alapú hitelesítés, spring.security.user.* nem szükséges

# JWT Configuration
jwt.secret=${JWT_SECRET:valuta-secret-key-change-in-production-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:3001,http://localhost:3002,https://excvaluta.com,https://www.excvaluta.com,https://valutavalto.vercel.app,app://localhost
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Validation
spring.validation.enabled=true

# SpringDoc OpenAPI / Swagger UI
# FIGYELEM: Swagger csak autentikált usernek érhető el (SecurityConfig: .authenticated())
# Production-ban teljesen kikapcsolt — lásd application-prod.properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Actuator - health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Mail health indicator kikapcsolva — SMTP nem mindig elérhető
management.health.mail.enabled=false

# === Camera system ===
camera.enabled=false
camera.fps=5
camera.resolution.width=640
camera.resolution.height=480
camera.jpeg-quality=70
camera.retention-days=50
camera.segment-duration-minutes=60
camera.local-storage-path=C:/valuta/camera
camera.upload-interval-seconds=300
camera.encryption.enabled=true
camera.encryption.algorithm=AES/GCM/NoPadding
camera.encryption.key-size=256

# === Encryption (OAuth token titkosítás) ===
app.encryption.key=${ENCRYPTION_KEY:default-dev-key-change-in-prod}
# FIGYELEM: Production-ban KÖTELEZŐ erős random salt! openssl rand -hex 16
app.encryption.salt=${ENCRYPTION_SALT:deadbeef}

# === Gmail Integration ===
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/email/accounts/callback}
google.gmail.scopes=https://www.googleapis.com/auth/gmail.modify

# Scheduling thread pool
spring.task.scheduling.pool.size=2

# Error Logger SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noraautomatizalas@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Árfolyam érvényesség (órában — 0 = nincs limit)
exchange-rate.max-age-hours=${EXCHANGE_RATE_MAX_AGE_HOURS:24}

# Rate limiting — login védelem brute force ellen
rate-limit.login.max-requests=10
rate-limit.login.window-ms=60000
# Rate limiting — tranzakciós végpontok
rate-limit.transaction.max-requests=30
rate-limit.transaction.window-ms=60000

# Error Logger
errorlog.hmac.secret=${ERRORLOG_HMAC_SECRET:}

# POS terminál alapértelmezett kapcsolat
pos.terminal.default.host=${POS_TERMINAL_HOST:127.0.0.1}
pos.terminal.default.port=${POS_TERMINAL_PORT:9100}
