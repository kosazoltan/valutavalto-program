# =============================================================================
# PRODUCTION KONFIGURÁCIÓ (Render)
# =============================================================================
# Aktiváláas: SPRING_PROFILES_ACTIVE=production

# Server
server.port=${PORT:8080}

# Database - Render PostgreSQL
# A DATABASE_URL már JDBC formátumban van: jdbc:postgresql://...?user=...&password=...
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# Credentials are embedded in DATABASE_URL, so we don't set username/password separately
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA - Production beállítások
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - Migration (temporarily disabled to test app startup)
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.validate-on-migrate=false

# Logging - Production (verbose for debugging)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.puzzleir.backend=DEBUG
logging.level.hu.puzzleir.valuta=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari=DEBUG

# CORS - Vercel frontend URL-ek
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://valutavalto.vercel.app}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

# Actuator - Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
