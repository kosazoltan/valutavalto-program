# =============================================================================
# PRODUCTION KONFIGURACIO (Hetzner VPS)
# =============================================================================
# Aktivalas: SPRING_PROFILES_ACTIVE=production

# Server
server.port=${PORT:8080}

# Database - PostgreSQL
# A DATABASE_URL JDBC formatumban: jdbc:postgresql://...?user=...&password=...
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# PgBouncer transaction pool mode compat - vezerlokonyv par.26.3
# Transaction pool-ban a PostgreSQL server-side prepared statement cache nem megoszthato
# a kliensek kozott, ezert kikapcsoljuk (prepareThreshold=0). Enelkul
# "prepared statement does not exist" hibak keletkeznek.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# JPA - Production beallitasok
# Tables created by ddl-auto=update (2026-03-13), now stable
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - baseline-on-migrate: DB already has all tables at V67 level
# No previous migrations needed - just baseline and track future ones
# out-of-order OFF + validate ON for migration consistency in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=67
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Logging - Production (verbose for debugging)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.puzzleir.backend=INFO
logging.level.hu.puzzleir.valuta=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

# CORS - Vercel frontend URL-ek
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://excvaluta.com,https://www.excvaluta.com}

# Google OAuth - Gmail integraciora (opcionalis)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:https://excvaluta.com/api/v1/email/accounts/callback}

# Security — JWT-alapú hitelesítés, spring.security.user.* nem szükséges
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Actuator - health check
# Actuator - PRODUCTION: csak localhost-on elerheto, Caddy/nginx scrape-eli lokalisan.
# Igy a publikus Internet felol a /actuator/prometheus, /actuator/env NEM erheto el.
management.server.port=${MANAGEMENT_PORT:9090}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
# Mail health indicator kikapcsolva — SMTP nem mindig elérhető, az actuator DOWN-t jelzett
management.health.mail.enabled=false

# Swagger / OpenAPI letiltas production-ban
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Camera disabled on server (no webcam hardware)
camera.enabled=false

# Integration transport storage
integration.transport.root-path=${INTEGRATION_TRANSPORT_ROOT:/tmp/valuta-integrations}
integration.transport.camera.upload-dir=${INTEGRATION_CAMERA_UPLOAD_DIR:camera-upload}
integration.transport.sync.dir=${INTEGRATION_SYNC_DIR:branch-sync}
integration.transport.darius.outbox-dir=${INTEGRATION_DARIUS_OUTBOX_DIR:darius-outbox}
