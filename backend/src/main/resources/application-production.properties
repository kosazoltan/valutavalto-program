# =============================================================================
# PRODUCTION KONFIGURACIO (Render)
# =============================================================================
# Aktivalas: SPRING_PROFILES_ACTIVE=production

# Server
server.port=${PORT:8080}

# Database - Render PostgreSQL
# A DATABASE_URL mar JDBC formatumban van: jdbc:postgresql://...?user=...&password=...
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# Credentials are embedded in DATABASE_URL, so we don't set username/password separately
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA - Production beallitasok
# TEMPORARY: ddl-auto=update to create initial schema on empty Render DB
# After first successful deploy, change back to ddl-auto=none + flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - DISABLED until initial schema is created by Hibernate
# V0 migration missing (company/branch tables never in Flyway)
# Re-enable after initial schema is established
spring.flyway.enabled=false

# Logging - Production (verbose for debugging)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.puzzleir.backend=INFO
logging.level.hu.puzzleir.valuta=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

# CORS - Vercel frontend URL-ek
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://valutavalto.vercel.app}

# Google OAuth - Gmail integraciora (opcionalis)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:https://valuta-backend-spbx.onrender.com/api/v1/email/accounts/callback}

# Admin user
spring.security.user.name=admin
spring.security.user.password=${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

# Actuator - health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI letiltas production-ban
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Camera disabled on Render (no webcam hardware)
camera.enabled=false
