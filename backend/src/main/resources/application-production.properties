# =============================================================================
# PRODUCTION KONFIGURÁCIÓ (Render)
# =============================================================================
# Aktiváláas: SPRING_PROFILES_ACTIVE=production

# Server
server.port=${PORT:8080}

# Database - Render PostgreSQL
# A DATABASE_URL formátum: postgresql://user:password@host:port/database
# Spring Boot-nak jdbc: prefix kell, ezért JDBC_DATABASE_URL-t használunk
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA - Production beállítások
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - Migration (temporarily disabled to test app startup)
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.validate-on-migrate=false

# Logging - Production
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.puzzleir.backend=INFO
logging.level.hu.puzzleir.valuta=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# CORS - Vercel frontend URL-ek
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://valutavalto.vercel.app}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

# Actuator - Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
