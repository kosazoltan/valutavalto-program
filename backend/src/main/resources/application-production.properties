# =============================================================================
# PRODUCTION KONFIGURĂCIĂ“ (Render)
# =============================================================================
# AktivĂˇlĂˇas: SPRING_PROFILES_ACTIVE=production

# Server
server.port=${PORT:8080}

# Database - Render PostgreSQL
# A DATABASE_URL mĂˇr JDBC formĂˇtumban van: jdbc:postgresql://...?user=...&password=...
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# Credentials are embedded in DATABASE_URL, so we don't set username/password separately
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA - Production beĂˇllĂ­tĂˇsok
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=49
spring.flyway.validate-on-migrate=false

# Logging - Production (verbose for debugging)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.puzzleir.backend=INFO
logging.level.hu.puzzleir.valuta=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

# CORS - Vercel frontend URL-ek
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://valutavalto.vercel.app}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

# Actuator - Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI letiltĂˇs production-ban
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
