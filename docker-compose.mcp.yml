services:
  # ---------------------------------------------------------------------------
  # Minimum MCP set (recommended baseline for AI-assisted development)
  # ---------------------------------------------------------------------------

  mcp-filesystem:
    image: node:20-alpine
    container_name: mcp-filesystem
    working_dir: /workspace
    command: >
      sh -lc "npx -y supergateway --port 8810 --stdio
      'npx -y @modelcontextprotocol/server-filesystem /workspace'"
    volumes:
      - ./:/workspace:rw
    ports:
      - "8810:8810"
    restart: unless-stopped

  mcp-git:
    image: node:20-alpine
    container_name: mcp-git
    working_dir: /workspace
    command: >
      sh -lc "npx -y supergateway --port 8811 --stdio
      'npx -y @cyanheads/git-mcp-server'"
    volumes:
      - ./:/workspace:rw
    ports:
      - "8811:8811"
    restart: unless-stopped

  mcp-fetch:
    image: node:20-alpine
    container_name: mcp-fetch
    command: >
      sh -lc "npx -y supergateway --port 8812 --stdio
      'npx -y @mokei/mcp-fetch'"
    ports:
      - "8812:8812"
    restart: unless-stopped

  mcp-postgres:
    image: node:20-alpine
    container_name: mcp-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://valuta_user:valuta_pass@postgres:5432/valuta
    command: >
      sh -lc "npx -y supergateway --port 8813 --stdio
      'npx -y @modelcontextprotocol/server-postgres $DATABASE_URL'"
    ports:
      - "8813:8813"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional MCP servers
  # Enable with: docker compose -f docker-compose.yml -f docker-compose.mcp.yml --profile optional-mcp up -d
  # Note: package names below are common community defaults; adjust if your team uses different ones.
  # ---------------------------------------------------------------------------

  mcp-shell:
    image: node:20-alpine
    container_name: mcp-shell
    profiles: ["optional-mcp"]
    working_dir: /workspace
    command: >
      sh -lc "npx -y supergateway --port 8814 --stdio
      'npx -y mcp-server-shell --cwd /workspace'"
    volumes:
      - ./:/workspace:rw
    ports:
      - "8814:8814"
    restart: unless-stopped

  mcp-docker:
    image: node:20-alpine
    container_name: mcp-docker
    profiles: ["optional-mcp"]
    command: >
      sh -lc "npx -y supergateway --port 8815 --stdio
      'npx -y mcp-server-docker'"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8815:8815"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sprint roadmap - Cognee knowledge engine (AI memory auto-save)
  # Enable: docker compose -f docker-compose.yml -f docker-compose.mcp.yml --profile knowledge-mcp up -d
  # ---------------------------------------------------------------------------
  mcp-cognee:
    image: python:3.12-slim
    container_name: mcp-cognee
    profiles: ["knowledge-mcp"]
    working_dir: /workspace
    environment:
      LLM_PROVIDER: ${COGNEE_LLM_PROVIDER:-openai}
      LLM_API_KEY: ${COGNEE_LLM_API_KEY:-}
      LLM_MODEL: ${COGNEE_LLM_MODEL:-gpt-4o-mini}
      COGNEE_DB_PROVIDER: sqlite
      COGNEE_DATABASE_PATH: /workspace/.cognee/cognee.db
    command: >
      sh -lc "pip install --no-cache-dir cognee supergateway &&
      mkdir -p /workspace/.cognee &&
      supergateway --port 8820 --stdio 'cognee-mcp'"
    volumes:
      - ./:/workspace:rw
      - cognee-data:/workspace/.cognee
    ports:
      - "8820:8820"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sprint roadmap - Obsidian vault MCP (session memory auto-sync)
  # Elofeltetel: Obsidian Local REST API plugin telepitve a vault-on
  #              (https://github.com/coddingtonbear/obsidian-local-rest-api)
  #              alapertelmezett port: 27124 (https) vagy 27123 (http)
  # Enable: docker compose -f docker-compose.yml -f docker-compose.mcp.yml --profile knowledge-mcp up -d
  # ---------------------------------------------------------------------------
  mcp-obsidian:
    image: node:20-alpine
    container_name: mcp-obsidian
    profiles: ["knowledge-mcp"]
    environment:
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY:-}
      # host.docker.internal mukodik Docker Desktop (Windows/macOS) eseteben
      OBSIDIAN_HOST: ${OBSIDIAN_HOST:-host.docker.internal}
      OBSIDIAN_PORT: ${OBSIDIAN_PORT:-27124}
      OBSIDIAN_PROTOCOL: ${OBSIDIAN_PROTOCOL:-https}
    command: >
      sh -lc "npx -y supergateway --port 8821 --stdio
      'npx -y obsidian-mcp-server'"
    ports:
      - "8821:8821"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cognee-data:
