# Valutavalto Backend - Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deployment: Render Dashboard -> New -> Blueprint -> valutavalto-program repo

services:
  # Spring Boot Backend API
  - type: web
    name: valuta-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Port (Render automatikusan allitja)
      - key: PORT
        value: "8080"

      # Spring profil
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # Database (Internal URL - gyorsabb)
      - key: DATABASE_URL
        sync: false  # Render Dashboard-on allitsd be!

      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: valuta-db
          property: connectionString

      # JWT titkositasi kulcs
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION
        value: "86400"

      # Admin kezdo jelszo
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true

      # CORS - Vercel frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: "https://valutavalto.vercel.app,https://*.vercel.app"

      # Logging
      - key: LOG_LEVEL
        value: INFO

databases:
  # PostgreSQL adatbazis (ha meg nincs - egyebkent hasznald a meglevo Render DB-t)
  - name: valuta-db
    plan: free
    region: frankfurt
    databaseName: valutaproduction
    user: zltn
