# Verzió 1 — 2026-05-18

version: 1
last_updated: '2026-05-18'

faq:
  # =====================================================
  # TELEPÍTÉS + ELTÁVOLÍTÓ
  # =====================================================

  - id: telepito_valasztasa
    q: 'Melyik telepítőt használjam?'
    related_module: clients
    keywords: ['telepítés', 'telepítő', 'install', 'setup']
    a: |
      3 telepítő van, mindegyiket az adott munkakörhöz használd:
      - **Pénztáros és értéktáros** kollégák: Penztar-Setup-2.5.55…exe
      - **Főértéktáros és vezetők**: Kozponti-Iranyitokozpont-Setup-2.5.55.exe
      - **Csak főértéktáros, aki napi árfolyamot készít**: Arfolyamkeszito-Setup-2.5.55.exe

      Telepítés előtt MINDIG futtasd a Penztar-Eltavolito-2.5.53-…exe-t a Letöltések mappából.

  - id: eltavolito_kotelezo
    q: 'Mindig kell eltávolítót futtatni a telepítés előtt?'
    related_module: workflows.telepites
    keywords: ['eltávolító', 'uninstall', 'kötelező', 'frissítés', 'upgrade']
    a: |
      Igen, az eltávolító MINDIG futtatandó új telepítés előtt. Ennek két oka:
      1. A régi userData (`%APPDATA%\valuta-penztar`) cache-elt .env fájljai miatt elavult konfiguráció lehet (pl. régi backend URL).
      2. A registry-bejegyzések és tűzfal-szabályok tisztítása.

      Az eltávolító dupla-klikkel indul. UAC "Igen". A kérdésre "adatok megtartása?" → válassz **NEM**-et, így minden kitisztul. A Google bejelentkezési whitelist a szerveren van, helyi cache nem érinti.

  - id: telepito_uac_hiba
    q: 'A telepítő nem indul el, UAC-hiba'
    related_module: workflows.telepites
    keywords: ['UAC', 'rendszergazda', 'engedély']
    a: |
      A Penztar telepítő (HKLM = gépszintű) rendszergazdai jogot igényel. Jobb-klikk a telepítőre → "Futtatás rendszergazdaként". A Központi és Árfolyamkészítő (HKCU = per-user) NEM kér rendszergazdai jogot.

  # =====================================================
  # GOOGLE BEJELENTKEZÉS
  # =====================================================

  - id: google_login_alapok
    q: 'Hogyan jelentkezem be Google fiókkal?'
    related_module: workflows.google_login
    keywords: ['google', 'bejelentkezés', 'login', 'OAuth']
    a: |
      A bejelentkező képernyőn nyomd a "Belépés Google fiókkal" gombot. Választhatsz Google fiókok közül — a céges fiókoddal jelentkezz be (`*.ebc@gmail.com`, `*.eec@gmail.com` vagy `*.epc@gmail.com`).

      Ha több szerepköröd van (pl. főértéktáros + területi vezető), egy "Szerepkör kiválasztása" dialóg jelenik meg — válaszd ki, amelyikkel dolgozni akarsz.

  - id: google_401_hiba
    q: 'Backend HTTP 401 — Google bejelentkezés sikertelen'
    related_error: 'EBC-001'
    keywords: ['401', 'unauthorized', 'google', 'sikertelen']
    a: |
      Ez azt jelenti, hogy a backend nem találja a Google fiókodat a whitelist-en, VAGY régi (v2.5.53 vagy korábbi) telepítőt használsz.

      Megoldás:
      1. Ellenőrizd a verzió-számot a bejelentkező ablakon (kell a v2.5.55 vagy újabb!)
      2. Ha régi verzió: eltávolító + új telepítő (v2.5.55)
      3. Ha v2.5.55 mégis nem megy: küldj Zoltánnak (a) hibaüzenet screenshot, (b) a Google email, (c) milyen szerepkörrel próbáltál belépni

  - id: tobb_munkakor_google_login
    q: 'Mit tegyek, ha több munkakörben dolgozom és Google-lel próbálok belépni?'
    related_module: workers
    keywords: ['munkakör', 'helyettesítés', 'google', 'több szerepkör', 'értéktár', 'főértéktár']
    a: |
      Ha egy kolléga több munkakörben dolgozik (pl. saját értéktárosi pozíció + főértéktárosi helyettesítés + pénztáros-helyettesítés), akkor általában külön Google fiókja van mindegyikhez (vagy egy fiók 7 szerepkörrel):
      1. **Pénztárosi munka helyettesítéskor**: BCrypt jelszó + pénztáros kód (NEM Google) — a Pénztár kliensbe.
      2. **Saját értéktárosi munka**: a saját értéktárosi céges email-lel Google-lel.
      3. **Főértéktárosi munka / helyettesítés**: a főértéktárosi email-lel — a "Szerepkör kiválasztása" dialógus megjelenik, kiválaszthatod a szerepkört.

      Ha nem megy a bejelentkezés: ellenőrizd a v2.5.55 telepítőt. Ha tovább sem: küldj a fejlesztőnek (a) hibaüzenet screenshot, (b) melyik céges Google fiókkal próbáltál, (c) melyik szerepkörrel akartál belépni.

  # =====================================================
  # PÉNZTÁRI MŰKÖDÉS
  # =====================================================

  - id: napnyitas
    q: 'Hogyan nyitom meg a napot?'
    related_module: penztar.napnyitas
    keywords: ['napnyitás', 'nyitás', 'kezdés']
    a: |
      1. Bejelentkezel a Pénztár klienssel
      2. Bal oldalon: "Napnyitás" menüpont
      3. Rögzítsd a nyitó-készletet valutánként (HUF, EUR, USD stb.)
      4. Mentés → státusz: "Nap nyitva" (zöld jelzés a fejlécen)

  - id: vetel_alapok
    q: 'Hogyan rögzítek egy vételt?'
    related_module: penztar.vetel_eladas
    keywords: ['vétel', 'buy', 'tranzakció', 'új']
    a: |
      1. Pénztáros főmenü → "Új tranzakció" gomb (vagy F1 = Vétel)
      2. Bal oszlop: válaszd ki a devizát (pl. EUR, 7-es billentyű)
      3. Középső panel: írd be az összeget (auto-számítja a HUF értéket)
      4. Devizastátusz: Külföldi / Belföldi (kötelező!)
      5. Jobb oldal: ügyfél-azonosítás az összeghatár szerint
      6. "Mentés és nyomtatás" → bizonylat nyomtatódik

  - id: ugyfelazonositas_kuszobertekek
    q: 'Mikor kell az ügyfelet azonosítani?'
    related_module: penztar.vetel_eladas
    keywords: ['AML', 'azonosítás', '100000', '300000', 'PEP']
    a: |
      3 sáv a Pmt. (2017. évi LIII. törvény) szerint, zárt-nyitott intervallumokkal:
      - **100.000 Ft alatt** (< 100.000): NEM kell azonosítani (csak állampolgárság).
      - **100.000 Ft-tól 300.000 Ft-ig** (>= 100.000 és < 300.000): Egyszerűsített azonosítás. Kötelező: név, állampolgárság, születési hely, születési idő. NEM kötelező az okmányszám és okmánytípus (de a kollégánál lehet rögzíteni).
      - **300.000 Ft-tól felfelé** (>= 300.000): Teljes azonosítás. Kötelező MINDEN: név, anyja neve, lakcím, születési adatok, okmányszám, okmánytípus, PEP-nyilatkozat, saját nevében végzi-e.

      Példa: 100.000 Ft = már Egyszerűsített (a határ alsó zárva). 300.000 Ft = már Teljes.

  - id: pep_nyilatkozat
    q: 'Mi az a PEP-nyilatkozat?'
    related_module: penztar.vetel_eladas
    keywords: ['PEP', 'közszereplő', 'saját név']
    a: |
      300.000 Ft feletti tranzakció esetén meg kell kérdezni az ügyfelet:
      1. Politikailag exponált személy-e (PEP)?
      2. Saját nevében végzi-e a tranzakciót, vagy más nevében?

      A program ezt automatikusan kérdezi a tranzakció közben (PR #614 óta). Mindkettő válasz a bizonylatra rákerül.

  - id: napzaras_alapok
    q: 'Hogyan zárom le a napot?'
    related_module: penztar.napzaras
    keywords: ['napzárás', 'zárás', 'wizard', '9 lépés']
    a: |
      Pénztár kliens → "Napzárás" menüpont → 9-lépéses Wizard:
      1. MTCN szám ellenőrzés (Western Union)
      2. Esti pénztár címletezése
      3. Kezelési díj címletezés
      4. Western Union címletezés
      5. ÁFA címletezés
      6. Foglaló címletezés
      7. E-kereskedelem címletezés
      8. Egyéb címletezések (AXA / MoneyGram)
      9. NAV kontroll és napi jelentés
      Mindegyik lépésnél a "Befejezés" gomb. A 9. után a backend végrehajtja a napi zárást.

  # =====================================================
  # ÁRFOLYAMKÉSZÍTÉS
  # =====================================================

  - id: arfolyamkeszites_indul
    q: 'Hogyan készítek árfolyamot?'
    related_module: arfolyamkeszito.folap
    keywords: ['árfolyam', 'készítés', 'RFM', 'elszámoló']
    a: |
      Az Árfolyamkészítő KÜLÖN kliensben fut (`Arfolyamkeszito-Setup-2.5.55.exe`), CSAK főértéktáros tudja használni.

      1. Bejelentkezel a saját főértéktárosi Google fiókoddal
      2. Főlap — Elszámoló árfolyamok (0-s lap) megjelenik
      3. A oszlop = elszámoló (manuálisan EUR/USD/GBP/CHF, többi auto-számolódik a Kereszt forrásból)
      4. "CSOPORTOK KARBANTARTÁSA" → munkacsoport + iroda hozzárendelés
      5. "ÁRFOLYAMOK SZÉTKÜLDÉSE" (zöld gomb) → publikálás Hetzner-re HTTPS-en
      6. A pénztárak 30s-en belül megkapják az új árfolyamot

  - id: arfolyamkeszites_iroda
    q: 'Hogyan rendelek hozzá irodát egy munkacsoporthoz?'
    related_module: arfolyamkeszito.csoportok_karbantartasa
    keywords: ['iroda', 'munkacsoport', 'hozzárendelés']
    a: |
      1. Csoportok karbantartása oldalon
      2. Válaszd ki a workgroupot bal oldalon
      3. "Irodák kezelése" gomb (BranchPickerModal)
      4. Város szerint csoportosítva a 66 EBC iroda
      5. Pipáld a kívánt irodá(ka)t — kereshetsz név/kód/város alapján
      6. "Mentés"

      **Fontos**: Egy iroda CSAK 1 munkacsoportban lehet (V234 óta a backend automatikusan áthelyezi, ha másik workgroupban van).

  # =====================================================
  # HIBÁK ÉS PROBLÉMÁK
  # =====================================================

  - id: program_lefagyott
    q: 'Lefagyott a program, mit csináljak?'
    related_error: 'EBC-099'
    keywords: ['lefagyás', 'fagy', 'nem reagál', 'freeze']
    a: |
      Először: várj 30 másodpercet, hátha csak hálózati lassúság.

      Ha továbbra is fagy:
      1. Bezárás (X gomb a jobb felső sarokban)
      2. Újraindítás (Start Menu vagy asztali parancsikon)
      3. Bejelentkezés újra

      Ha többször előfordul: jegyezzünk fel hibajegyet (a hangsegéddel mondd: "Ne felejtsd el — a program lefagyott a Banki rendelések oldalon").

  - id: nyomtato_nem_ir
    q: 'Nem nyomtatja a blokkot'
    related_error: 'EBC-005'
    keywords: ['nyomtató', 'nyomtatás', 'blokk', 'bizonylat']
    a: |
      1. Ellenőrizd, hogy a Windows-on az EBC blokknyomtató be van-e állítva alapértelmezettként:
         Start → Beállítások → Eszközök → Nyomtatók
      2. Próbáld a "Teszt-nyomtatás"-t (Windows nyomtató beállítások)
      3. Ha Windows OK, de program NEM: jegyezzünk fel hibajegyet a hangsegéddel

  - id: ugyfel_rogzites_hiba
    q: 'Az ügyfelet nem tudom rögzíteni'
    related_error: 'EBC-007'
    keywords: ['ügyfél', 'customer', 'rögzítés', 'duplikált']
    a: |
      Ez PR #607-tel javítva v2.5.55-ben (idempotent upsert).

      Ha mégis hibát látsz:
      - Ellenőrizd, hogy az okmányszám már nem szerepel-e másik ügyfélnél (akkor csak frissül, nem dobja a hibát)
      - A hibaüzenet (toast) most már beszédes — olvasd el a hangsegéddel
      - Ha továbbra is fennáll: jelentsd hibajegyként

  - id: keszlet_negativ
    q: 'Negatív készlettel is enged vételt rögzíteni?'
    related_error: 'EBC-006'
    keywords: ['készlet', 'negatív', 'ellátmány', 'nincs elég']
    a: |
      PR #605 óta NEM engedi. Vételnél (BUY) a backend ellenőrzi, hogy van-e ellátmány. Ha nincs: "Nincs elég pénz a kasszában — a tétel nem rögzíthető" hibaüzenet.

      Korábbi v2.5.53-ban ez bug volt — v2.5.55-tel javítva.

  # =====================================================
  # ÁLTALÁNOS
  # =====================================================

  - id: kapcsolat_zoltan
    q: 'Kit hívjak ha probléma van?'
    keywords: ['támogatás', 'fejlesztő', 'Zoltán', 'kapcsolat']
    a: |
      Email: `kosa.zoltan.ebc@gmail.com`
      Vagy a hangsegéddel mondd: "Készíts erről hibajegyet" — automatikusan elmenti a problémát, és a tesztelés végén egy `.md` fájlt töltesz le, amit Zoltánnak küldhetsz.

  - id: ebc_vs_eec_vs_exz_vs_epc
    q: 'Mi a különbség az EBC, EEC, EXZ, EPC domain-ek között?'
    keywords: ['EBC', 'EEC', 'EXZ', 'EPC', 'domain']
    a: |
      - **EBC** = Exclusive Best Change Zrt. — a Valutaváltó cég kódja (helyes)
      - **EEC** = ugyanaz, történelmi okból néhány email .eec domainű (Fabulya, Hrabina, Veress — V179 seed, szándékos)
      - **EPC** = ugyanaz, Kiss Kornél email-je `.epc` (szándékos, V233)
      - **EXZ** = Exclusive Zálogház — **MÁSIK projekt**, NEM a Valutaváltó! Régen volt szöveg-leak (PR #639 + V232 javítva).

      Ha valami "EXZ" feliratot látsz, az egy hiba (jelentsd be).
