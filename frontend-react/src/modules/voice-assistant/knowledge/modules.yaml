  # ============================================
  # ÁRFOLYAMKÉSZÍTŐ (RFM) — dedikált UI
  # ============================================
  - id: arfolyamkeszito.folap
    client: arfolyamkeszito
    app_mode: rate-maker
    name: "Főlap — Elszámoló árfolyamok (0-s lap)"
    icon: "📝"
    description: "28 valuta × 9 oszlop (A-I) árfolyam-mátrix. A főértéktáros itt állítja be a napi elszámoló árfolyamokat."
    columns:
      A: "Elszámoló (manuál EUR/USD/GBP/CHF + képletes többi)"
      B: "OTP segéd (vételi)"
      C: "Segéd"
      D: "Valuta kód (VÉDETT)"
      E: "Gyenge multis vétel"
      F: "Gyenge multis eladás"
      G: "Kereszt számolt (auto)"
      H: "Kereszt forrás (6 tizedes)"
      I: "Nagybani"
    main_currencies: ["EUR", "USD", "GBP", "CHF"]
    cross_base_eur: ["CZK", "PLN", "RON", "RSD", "BGN", "BAM", "TRY"]
    cross_base_usd: ["ILS", "UAH", "RUB", "CNY", "THB", "BRL", "MXN", "NZD"]

  - id: arfolyamkeszito.csoportok_karbantartasa
    client: arfolyamkeszito
    app_mode: rate-maker
    name: "Csoportok karbantartása"
    icon: "👥"
    description: "Munkacsoportok (workgroups) létrehozása + iroda-hozzárendelés. Anti legacy MunkacsoportEditor modern verziója."
    legacy_parity: "MunkacsoportEditor, IRODAVALASZTOGOMB, BranchPickerModal"
    branch_picker:
      ui: "BranchPickerModal — város szerinti csoportosítás, élő keresés"
      api: "GET /api/v1/rate-creation/branches?workgroupId=<uuid>"
    workgroup_branch_exclusivity: "1 iroda CSAK 1 workgroupban (V234 UNIQUE constraint + move-strategy a backend service-ben)"
    limit_boundaries:
      - "Alsó (Ft)"
      - "Középső (Ft)"
      - "Felső (Ft)"

  - id: arfolyamkeszito.arfolyamok_szetkuldese
    client: arfolyamkeszito
    app_mode: rate-maker
    name: "Árfolyamok szétküldése (publikálás)"
    icon: "📤"
    description: "Idempotens publikálás Hetzner backend-re HTTPS-en. Legacy Anti TAdatSzetkuldes modern verziója."
    legacy_parity: "TAdatSzetkuldes, SZETKULDOGOMB, ARFDATA.DAT FTP-vel"
    api: "POST /api/v1/local-rate-maker/packages/publish"
    headers: ["Idempotency-Key", "Authorization (Bearer JWT)"]
    payload_fields: ["clientPackageId", "clientDeviceId", "clientVersion", "createdAt", "groupId", "clientPackageHash", "rates[]"]
    audit: "Backend rate_publication SQL tábla"

  - id: arfolyamkeszito.internet_cimek
    client: arfolyamkeszito
    app_mode: rate-maker
    name: "Internet címek karbantartása"
    icon: "🌐"
    description: "Hamarosan elérhető funkció (gomb DISABLED v2.5.55 óta). PR #640: 'Phase 2' string-leak törölve."
    status: "DISABLED"

