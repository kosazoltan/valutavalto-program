admin_settings:
  - id: admin.branches
    name: "Irodák"
    description: "Pénztárak/irodák karbantartása. Branch típus (értéktár / többlet-hiány / 1. sz. főpénztár), címlet, kerületi/regionális hozzárendelés."
  - id: admin.workers
    name: "Dolgozók"
    description: "Munkavállalók nyilvántartása. Adatok: név, kód, email, jogosultság (role), Google bejelentkezés engedélyezett-e."
  - id: admin.handling_fee
    name: "Kezelési költség beállítás"
    description: "Központi és irodaspecifikus kezelési költség mérték (V227 óta). PR #605 + #610 hotfix."
  - id: admin.permission_matrix
    name: "Jogosultság mátrix"
    description: "Role-okhoz funkciók hozzárendelése."

