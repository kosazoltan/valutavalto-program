clients:
  - id: penztar
    name: "Pénztár kliens"
    description: "Pénztáros és értéktáros napi munkájához. HKLM telepítés (gépszintű)."
    app_modes:
      - pos
      - vault
    install_location: "C:/Program Files/Valutavalto Penztar/"
    user_data: "%APPDATA%/valuta-penztar/"

  - id: kozponti
    name: "Központi Modul"
    description: "Főértéktárosi és vezetői felügyelet, riportok, audit. HKCU telepítés (per-user)."
    app_modes:
      - full
    install_location: "%LOCALAPPDATA%/Programs/Valutavalto Kozponti Iranyitokozpont/"
    user_data: "%APPDATA%/valutavalto-kozponti-iranyitokozpont/"

  - id: arfolyamkeszito
    name: "Árfolyamkészítő (RFM)"
    description: "Dedikált árfolyam-szerkesztő alkalmazás a főértéktárosnak. A legacy Arfolyam.exe modernizált utódja."
    app_modes:
      - rate-maker
    install_location: "%LOCALAPPDATA%/Programs/Valutavalto Arfolyamkeszito/"
    user_data: "%APPDATA%/valutavalto-arfolyamkeszito/"

modules:

  # ============================================
  # PÉNZTÁR (POS) — 11 menüpont
  # ============================================
  - id: penztar.fomenu
    client: penztar
    app_mode: pos
    name: "Pénztáros főmenü"
    icon: "🏠"
    description: "Irányítópult: mai forgalom, gyorsműveletek, aktuális árfolyamok, legutóbbi tranzakciók."
    cards:
      - "Mai tranzakciók"
      - "Mai forgalom (Ft)"
      - "Aktív ügyfelek"
      - "Függő foglalók"
    quick_actions:
      - "Új tranzakció"
      - "Új ügyfél"
      - "Árfolyamok megtekintése"
      - "Napi zárás"

  - id: penztar.napnyitas
    client: penztar
    app_mode: pos
    name: "Napnyitás"
    icon: "🌅"
    description: "A pénztáros megnyitja a munkanapot, rögzíti a nyitó-készletet."
    workflow:
      - "Pénztáros bejelentkezik kódjával és jelszavával"
      - "Napnyitás menüpont kiválasztása"
      - "Nyitó-készlet rögzítése valutánként"
      - "Mentés → státusz: 'Nap nyitva'"

  - id: penztar.vetel_eladas
    client: penztar
    app_mode: pos
    name: "Valuta vétel / eladás"
    icon: "💱"
    description: "Új tranzakció rögzítése 3-paneles UI-ban (Deviza választás / Tranzakció adatok / Ügyfél adatok). 28 valuta közül választhat, élő MNB+vétel+eladás árfolyammal."
    workflow:
      - "Új tranzakció gomb (vagy F1=Vétel, F2=Eladás)"
      - "Deviza választás (AUD, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HUF stb. — billentyű 1-9)"
      - "VÉTEL vagy ELADÁS toggle"
      - "Összeg beírása (auto HUF-számítás árfolyam × összeg)"
      - "Devizastátusz: Külföldi / Belföldi (KÖTELEZŐ ROGZÍTÉS minden összeghatáron)"
      - "Ügyfél azonosítás összeghatár szerint (lásd customer_identification)"
      - "Mentés és nyomtatás → bizonylat V<3-jegyű kód><6-jegyű sorszám>"
    rules:
      buy_min_amount: 0
      max_per_row: 6  # legacy 6-soros tábla, modern UI 1 sor
    customer_identification:
      - threshold: 100000
        level: "Nem azonosít"
        required: ["állampolgárság"]
      - threshold: 300000
        level: "Egyszerűsített"
        required: ["név", "állampolgárság", "születési hely", "születési idő"]
        optional: ["okmányszám", "okmány típus"]
      - threshold: 999999999
        level: "Teljes azonosítás"
        required: ["név", "állampolgárság", "születési hely", "születési idő", "anyja neve", "lakcím", "okmányszám", "okmány típus", "PEP-nyilatkozat", "saját nevében végzi"]

  - id: penztar.konverzio
    client: penztar
    app_mode: pos
    name: "Konverzió"
    icon: "🔁"
    description: "Két valuta közötti átváltás (pl. USD → EUR). Kétlépéses workflow: Forrás valuta (ügyfél elad) → Cél valuta (ügyfél vesz)."
    workflow:
      - "Konverzió menüpont"
      - "Forrás valuta kiválasztása + összeg"
      - "Számítás (köztes HUF érték)"
      - "Cél valuta kiválasztása (auto kapott összeg)"

  - id: penztar.kassza
    client: penztar
    app_mode: pos
    name: "Kassza / készlet"
    icon: "💰"
    description: "Pénztári készlet áttekintés valutánként, MIN-MAX határokkal."
    common_issues:
      - "HUF készlet a MIN alatt → ⚠️ riasztás"
      - "Egyéb valuták MIN-MAX = 0-999.999.999 → konfigurálatlan, beállítás szükséges"

  - id: penztar.cimletezes
    client: penztar
    app_mode: pos
    name: "Címletezés"
    icon: "🧾"
    description: "HUF címletek (12 darab: 5 bankjegy + 7 érme)."
    denominations:
      bankjegyek: [20000, 10000, 5000, 2000, 1000]
      ermek: [500, 200, 100, 50, 20, 10, 5]

  - id: penztar.ugyfelek
    client: penztar
    app_mode: pos
    name: "Ügyfelek"
    icon: "👤"
    description: "AML-azonosított ügyfelek listája (100k+ tranzakciókhoz)."
    operations: ["keresés név/okmányszám alapján", "új ügyfél felvétele"]

  - id: penztar.uton_levo_csomagok
    client: penztar
    app_mode: pos
    name: "Úton lévő csomagok"
    icon: "📦"
    description: "Pénztárak közötti átadás-átvétel követése, 30s autosync."
    tabs: ["Bejövő (érkező)", "Kimenő (saját küldés)"]

  - id: penztar.napzaras
    client: penztar
    app_mode: pos
    name: "Napzárás"
    icon: "🌙"
    description: "9-lépéses Wizard a nap lezárásához."
    wizard_steps:
      - "MTCN szám ellenőrzés (Western Union)"
      - "Esti pénztár címletezése"
      - "Kezelési díj címletezés"
      - "Western Union címletezés"
      - "ÁFA címletezés"
      - "Foglaló címletezés"
      - "E-kereskedelem címletezés"
      - "Egyéb címletezések (AXA/MoneyGram)"
      - "NAV kontroll és napi jelentés"

  - id: penztar.arfolyamok_nezet
    client: penztar
    app_mode: pos
    name: "Árfolyamok (nézet)"
    icon: "📊"
    description: "Olvasásra-csak árfolyamok — 'csak főértéktár szerkesztheti'."
    columns: ["ALAP (V/E)", "1. SÁV (V/E)", "2. SÁV (V/E)", "MNB"]

  - id: penztar.tranzakciolista
    client: penztar
    app_mode: pos
    name: "Tranzakciólista"
    icon: "📋"
    description: "V/E/K bizonylatok (Vétel/Eladás/Konverzió). Dátum-szűrő, típus szűrő. Művelet ikonok: szem (megnéz), nyomtató (újranyomtat), piros X (sztornó)."
    receipt_prefixes:
      V: "Vétel"
      E: "Eladás"
      K: "Konverzió (átváltás)"

