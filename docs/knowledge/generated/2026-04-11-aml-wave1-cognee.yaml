lessons:
  - Do not trust stale security report snapshots; always re-run the gate.
  - Parity proof must be caller-chain level, not only internal helper level.
  - WU AML needs an explicit fail-closed path when base amount is missing.
  - Sanctions and blacklist controls must be tested for ordering, not only independent blocking.
