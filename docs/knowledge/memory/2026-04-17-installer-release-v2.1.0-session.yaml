  - sha: b73a2c56
    title: "installer: add standalone Penztar-Eltavolito build + deployment README"
    delivered:
      - installer/build-cleanup.ps1 (new, ~45 LOC, compiles Penztar-Cleanup.nsi in ~1s to ~60KB standalone uninstaller EXE)
      - installer/README.md (new, Hungarian operator guide for collegas and build engineers)
      - installer/Penztar-Setup.nsi (NSIS source encoding hardened: UTF-8 accents -> ASCII, em-dashes -> ASCII; Windows-1252 NSIS compiler produced mojibake in EXE VersionInfo before)
      - installer/Penztar-Cleanup.nsi (same encoding fix)
    rationale: NSIS v3.x on Windows compiles source files in ACP (Windows-1252) by default. Previous UTF-8 accented chars + em-dashes (0xE2 0x80 0x94) were being misinterpreted as Windows-1252 bytes (garbage in Product/FileDescription metadata of generated EXE).

