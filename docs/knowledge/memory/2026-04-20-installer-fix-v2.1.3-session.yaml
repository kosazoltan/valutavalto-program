  user_quote_3_setupwizard: "A SetupWizard-nak a legnagyobb problemaja, hogy nem akarja csatlakoztatni a Hetznerhez a lokalisan futo modellt"

root_causes_identified:
  cause_1_dns_api_excvaluta:
    description: "SetupWizard.tsx DEFAULT_API_URL set to api.excvaluta.com, but that aldomain does not resolve"
    evidence_nslookup: "api.excvaluta.com -> Non-existent domain"
    evidence_curl: "excvaluta.com/api/v1/auth/bootstrap-status -> 200 completed:false"
    impact: "Setup Wizard timeouted on Hetzner kapcsolat test, fell back to DEFAULT_BRANCHES"
    files_affected:
      - frontend-react/src/pages/setup/SetupWizard.tsx L49
      - deploy/nginx/nginx.conf
      - deploy/nginx/nginx-initial.conf
      - deploy/docker-compose.prod.yml
      - deploy/.env.example
      - deploy/README.md
      - backend/src/main/resources/application-production.properties (google.redirect.uri)
  cause_2_fake_default_branches:
    description: "DEFAULT_BRANCHES 60 fiktiv Budapest/videki iroda a penztar-client/electron/first-run.ts-ben"
    impact: "Ha Hetzner nem elerheto (cause_1 miatt mindig az), a wizard erre fallback-elt. User valasztott hamis branchet, bootstrap-admin 400"
    code_reference: AdminBootstrapService.java:137
    fix: "DEFAULT_BRANCHES -> KORUT + TISZA (Szeged, EBC company) - valos Hetzner DB seed"
  cause_3_flyway_disabled_local:
    description: "NSIS install+upgrade agban, build-installer.ps1 es build-final.ps1 template mind spring.flyway.enabled=false"
    impact: "Csak JPA ddl-auto=update hozta letre az entity tablakat, de V110-V144 seed-migraciok (company EBC, branches, workers, system_parameter) nem futottak. AdminBootstrapService 400."
    fix: "spring.flyway.enabled=true + baseline-on-migrate=true + out-of-order=true + ddl-auto=none - 144 V-migracio auto-lefut"
  cause_4_cors_too_narrow:
    description: "cors.allowed-origins csak app://localhost"
    fix: "http://localhost:3000,http://localhost:5173,http://localhost:8080,app://localhost,file://"
  cause_5_acl_wrong_sid:
    description: "fix-backend-acl.ps1 NetworkService grantet adott, de a service LocalSystem-kent fut (NSIS L795)"
    fix: "S-1-5-18 (LocalSystem) grant + NetworkService remove"
  cause_6_npm_ci_lock_sync:
    description: "build-installer.ps1 L142 npm ci --silent, de a package-lock.json nem volt sync-ben (missing electron-builder-squirrel-windows transitive deps)"
    fix: "npm install --ignore-scripts --no-audit --no-fund --loglevel=error (elkeruli a node-gyp rebuild VS Build Tools fuggoseget)"

