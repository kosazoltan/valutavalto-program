key_knowledge_for_next_agents:
  bash_heredoc_single_quoted_gotcha:
    discovered_this_session: true
    rule: "Bash heredoc <<SINGLE-QUOTED egy backslash-t lenyel. 4x backslash vagy Python raw string (r...) kell ha literal \r akarsz a Python fajlba irni"
  sed_vs_python_for_nsi:
    encoding: cp1252 Windows-1252 ACP - NSIS 3.x compiler requirement
    simple_csere: sed
    multi_line_insert: "Python raw string + splitlines(keepends=True)"
  dns_reality_check_rule:
    rule: "Mielott hibakeresni kezdenenk a Setup Wizard Hetzner kapcsolatat, ALWAYS curl / nslookup a DEFAULT_API_URL-t - ez az elsodleges DNS trap"
  npm_ci_vs_install:
    rule: "Lock-out-of-sync eseten a build-installer.ps1 npm ci buktat. Hasznalj npm install --ignore-scripts (node-gyp VS Build Tools elkerulese)"

