# 10 reszletes protokoll szekcio (v2 uj)
uj_protokollok_v2:
  1_pr_state_polling:
    api: "GET /repos/{owner}/{repo}/pulls/{number}"
    mezok: [state, draft, merged, mergeable, mergeable_state, head_sha, base_ref]
    blokkolo: "state!=open | draft=true | mergeable=false | mergeable_state!=clean | mergeStateStatus!=CLEAN"
    rule: "mergeable=null eseten POLLING, nem dontes; uj push eseten MINDEN gate-et ujra kell futtatni az uj head_sha-ra"
  2_checks_api_plus_legacy:
    api: "GET /commits/{sha}/check-runs + GET /commits/{sha}/status"
    blokkolo: "status!=completed | conclusion in [failure,timed_out,cancelled,action_required,stale] | legacy combined state!=success"
    rule: "azonos nevu job tobb workflow-ban ambiguity - required check nevnek EGYEDI kell legyen"
  3_workflow_jobs_logs:
    api: "GET /actions/runs?head_sha={sha} + GET /actions/runs/{id}/jobs + gh run view --log-failed"
    blokkolo: "ugyanaz a CI-hiba ketszer ugyanazzal a hipotezissel"
    rule: "failure-log bejegyzes kotelezo (bukott job/step, hibauzenet, feltetelezett ok, modositott fajl, ujrafuttatas eredmenye)"
  4_graphql_review_threads:
    api: "GraphQL: repository.pullRequest.reviewThreads[isResolved,isOutdated,comments]"
    blokkolo: "reviewDecision=CHANGES_REQUESTED | isResolved=false thread"
    rule: "isOutdated=true NEM automatikusan lezart - ellenorizni, hogy a problema tenylegesen megszunt"
  5_rulesets_merge_queue:
    api: "GET /branches/{base}/protection + /rulesets + /rules/branches/{base}"
    blokkolo: "ruleset enforcement=evaluate nem veder | bypass actor admin/humán review nelkul | allow_force_pushes=true | allow_deletions=true"
    merge_queue_trigger: "on: { pull_request:, merge_group: }"
  6_dependency_slopsquatting:
    kotelezo_ellenorzes:
      - "registry letezes pontos nevegyezessel"
      - "minimum verzio es lockfile jelenlét"
      - "npm preinstall/install/postinstall script audit"
      - "hivatalos registry URL a PR leirasban"
      - "license policy"
      - "dependency-review + Dependabot alert"
      - "uj/ismeretlen csomag -> humán approval"
    tool: "actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9"
  7_lockfile_integrity:
    kotelezo_parancsok:
      npm: "npm ci (NEM npm install!)"
      pnpm: "pnpm install --frozen-lockfile"
      python: "pip install --require-hashes"
    blokkolo: "lockfile nelkuli modositas | lockfile/manifest elteres | HTTP registry | ismeretlen registry | hianyzo integrity/hash"
  8_github_actions_hardening:
    kotelezo_workflow:
      top_level: "permissions: contents: read (vagy read-all)"
      iras: "csak job-szinten, indokolt"
      third_party_action: "CSAK teljes commit SHA-val (nem tag/branch)"
      pull_request_target_fork: "TILOS, kiveve explicit security-approved workflow"
      untrusted_input: "env-en keresztul, NEM kozvetlenul run: scriptben"
    openssf_scorecard_checkek:
      - "Token-Permissions (magas kockazat ha nem least privilege)"
      - "Dangerous-Workflow (kritikus: untrusted checkout, pull_request_target, shell context interpolation)"
  9_release_artifact_bizonyitas:
    sbom: "SPDX vagy CycloneDX"
    attestation: "gh attestation verify ./dist/app --repo $OWNER/$REPO"
    container: "scan high/critical nelkul"
    release_kapuk:
      - "build artifact letezik"
      - "SBOM generalva"
      - "attestation ellenorizve"
      - "image alairva (ha image deploy)"
      - "production environment required reviewer approval"
      - "release artifact ugyanazhoz a head_sha/tag SHA-hoz kotodik ahol a checks zoldek voltak"
  10_bizonyitasi_minimum:
    kotelezo_valasz_vege_mezok:
      - modell_es_szerep
      - pr_azonosito
      - head_sha_es_ellenorzes_idopont
      - lokalis_ellenorzesek_output
      - checks_api_statusz
      - legacy_statuses
      - workflow_log
      - review_state_es_unresolved_threadek
      - codex_futott_findingek
      - sourcery_futott_findingek
      - dependabot
      - codeql
      - secret_scanning
      - branch_ruleset_allapot
      - supply_chain_dependency_diff
      - deploy_artifact_sbom_attestation

