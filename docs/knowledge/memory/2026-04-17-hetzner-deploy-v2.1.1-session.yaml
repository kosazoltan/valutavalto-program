bugs_discovered_and_fixed:
  bug_1_postgres_down_6_days:
    detection: "pg_lsclusters Status=down; journalctl -u postgresql@16-main.service"
    root_cause: "pgdata-luks.service exit 5 (Device already exists) on second run, cascade failure"
    duration_offline: "~6 days 11 hours (2026-04-11 06:58 UTC -> 2026-04-17 18:03 UTC)"
    user_impact: "Login silent fail in fresh v2.1.1 install; Cloudflare 502 Bad Gateway surfaced to users as '401 Unauthorized' in browser html"
    fix_applied: "systemctl reset-failed + patched unit to idempotent ExecStart bash -c checks"
    fix_persistence: "unit file rewritten on server; survives reboot"
    fix_committed_to_repo: false
    commit_recommendation: "deploy/hetzner/systemd/pgdata-luks.service (new path)"

  bug_2_luks_unit_idempotency:
    unit: /etc/systemd/system/pgdata-luks.service
    original_issue: "Type=oneshot ExecStart /sbin/cryptsetup luksOpen fails with exit 5 if device already mapped"
    new_unit_content: |
      [Unit]
      Description=Open LUKS encrypted PostgreSQL data volume
      Before=postgresql@16-main.service
      After=local-fs.target
      
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/bash -c 'cryptsetup status pgdata-crypt >/dev/null 2>&1 || cryptsetup luksOpen /opt/pgdata-encrypted.img pgdata-crypt --key-file /root/.pgdata-luks-key'
      ExecStart=/bin/bash -c 'mountpoint -q /mnt/pgdata-encrypted || mount /dev/mapper/pgdata-crypt /mnt/pgdata-encrypted'
      ExecStop=/bin/bash -c 'mountpoint -q /mnt/pgdata-encrypted && umount /mnt/pgdata-encrypted || true'
      ExecStop=/bin/bash -c 'cryptsetup status pgdata-crypt >/dev/null 2>&1 && cryptsetup luksClose pgdata-crypt || true'
      
      [Install]
      WantedBy=multi-user.target

  bug_3_flyway_null_uuid:
    migrations_affected:
      - V143__nav_vat_rate_parameters.sql
      - V144__admin_bootstrap_flag.sql
    root_cause: "system_parameter.id is UUID NOT NULL without DEFAULT; Spring JPA generates via @GeneratedValue but Flyway SQL bypasses JPA layer"
    error: "ERROR: null value in column 'id' of relation 'system_parameter' violates not-null constraint"
    fix: "Added `id` column with gen_random_uuid() to INSERT statements"
    commit: 47acfab6
    future_prevention_option: "ALTER TABLE system_parameter ALTER COLUMN id SET DEFAULT gen_random_uuid()"

  bug_4_systemd_jar_hardcode:
    service_unit: valuta-backend.service
    hardcoded_path: /opt/valutavalto/backend/target/valuta-backend-1.0.0-SNAPSHOT.jar
    problem_at_bump: "maven produces valuta-backend-<VERSION>.jar, not -SNAPSHOT"
    workaround_applied: "cp valuta-backend-<VERSION>.jar valuta-backend-1.0.0-SNAPSHOT.jar + chown valuta:valuta"
    workaround_location_evidence: 
      - "/opt/valutavalto/backend/target/valuta-backend-2.1.1.jar (built)"
      - "/opt/valutavalto/backend/target/valuta-backend-1.0.0-SNAPSHOT.jar (copy)"
    future_recommendation: "symlink: ln -sf .../valuta-backend-<VERSION>.jar .../valuta-backend-current.jar; update unit to -current.jar"

