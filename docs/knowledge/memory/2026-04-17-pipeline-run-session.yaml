local_db_preflight_bootstrap:
  strategy: mirror-production-schema-model
  reason: legacy hibernate-ddl-auto=update in production caused schema drift; many V*.sql migrations (V4..V66) cannot execute cleanly on an empty DB due to inter-migration dependencies (audit_log, system_parameter, rate_template.currency_id type, customer columns, index name collisions)
  steps:
    - step: drop-and-recreate-public-schema
    - step: spring-boot-run-once-with-flyway-disabled-and-ddl-auto=update
      outcome: 178 tables created by Hibernate from JPA entities (matches production baseline)
    - step: seed-flyway_schema_history-with-all-V*.sql-entries
      details: each entry success=true, checksum=0, installed_by=local-preflight-bootstrap
    - step: DB_PREFLIGHT_REMOTE_MODE=optional
      details: allow preflight to pass when remote/Neon DB is unreachable from local dev env
  migrations_patched_for_future_fresh_bootstrap:
    - V25__audit_log.sql: idempotent CREATE TABLE IF NOT EXISTS audit_log prepended (matches V74 schema)
    - V32__rate_history.sql: unique index names + IF NOT EXISTS (avoids idx_rate_history_currency collision with V3)
    - V52__rate_management_tables.sql: rate_template.currency_id UUID -> BIGINT (matches currency.id BIGSERIAL from V3)
    - V43__pos_terminal_config.sql: prepended ALTER TABLE system_parameter ADD COLUMN IF NOT EXISTS created_at (Hibernate parity)
    - V56__customer_seed_data.sql: ALTER TABLE customer ADD COLUMN IF NOT EXISTS is_foreign/is_pep + DO $seed$ block (skips seed if company tabla ures, nem tor a not-null constraint)
  env_var_auto_loaded:
    - key: DB_PREFLIGHT_REMOTE_MODE
      value: optional
      source: .env (gitignored, local dev only)
      rationale: Neon remote DB nem mindig elerheto fejlesztogeprol; prod CI/CD-ben strict default lesz
