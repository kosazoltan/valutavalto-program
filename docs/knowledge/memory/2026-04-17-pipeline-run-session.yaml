    - id: CB-018
      module: TransactionService + TransactionConversionService + TransactionOperationHelper
      parity_before_fix: broken
      details: AmlBasicCheckResult.suspiciousFlag and annualLimitReached were computed but never persisted on Transaction entity
      fix: performAmlCheck return type changed from void to AmlBasicCheckResult; callers set transaction.amlSuspicious and transaction.amlAnnualLimitReached
      fix_status: applied
      regression_test: TransactionConversionServiceTest#executeConversion_propagatesAmlFlagsToTransactionEntity
    - id: CB-004
      module: TransactionConversionService + ConversionRequest + ConversionRequestDto + TransactionMapper
      parity_before_fix: partial
      details: CONVERSION transaction was missing customerAddress, customerDocumentNumber, customerNationality, sourceOfFunds, customerIsPep
      fix: extended DTO+request+mapper, populated on parent CONVERSION transaction
      fix_status: applied
      regression_test: TransactionConversionServiceTest#executeConversion_propagatesAmlFlagsToTransactionEntity
    - module: TransactionConversionService.executeConversion
      parity: gap4-correct
