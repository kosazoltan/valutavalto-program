# Valutavalto ERP — Production Docker Compose
# Hetzner CPX31 (<SERVER_IP>)
#
# Hasznalat:
#   1. cp .env.example .env && nano .env  (kitolteni!)
#   2. docker compose -f docker-compose.prod.yml up -d
#
# Elso inditas (SSL bootstrap): lasd README.md

services:
  nginx:
    image: nginx:alpine
    container_name: valuta-nginx
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - valuta-backend
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  valuta-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: valuta-backend
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DATABASE_URL=jdbc:postgresql://postgres:5432/valuta
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=https://${DOMAIN:-excvaluta.com}/api/v1/email/accounts/callback
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT:-}
      - ERRORLOG_HMAC_SECRET=${ERRORLOG_HMAC_SECRET:-}
      - CORS_ALLOWED_ORIGINS=https://excvaluta.com,https://www.excvaluta.com,https://valutavalto.vercel.app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    # Security: read-only filesystem + tmp mappa
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  postgres:
    image: postgres:16-alpine
    container_name: valuta-postgres-prod
    environment:
      - POSTGRES_DB=valuta
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql-custom.conf:/etc/postgresql/postgresql-custom.conf:ro
      - ./postgres/init-pgaudit.sh:/docker-entrypoint-initdb.d/init-pgaudit.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql-custom.conf
        -c hba_file=/var/lib/postgresql/data/pg_hba.conf
    # BIZTONSAG: NINCS host port mapping — csak Docker network-on erheto el!
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  certbot:
    image: certbot/certbot
    container_name: valuta-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  pgdata:
  certbot-data:
  certbot-webroot:
  nginx-logs:
