# Valutavalto — PostgreSQL Security Hardening
# Ezt a fajlt a Docker Compose volume-kent mountolja

# --- pgAudit ---
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'ddl, role, write'
pgaudit.log_catalog = off
pgaudit.log_level = 'log'
pgaudit.log_statement_once = on

# --- Connection Security ---
password_encryption = 'scram-sha-256'
ssl = off
# SSL-t az Nginx kezeli, a DB csak Docker network-on erheto el

# --- Logging ---
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'Europe/Budapest'

# --- Performance (75 penztar) ---
max_connections = 60
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# --- Security ---
row_security = on
