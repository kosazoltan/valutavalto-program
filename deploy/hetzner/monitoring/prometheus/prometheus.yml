global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hetzner-prod
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: valuta-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          service: valuta-backend
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:2019']
