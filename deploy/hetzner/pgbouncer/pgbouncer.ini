; PgBouncer konfig - transaction pool mode (vezerlokonyv par.26.3)
; Elony: Spring Boot HikariCP 40 kapcsolata -> 1-2 tenyleges PostgreSQL kapcsolat

[databases]
valuta = host=127.0.0.1 port=5432 dbname=valuta

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; POOL MODE
pool_mode = transaction

; POOL MERETEK
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

; TIMEOUT-ok
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0

; LOG
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ADMIN (opcionalis)
admin_users = postgres
stats_users = postgres, postgres_exporter

; TLS
server_tls_sslmode = prefer

; PERF
application_name_add_host = 1
