# Nginx — Production konfiguracio
# SSL termination + reverse proxy + WebSocket support

events {
    worker_connections 1024;
}

http {
    # Alap beallitasok
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Gzip tomorities
    gzip on;
    gzip_types application/json text/plain application/javascript;

    # Upstream
    upstream backend {
        server valuta-backend:8080;
    }

    # HTTP -> HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name api.excvaluta.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS szerver
    server {
        listen 443 ssl;
        http2 on;
        server_name api.excvaluta.com;

        # SSL tanusitvanyok (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/api.excvaluta.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.excvaluta.com/privkey.pem;

        # SSL beallitasok
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout beallitasok
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket endpoint
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Actuator health (monitoring)
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
