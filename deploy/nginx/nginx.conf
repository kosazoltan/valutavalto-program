# Nginx — Production konfiguracio
# SSL termination + reverse proxy + WebSocket support + security hardening

events {
    worker_connections 1024;
}

http {
    # Alap beallitasok
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Server tokens elrejtese (verzio szam ne latszodjon)
    server_tokens off;

    # Gzip tomorities
    gzip on;
    gzip_types application/json text/plain application/javascript;

    # Rate limiting zone-ok (Fail2ban-nel integralt)
    # Login: 5 keres/perc IP-nkent
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # API tranzakciok: 60 keres/perc IP-nkent
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Altalanos: 120 keres/perc IP-nkent
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

    # Logging (Fail2ban szamara is)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream
    upstream backend {
        server valuta-backend:8080;
    }

    # HTTP -> HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name excvaluta.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS szerver
    server {
        listen 443 ssl;
        http2 on;
        server_name excvaluta.com;

        # SSL tanusitvanyok (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/excvaluta.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/excvaluta.com/privkey.pem;

        # SSL beallitasok — modern konfiguracio
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers — teljes vedelem
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # Login endpoint — szigoru rate limit (5/perc + burst 3)
        location /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tranzakcios endpointok — kozepesen szigoru rate limit (60/perc)
        location ~ ^/api/v1/(transactions|pos-terminal) {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy — altalanos rate limit (120/perc)
        location / {
            limit_req zone=general burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout beallitasok
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket endpoint — nincs rate limit (hosszu eletű kapcsolat)
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Actuator health (monitoring) — nincs rate limit
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Blokkolt utak — rejtett fajlok, scannerek
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            deny all;
            return 404;
        }
    }
}
