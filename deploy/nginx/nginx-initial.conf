# Nginx — SSL Bootstrap konfiguracio
# Csak az elso certbot futtatashoz — utana csereld nginx.conf-ra!

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name excvaluta.com;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (amig nincs SSL)
        location /actuator/health {
            proxy_pass http://valuta-backend:8080;
        }

        # Minden mas — 503 (meg nincs SSL)
        location / {
            return 503 '{"error":"SSL bootstrap in progress"}';
            add_header Content-Type application/json;
        }
    }
}
