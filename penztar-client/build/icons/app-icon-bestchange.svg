<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Piros háttér -->
  <rect width="512" height="512" rx="128" fill="#DC2626"/>
  
  <!-- "BC" betűk fehér színnel -->
  <text x="256" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">BC</text>
  
  <!-- Valuta szimbólum alul -->
  <g transform="translate(256, 420)">
    <!-- € szimbólum -->
    <text x="-30" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">€</text>
    <!-- $ szimbólum -->
    <text x="30" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">$</text>
  </g>
</svg>
