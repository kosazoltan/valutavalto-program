version: 2

# Audit-fix 2026-04-27 P1 (Sourcery rate-limit kontroll):
# A 21 PR egy napon (mind 4 ecosystem heti weekly + sok dep) elhasznalja a Sourcery
# free tier weekly rate-limit-jet (1.5M diff char). Megoldas:
#   - `open-pull-requests-limit: 3` per ecosystem (default 5) -> max 12 nyitott osszesen
#   - `groups`: minor + patch egy PR-be osszevonva -> kb. 50% kevesebb diff/PR
#   - csak `production` deps frontend-en (test-only deps mentesek a hetente kell-e check-ben)
# Ezzel a Sourcery rate-limit nem kerul elhasznalva mar a kedd esti batch-en.
# Frissites 2026-07-28 (PR #1506): ket uj npm ecosystem bejegyzes kerult be
# (kozponti-client, arfolyam-keszito-client) -> akkor 6 ecosystem.
# 2026-08-11: az arfolyam-keszito-client torolve -> jelenleg 5 ecosystem.
# Az open-pull-requests-limit valtozatlanul 3/ecosystem -> max 15 nyitott PR.

updates:
  # Backend (Java / Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "java"

  # Penztar-client (Electron + React + Node)
  - package-ecosystem: "npm"
    directory: "/penztar-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 3
    groups:
      penztar-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "electron"

  # Kozponti-client (Electron kozponti munkaallomas, rate-maker moddal)
  - package-ecosystem: "npm"
    directory: "/kozponti-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 3
    groups:
      kozponti-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "electron"

  # Frontend-react (React 19 admin UI)
  - package-ecosystem: "npm"
    directory: "/frontend-react"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "react"

  # GitHub Actions workflow-k
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 3
    groups:
      gh-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
