name: HA Diagnose (read-only)

# KIZÁRÓLAG OLVASÓ HA-diagnosztika a Hetzner primary <-> Scaleway standby topológián.
# Célja: kideríteni, miért áll vissza a Hetzner prod 'valuta' DB egy elavult (V326)
# snapshotra a sikeres V327-V329 migráció után (RUB-visszaállítás, 2026-06-15).
# NEM módosít semmit: csak SELECT / pg_is_in_recovery / pg_stat_* / systemctl status /
# log-tail. Nincs promote, nincs write, nincs restart.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-diagnose:
    name: Read-only HA topology + replication check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH keys (both nodes)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_key
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 'Hetzner PRIMARY — DB + replikáció állapot (read-only)'
        run: |
          ssh -i ~/.ssh/hetzner_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== HETZNER ($(hostname)) ==="
            echo "pg_is_in_recovery : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)  (t=standby, f=primary)"
            echo "max migráció      : V$(sudo -u postgres psql -d valuta -tAc "SELECT max(version::int) FROM flyway_schema_history WHERE version ~ '^[0-9]+$'" 2>/dev/null)"
            echo "RUB.is_active     : $(sudo -u postgres psql -d valuta -tAc "SELECT is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "curr_stock VAULT  : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM currency_stock WHERE entity_type='VAULT'" 2>/dev/null)"
            echo ""
            echo "--- pg_stat_replication (ha primary: csatlakozott standby-k) ---"
            sudo -u postgres psql -d valuta -c "SELECT client_addr, state, sync_state, write_lag, replay_lag FROM pg_stat_replication" 2>/dev/null || echo "(nincs / nem primary)"
            echo "--- pg_replication_slots ---"
            sudo -u postgres psql -d valuta -c "SELECT slot_name, slot_type, active, restart_lsn FROM pg_replication_slots" 2>/dev/null || echo "(nincs slot)"
            echo "--- pg_stat_wal_receiver (ha standby: honnan replikál) ---"
            sudo -u postgres psql -d valuta -c "SELECT status, sender_host, latest_end_lsn, last_msg_receipt_time FROM pg_stat_wal_receiver" 2>/dev/null || echo "(nincs WAL receiver — nem standby)"
            echo "--- recovery/standby jelek a PGDATA-ban ---"
            PGDATA=$(sudo -u postgres psql -tAc "SHOW data_directory" 2>/dev/null)
            echo "PGDATA=$PGDATA"
            sudo ls -la "$PGDATA"/standby.signal "$PGDATA"/recovery.signal 2>/dev/null || echo "(nincs standby.signal/recovery.signal — valódi primary)"
            echo "--- valuta-backend uptime ---"
            systemctl show valuta-backend.service --property=ActiveEnterTimestamp --value 2>/dev/null
          ENDSSH

      - name: 'Scaleway STANDBY — DB + watchdog failover-log (read-only)'
        if: always()
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== SCALEWAY ($(hostname)) ==="
            echo "pg_is_in_recovery : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)  (t=standby, f=PROMOTED!)"
            echo "max migráció      : V$(sudo -u postgres psql -d valuta -tAc "SELECT max(version::int) FROM flyway_schema_history WHERE version ~ '^[0-9]+$'" 2>/dev/null)"
            echo "RUB.is_active     : $(sudo -u postgres psql -d valuta -tAc "SELECT is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "last WAL replay   : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_last_wal_replay_lsn()" 2>/dev/null)"
            echo "last replay ts    : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_last_xact_replay_timestamp()" 2>/dev/null)"
            echo ""
            echo "--- primary-watchdog service állapot ---"
            systemctl is-active primary-watchdog.service 2>/dev/null || systemctl is-active primary-watchdog.timer 2>/dev/null || echo "(nincs primary-watchdog unit)"
            echo "--- watchdog state file ---"
            cat /var/lib/primary-watchdog/state 2>/dev/null || echo "(nincs state file)"
            echo "--- failover-log (utolsó 25 sor) ---"
            tail -25 /var/log/primary-watchdog-failover.log 2>/dev/null || echo "(nincs failover-log — sosem promote-olt)"
          ENDSSH
