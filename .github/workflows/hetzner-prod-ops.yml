name: Hetzner Prod Ops (write)

# Igeny szerinti, IRO prod-muveletek a Hetzner 'valuta' DB-n / valuta-backend systemd env-jen,
# a meglevo deploy-secret SSH-kulccsal (ugyanaz, amivel a deploy-hetzner.yml dolgozik).
# Ket, egymastol fuggetlen muvelet a 'action' choice mogott:
#   * rub-reactivate   -> a prod RUB.is_active=true (egyezzen a V327 kod-szandekkal — a RUB
#                         megis forgalmazott; a 2026-06-12-i V319 teves user-infon alapult). Idempotens UPDATE.
#   * neon-sync-enable -> a backup-szinkron bekapcsolasa: a box /opt/valutavalto/backend/.env-be
#                         NEON_SYNC_ENABLED=true + NEON_DATABASE_URL (repo-secret), majd backend restart.
# A NEON_DATABASE_URL ertek base64-en megy at, sehol nem jelenik meg a logban (GitHub maszkolja is).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Melyik prod-muvelet fusson'
        required: true
        type: choice
        options:
          - rub-reactivate
          - neon-sync-enable
          - neon-sync-rollback
          - neon-sync-verify
          - ha-disable-failover
          - ha-backup-to-neon

permissions:
  contents: read

jobs:
  prod-op:
    name: 'Prod write op: ${{ github.event.inputs.action }}'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          # Scaleway standby kulcs (a HA-muveletekhez, pl. ha-disable-failover)
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 'HA auto-failover LEALLITAS (Scaleway watchdog stop+disable)'
        if: ${{ github.event.inputs.action == 'ha-disable-failover' }}
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== HA auto-failover leallitas a Scaleway standby-n ==="
            echo "DONTES (Kosa, 2026-06-15): a Neon a primary -> a lokalis Hetzner<->Scaleway"
            echo "streaming-HA elavult, es a torott replikacioval (2026-06-14 15:00 ota) az"
            echo "auto-failover VESZELYES (elavult standby promote + DNS-atiranyitas)."
            echo ""
            echo "elotte (watchdog timer/service):"
            systemctl is-active primary-watchdog.timer 2>/dev/null || echo "  timer: inactive/nincs"
            systemctl is-active primary-watchdog.service 2>/dev/null || echo "  service: inactive/nincs"
            echo "--- stop + disable ---"
            systemctl stop primary-watchdog.timer 2>/dev/null || true
            systemctl disable primary-watchdog.timer 2>/dev/null || true
            systemctl stop primary-watchdog.service 2>/dev/null || true
            systemctl disable primary-watchdog.service 2>/dev/null || true
            echo ""
            echo "utana (read-only verify):"
            echo "  timer enabled : $(systemctl is-enabled primary-watchdog.timer 2>/dev/null || echo 'disabled/nincs')"
            echo "  timer active  : $(systemctl is-active primary-watchdog.timer 2>/dev/null || echo 'inactive')"
            echo "  service active: $(systemctl is-active primary-watchdog.service 2>/dev/null || echo 'inactive')"
            echo "VISSZAALLITAS (ha megis kell): systemctl enable --now primary-watchdog.timer"
            echo "=== Kesz — az auto-failover NEM fut tobbe ==="
          ENDSSH

      - name: 'B2-backup atallitas a Neon PROD DB-re (onellenorzo, auto-rollback)'
        if: ${{ github.event.inputs.action == 'ha-backup-to-neon' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            SCRIPT=/usr/local/bin/valuta-db-backup.sh
            ENVF=/opt/valutavalto/backend/.env
            echo "=== B2-backup atallitas a Neon PROD DB-re (DONTES: Neon a primary) ==="
            [ -f "$SCRIPT" ] || { echo "::error::nincs $SCRIPT"; exit 1; }
            NEON_URL=$(grep '^NEON_DATABASE_URL=' "$ENVF" 2>/dev/null | cut -d= -f2-)
            if [ -z "$NEON_URL" ]; then echo "::error::NEON_DATABASE_URL ures/hianyzik a .env-ben — NINCS valtoztatas"; exit 1; fi
            echo "Neon host: $(echo "$NEON_URL" | sed -E 's#.*@##; s#[/?].*##')"
            # A Neon PostgreSQL 17 -> a dumphoz pg_dump 17+ kell (a box default 16-os kliense
            # 'server version mismatch'-csel elszall). Telepitjuk a pgdg-repobol, ha hianyzik.
            PGD17=/usr/lib/postgresql/17/bin/pg_dump
            if [ ! -x "$PGD17" ]; then
              echo "--- postgresql-client-17 telepitese (pgdg) ---"
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 || { echo "::error::postgresql-client-17 telepites sikertelen"; exit 1; }
            fi
            [ -x "$PGD17" ] || { echo "::error::nincs $PGD17 a telepites utan sem"; exit 1; }
            echo "pg_dump 17 verzio: $("$PGD17" --version)"
            if grep -q '/usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL"' "$SCRIPT"; then
              echo "A backup-script MAR a Neonra (pg17) mutat — idempotens, nincs teendo."; exit 0
            fi
            BAK="$SCRIPT.bak.$(date +%Y%m%d%H%M%S)"
            cp -a "$SCRIPT" "$BAK"; echo "biztonsagi masolat: $BAK"
            # Surgical patch: a pg_dump forras a lokalis 'valuta' helyett a Neon (URL a .env-bol, pg_dump 17-tel)
            sed -i 's#^sudo -u postgres pg_dump -Fp valuta#NEON_DATABASE_URL=$(grep "^NEON_DATABASE_URL=" /opt/valutavalto/backend/.env | cut -d= -f2-); /usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL" -Fp#' "$SCRIPT"
            if ! grep -q '/usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL"' "$SCRIPT"; then
              echo "::error::a patch NEM alkalmazodott (a pg_dump sor eltert a vartol) — visszaallitas"; cp -a "$BAK" "$SCRIPT"; exit 1
            fi
            echo "--- TESZT-FUTAS: a patchelt backup-script (valodi Neon-dump + B2-feltoltes) ---"
            if bash "$SCRIPT"; then
              LATEST=$(ls -t /var/backups/valuta/valuta-*.sql.gz 2>/dev/null | head -1)
              SZ=$(stat -c%s "$LATEST" 2>/dev/null || echo 0)
              HAS=$(gunzip -c "$LATEST" 2>/dev/null | grep -cE 'currency' || true)
              echo "teszt-dump: $LATEST | meret=$SZ byte | 'currency' nyom=$HAS"
              if [ "${SZ:-0}" -lt 10000 ] || [ "${HAS:-0}" -lt 1 ]; then
                echo "::error::a Neon teszt-dump ures/gyanus (meret=$SZ, currency=$HAS) — VISSZAALLITAS a lokalis backupra"; cp -a "$BAK" "$SCRIPT"; exit 1
              fi
              echo "=== OK — a B2-backup mostantol a NEON PROD DB-t menti; teszt-dump validalva. ==="
              echo "Visszaallitas (ha kell): cp -a $BAK $SCRIPT"
            else
              echo "::error::a patchelt backup-script FUTASA sikertelen — VISSZAALLITAS a lokalis backupra"; cp -a "$BAK" "$SCRIPT"; exit 1
            fi
          ENDSSH

      - name: 'RUB reaktivalas (prod, idempotens)'
        if: ${{ github.event.inputs.action == 'rub-reactivate' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== RUB reaktivalas a prod 'valuta' DB-n (V327 kod-szandek) ==="
            echo "elotte : $(sudo -u postgres psql -d valuta -tAc "SELECT code||'.is_active='||is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            sudo -u postgres psql -d valuta -c "UPDATE currency SET is_active=true, updated_at=NOW() WHERE code='RUB' AND is_active=false;"
            echo "utana  : $(sudo -u postgres psql -d valuta -tAc "SELECT code||'.is_active='||is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "aktiv valutak  : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FILTER (WHERE is_active) FROM currency" 2>/dev/null)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon backup-szinkron bekapcsolas (prod .env + restart)'
        if: ${{ github.event.inputs.action == 'neon-sync-enable' }}
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_URL" ]; then
            echo "::error::NEON_DATABASE_URL repo-secret ures/hianyzik — allitsd be elobb."
            exit 1
          fi
          B64=$(printf '%s' "$NEON_URL" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEON_URL_B64='$B64' bash -s" << 'ENDSSH'
            set -o pipefail
            ENVFILE=/opt/valutavalto/backend/.env
            echo "=== Neon backup-szinkron bekapcsolas: $ENVFILE modositas ==="
            NEON_URL=$(printf '%s' "$NEON_URL_B64" | base64 -d)
            if [ -z "$NEON_URL" ]; then echo "::error::ures NEON_URL a dekodolas utan"; exit 1; fi
            # Biztonsagi masolat (visszaallithatosag) — ezt allitja vissza az auto-rollback is
            BAK="$ENVFILE.bak.$(date +%Y%m%d%H%M%S)"
            cp -a "$ENVFILE" "$BAK"
            # Idempotencia: korabbi NEON_SYNC_ENABLED / NEON_DATABASE_URL sorok eltavolitasa
            sed -i '/^NEON_SYNC_ENABLED=/d; /^NEON_DATABASE_URL=/d' "$ENVFILE"
            # KRITIKUS: zaro sortores garancia — kulonben a >> az utolso sorra (fo DB-jelszo) tapad
            # es elrontja a fo DB-kapcsolatot (ez okozta a korabbi 502-t).
            [ -n "$(tail -c1 "$ENVFILE")" ] && printf '\n' >> "$ENVFILE"
            printf 'NEON_SYNC_ENABLED=true\n' >> "$ENVFILE"
            printf 'NEON_DATABASE_URL=%s\n' "$NEON_URL" >> "$ENVFILE"
            chown valuta:valuta "$ENVFILE"
            chmod 600 "$ENVFILE"
            # VALIDACIO: a ket uj sornak pontosan sor-elejen kell allnia (kulonben append-corrupcio)
            OK_EN=$(grep -c '^NEON_SYNC_ENABLED=true$' "$ENVFILE" || true)
            OK_URL=$(grep -c '^NEON_DATABASE_URL=' "$ENVFILE" || true)
            if [ "$OK_EN" != "1" ] || [ "$OK_URL" != "1" ]; then
              echo "::error::.env validacio BUKOTT (NEON_SYNC_ENABLED=$OK_EN, NEON_DATABASE_URL=$OK_URL) — append-corrupcio, visszaallitas restart NELKUL"
              cp -a "$BAK" "$ENVFILE"; chown valuta:valuta "$ENVFILE"; chmod 600 "$ENVFILE"
              exit 1
            fi
            echo ".env frissitve es validalva (NEON_SYNC_ENABLED + NEON_DATABASE_URL sor-elejen, jelszo nem logolva)"
            echo "NEON_DATABASE_URL host: $(echo "$NEON_URL" | sed -E 's|.*@||; s|/.*||')"
            echo "=== valuta-backend.service restart ==="
            systemctl restart valuta-backend.service
            sleep 18
            # Health — ha NEM all fel 200-ra, AUTO-ROLLBACK (a prod NEM maradhat 502-n)
            HEALTHY=0
            for i in 1 2 3 4 5 6 7 8; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
              echo "health attempt $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { HEALTHY=1; break; }
              sleep 10
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "::error::backend NEM all fel 200-ra a Neon-bekapcsolas utan — AUTO-ROLLBACK"
              journalctl -u valuta-backend.service -n 50 --no-pager
              cp -a "$BAK" "$ENVFILE"; chown valuta:valuta "$ENVFILE"; chmod 600 "$ENVFILE"
              systemctl restart valuta-backend.service
              sleep 18
              for i in 1 2 3 4 5 6; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
                echo "rollback health attempt $i: HTTP $CODE"
                [ "$CODE" = "200" ] && { echo "=== AUTO-ROLLBACK OK — prod helyreallt, a Neon-bekapcsolas NEM sikerult ==="; exit 1; }
                sleep 10
              done
              echo "::error::AUTO-ROLLBACK utan sem 200 — KEZI beavatkozas kell"
              exit 1
            fi
            echo "service 200 — Neon bean log: $(journalctl -u valuta-backend.service -n 500 --no-pager | grep -o 'Neon DataSource konfigural[^\"]*' | tail -1 || echo '(nincs log-sor)')"
            # Az elso scheduled sync (fixedDelay) ~indulaskor fut; varjunk ra es nezzuk a logot
            echo "=== Neon sync-log varas (max ~60s) ==="
            for i in 1 2 3 4 5 6; do
              ROWS=$(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM neon_sync_log WHERE sync_finished_at > now() - interval '5 min'" 2>/dev/null || echo 0)
              echo "friss neon_sync_log sorok: $ROWS"
              [ "${ROWS:-0}" -gt 0 ] && break
              sleep 10
            done
            sudo -u postgres psql -d valuta -tAc "SELECT table_name||' '||status||' '||coalesce(sync_finished_at::text,'-') FROM neon_sync_log ORDER BY sync_finished_at DESC NULLS LAST LIMIT 5" 2>/dev/null || echo "(neon_sync_log meg ures — a kovetkezo ciklusban tolt)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon sync VERIFY (read-only diagnosztika)'
        if: ${{ github.event.inputs.action == 'neon-sync-verify' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== .env NEON sorok (jelszo maszkolva) ==="
            grep -E '^NEON_' /opt/valutavalto/backend/.env | sed -E 's|(://)[^@]+@|\1***@|' || echo "(nincs NEON sor a .env-ben)"
            echo ""
            echo "=== backend journal — Neon-vonatkozasu sorok (utolso elofordulasok) ==="
            journalctl -u valuta-backend.service -n 3000 --no-pager | grep -iE 'neon' | grep -oE '"level":"[A-Z]+"|message":"[^"]*"' | tail -20 || echo "(nincs Neon-sor a journalban)"
            echo ""
            echo "=== neon_sync_log (primary 'valuta' DB) ==="
            sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM neon_sync_log" 2>/dev/null | sed 's/^/  osszes sor: /'
            sudo -u postgres psql -d valuta -c "SELECT table_name, status, sync_finished_at FROM neon_sync_log ORDER BY sync_finished_at DESC NULLS LAST LIMIT 12" 2>/dev/null || echo "(neon_sync_log nincs/ures)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon sync ROLLBACK (legutobbi .env.bak visszaallitas + restart)'
        if: ${{ github.event.inputs.action == 'neon-sync-rollback' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            ENVFILE=/opt/valutavalto/backend/.env
            echo "=== Neon sync ROLLBACK ==="
            BAK=$(ls -t "$ENVFILE".bak.* 2>/dev/null | head -1)
            if [ -z "$BAK" ]; then echo "::error::nincs .env.bak.* — kezi helyreallitas kell"; exit 1; fi
            echo "visszaallitando backup: $BAK"
            cp -a "$BAK" "$ENVFILE"
            chown valuta:valuta "$ENVFILE"
            chmod 600 "$ENVFILE"
            echo "NEON sorok a visszaallitott .env-ben (db_url maszkolva):"
            grep -c '^NEON_SYNC_ENABLED=' "$ENVFILE" | sed 's/^/  NEON_SYNC_ENABLED sorok: /'
            echo "=== valuta-backend.service restart ==="
            systemctl restart valuta-backend.service
            sleep 18
            systemctl is-active valuta-backend.service || { journalctl -u valuta-backend.service -n 40 --no-pager; echo "::error::backend nem aktiv"; exit 1; }
            for i in 1 2 3 4 5 6 7 8; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
              echo "health attempt $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { echo "=== ROLLBACK OK — prod helyreallt ==="; exit 0; }
              sleep 10
            done
            echo "::error::health meg nem 200 a rollback utan — journalctl:"
            journalctl -u valuta-backend.service -n 50 --no-pager
            exit 1
          ENDSSH
