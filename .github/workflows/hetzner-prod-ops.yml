name: Hetzner Prod Ops (write)

# Igeny szerinti, IRO prod-muveletek a Hetzner 'valuta' DB-n / valuta-backend systemd env-jen,
# a meglevo deploy-secret SSH-kulccsal (ugyanaz, amivel a deploy-hetzner.yml dolgozik).
# Ket, egymastol fuggetlen muvelet a 'action' choice mogott:
#   * rub-reactivate   -> a prod RUB.is_active=true (egyezzen a V327 kod-szandekkal — a RUB
#                         megis forgalmazott; a 2026-06-12-i V319 teves user-infon alapult). Idempotens UPDATE.
#   * neon-sync-enable -> a backup-szinkron bekapcsolasa: a box /opt/valutavalto/backend/.env-be
#                         NEON_SYNC_ENABLED=true + NEON_DATABASE_URL (repo-secret), majd backend restart.
# A NEON_DATABASE_URL ertek base64-en megy at, sehol nem jelenik meg a logban (GitHub maszkolja is).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Melyik prod-muvelet fusson'
        required: true
        type: choice
        options:
          - rub-reactivate
          - local-rub-data-fix
          - cutover-assess
          - cutover-backup
          - neon-sync-enable
          - neon-sync-rollback
          - neon-sync-verify
          - ha-disable-failover
          - ha-backup-to-neon
          - ha-install-freeze-watchdog

permissions:
  contents: read

jobs:
  prod-op:
    name: 'Prod write op: ${{ github.event.inputs.action }}'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (freeze-watchdog telepítő + V327-V330 migrációs .sql-ek)
        if: ${{ github.event.inputs.action == 'ha-install-freeze-watchdog' || github.event.inputs.action == 'local-rub-data-fix' }}
        uses: actions/checkout@v6

      - name: Set up SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          # Scaleway standby kulcs (a HA-muveletekhez, pl. ha-disable-failover)
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 'Lokalis valuta DB — V327-V330 idempotens adat-fix (RUB aktiv + ORSZAGOS NULL)'
        if: ${{ github.event.inputs.action == 'local-rub-data-fix' }}
        run: |
          # CEL: a SPLIT-BRAIN feloldasa — a backend RUNTIME datasource-a a LOKALIS 'valuta' DB
          # (127.0.0.1:5432, PgBouncer 6432 mogott), de a Flyway korabban a Neonra migralt, igy
          # a V327-V330 (RUB reaktivalas + cimlet + currency_stock + ORSZAGOS-fix) NEM jutott el a
          # kollegakhoz kiszolgalo DB-ig. Itt a KANONIKUS migracios .sql-eket alkalmazzuk kozvetlenul
          # a lokalis DB-n. Mind idempotens (DO-blokk / NOT EXISTS / guard-os UPDATE), nincs restart,
          # nincs jelszo (sudo -u postgres peer auth). A flyway_schema_history-t NEM irjuk: a kesobbi
          # gyoker-fix (Flyway->lokalis) ujrafuttathatja oket — idempotensek, 0 sort fognak erinteni.
          MIGDIR=backend/src/main/resources/db/migration
          echo "=== Kanonikus migracios .sql-ek feltoltese a boxra (/tmp) ==="
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$MIGDIR/V327__reactivate_rub_currency.sql" \
            "$MIGDIR/V328__rub_denomination_catalog_backfill.sql" \
            "$MIGDIR/V329__rub_currency_stock_vault_rows.sql" \
            "$MIGDIR/V330__fix_vault_counterparty_region.sql" \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/tmp/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== ELOTTE: lokalis 'valuta' DB allapot ==="
            sudo -u postgres psql -d valuta -tAc "SELECT 'RUB.is_active='||is_active FROM currency WHERE code='RUB'"
            sudo -u postgres psql -d valuta -tAc "SELECT 'flyway_max=V'||max(version) FROM flyway_schema_history WHERE success"
            echo ""
            for f in V327__reactivate_rub_currency V328__rub_denomination_catalog_backfill V329__rub_currency_stock_vault_rows V330__fix_vault_counterparty_region; do
              echo "--- $f alkalmazasa (idempotens) ---"
              sudo -u postgres psql -d valuta -v ON_ERROR_STOP=1 -f "/tmp/$f.sql"
              rm -f "/tmp/$f.sql"
            done
            echo ""
            echo "=== UTANA: verifikacio a lokalis szolgalo DB-n ==="
            sudo -u postgres psql -d valuta -tAc "SELECT 'RUB.is_active='||is_active FROM currency WHERE code='RUB'"
            sudo -u postgres psql -d valuta -tAc "SELECT 'aktiv_valutak='||count(*) FILTER (WHERE is_active) FROM currency"
            sudo -u postgres psql -d valuta -tAc "SELECT 'RUB_denomination_sorok='||count(*) FROM denomination d JOIN currency c ON c.id=d.currency_id WHERE c.code='RUB'"
            sudo -u postgres psql -d valuta -tAc "SELECT 'RUB_currency_stock_sorok='||count(*) FROM currency_stock WHERE currency_code='RUB'"
            sudo -u postgres psql -d valuta -tAc "SELECT 'ORSZAGOS_vault_branch_sorok='||count(*) FROM branch WHERE region='ORSZAGOS'"
            echo "=== Kesz — RUB aktiv a lokalis kiszolgalo DB-n, a kollegak latjak ==="
          ENDSSH

      - name: 'CUTOVER ASSESS (read-only) — Neon vs lokalis divergencia + PG-verzio + meret'
        if: ${{ github.event.inputs.action == 'cutover-assess' }}
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # READ-ONLY: a Local-First cutover biztonsagi felmerese. Osszeveti a Neon (jelenlegi
          # szolgalo DB) es a lokalis 'valuta' (cutover-cel) pontos sor-szamait tablankent, PG-verziot,
          # DB-meretet. A Neon URL base64-en megy a boxra, sehol nem logolt (GitHub is maszkolja).
          if [ -z "${NEON_URL:-}" ]; then echo "::error::NEON_DATABASE_URL ures/hianyzik"; exit 1; fi
          B64=$(printf '%s' "$NEON_URL" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEON_B64='$B64' bash -s" << 'ENDSSH'
            set -o pipefail
            NEON_URI=$(printf '%s' "$NEON_B64" | base64 -d)
            COUNTSQL="SELECT relname||'='||(xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', schemaname, relname), false, true, '')))[1]::text FROM pg_stat_user_tables ORDER BY relname"
            echo "=== PG-verzio + DB-meret ==="
            echo "Neon   : $(psql "$NEON_URI" -tAc "select version()" 2>/dev/null | grep -oE 'PostgreSQL [0-9.]+') | $(psql "$NEON_URI" -tAc "select pg_size_pretty(pg_database_size(current_database()))" 2>/dev/null)"
            echo "Lokalis: $(sudo -u postgres psql -d valuta -tAc "select version()" 2>/dev/null | grep -oE 'PostgreSQL [0-9.]+') | $(sudo -u postgres psql -d valuta -tAc "select pg_size_pretty(pg_database_size(current_database()))" 2>/dev/null)"
            echo ""
            echo "=== Pontos sor-szamok tablankent — NEON (szolgalo) ==="
            psql "$NEON_URI" -tAc "$COUNTSQL" 2>/dev/null | sort > /tmp/neon_counts.txt
            cat /tmp/neon_counts.txt
            echo ""
            echo "=== Pontos sor-szamok tablankent — LOKALIS (cutover-cel) ==="
            sudo -u postgres psql -d valuta -tAc "$COUNTSQL" 2>/dev/null | sort > /tmp/local_counts.txt
            cat /tmp/local_counts.txt
            echo ""
            echo "=== DIFF (csak elteres: tabla | neon | lokalis) ==="
            join -t'=' -a1 -a2 -e '?' -o '0,1.2,2.2' /tmp/neon_counts.txt /tmp/local_counts.txt 2>/dev/null \
              | awk -F'=' '{split($0,a,"="); n=a[2]; l=a[3]; if(n!=l) print "  "a[1]" | neon="n" | lokalis="l}' || echo "(diff nem szamolhato)"
            echo ""
            echo "=== Frissesseg: audit_log legujabb idobelyeg (mikor irtak utoljara) ==="
            echo "Neon   audit_log max: $(psql "$NEON_URI" -tAc "SELECT max(created_at) FROM audit_log" 2>/dev/null || echo '(n/a)')"
            echo "Lokalis audit_log max: $(sudo -u postgres psql -d valuta -tAc "SELECT max(created_at) FROM audit_log" 2>/dev/null || echo '(n/a)')"
            rm -f /tmp/neon_counts.txt /tmp/local_counts.txt
            echo "=== Kesz — assess read-only, semmi nem valtozott ==="
          ENDSSH

      - name: 'CUTOVER BACKUP — teljes mentes mindket DB-rol + config-probe + Neon-delta'
        if: ${{ github.event.inputs.action == 'cutover-backup' }}
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # SAFETY-FIRST a Local-First cutover elott. NEM modosit egyetlen DB-t sem (csak pg_dump +
          # read-only SELECT + .env OLVASAS maszkoltan). Ket teljes backup (lokalis + Neon) a boxra,
          # SHA-256 + meret. Plusz a Neon 'mai delta' (a lokalis utolso irasanal ujabb uzleti sorok),
          # hogy donthessunk a beepitesrol. A Neon URL base64-en megy, sehol nem logolt.
          if [ -z "${NEON_URL:-}" ]; then echo "::error::NEON_DATABASE_URL ures/hianyzik"; exit 1; fi
          B64=$(printf '%s' "$NEON_URL" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEON_B64='$B64' bash -s" << 'ENDSSH'
            set -o pipefail
            NEON_URI=$(printf '%s' "$NEON_B64" | base64 -d)
            TS=$(date +%Y%m%d-%H%M%S)
            BDIR="/var/backups/cutover-$TS"
            sudo mkdir -p "$BDIR"
            echo "=== Backup-konyvtar: $BDIR ==="
            echo ""
            echo "=== .env aktualis config (jelszo maszkolva) ==="
            sudo grep -E '^(DATABASE_URL|NEON_DATABASE_URL|NEON_SYNC_ENABLED|DATABASE_USERNAME)=' /opt/valutavalto/backend/.env \
              | sed -E 's|password=[^&;[:space:]]*|password=***|g; s#(://)[^@/]*@#\1***@#g' || echo "(nincs)"
            echo ""
            echo "=== Korabbi .env.bak.* fajlok (a pre-Neon lokalis DATABASE_URL megtalalasahoz) ==="
            for f in $(sudo ls -t /opt/valutavalto/backend/.env.bak.* 2>/dev/null | head -6); do
              H=$(sudo grep -E '^DATABASE_URL=' "$f" | sed -E 's|password=[^&;[:space:]]*|password=***|g; s#(://)[^@/]*@#\1***@#g' | sed -E 's#(//[^/?]*).*#\1#')
              echo "  $f : $H"
            done
            echo ""
            echo "=== 1) Lokalis 'valuta' backup (pg_dump PG16, custom format) ==="
            sudo -u postgres pg_dump -Fc -d valuta -f "$BDIR/local_valuta.dump"
            sudo bash -c "ls -l '$BDIR/local_valuta.dump' | awk '{print \"  meret: \"\$5\" byte\"}'; sha256sum '$BDIR/local_valuta.dump'"
            echo ""
            echo "=== 2) Neon backup (pg_dump PG17 docker, custom format) ==="
            docker run --rm -e PGURI="$NEON_URI" postgres:17 sh -c 'pg_dump -Fc "$PGURI"' > /tmp/neon.dump 2>/tmp/neon.err || { echo "::error::Neon pg_dump bukott"; sed -E 's#postgres(ql)?://[^[:space:]]*#<NEON_URI>#g' /tmp/neon.err | tail -8; }
            sudo mv /tmp/neon.dump "$BDIR/neon_neondb.dump" 2>/dev/null || true
            sudo bash -c "[ -f '$BDIR/neon_neondb.dump' ] && { ls -l '$BDIR/neon_neondb.dump' | awk '{print \"  meret: \"\$5\" byte\"}'; sha256sum '$BDIR/neon_neondb.dump'; } || echo '(Neon dump hianyzik)'"
            echo ""
            echo "=== 3) NEON-DELTA: a lokalis utolso irasanal (2026-06-14 06:30) ujabb uzleti sorok a Neonon ==="
            for t in transaction collected_transaction data_collection cash_balance daily_session vault_transfer closing_wizard notification receipt; do
              C=$(psql "$NEON_URI" -tAc "SELECT count(*) FROM $t WHERE created_at > '2026-06-14 06:30:00'" 2>/dev/null)
              echo "  $t : ${C:-?} uj sor a Neonon (created_at > 2026-06-14 06:30)"
            done
            echo ""
            echo "=== Neon transaction-delta reszletek (ha van) ==="
            psql "$NEON_URI" -P pager=off -c "SELECT id, created_at, status FROM transaction WHERE created_at > '2026-06-14 06:30:00' ORDER BY created_at DESC LIMIT 20" 2>/dev/null || echo "(nincs / nem olvashato)"
            echo "=== Kesz — KET backup elkeszult, semmi DB nem valtozott ==="
          ENDSSH

      - name: 'FREEZE-WATCHDOG telepítés + engedélyezés (Hetzner anti-freeze öngyógyító)'
        if: ${{ github.event.inputs.action == 'ha-install-freeze-watchdog' }}
        run: |
          echo "=== freeze-watchdog fájlok feltöltése /tmp-be ==="
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              deploy/hetzner/ha/freeze-watchdog.sh \
              deploy/hetzner/ha/freeze-watchdog.service \
              deploy/hetzner/ha/freeze-watchdog.timer \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/tmp/"
          echo "=== Resend-kulcs átmásolása a Scaleway-ról a Hetznerre (base64, NEM logolt) ==="
          # A működő Resend-kulcs a Scaleway-n él (/etc/primary-watchdog/resend_api_key); a freeze-watchdog
          # a Hetzneren fut, ezért oda is kell. Base64-en megy át, sehol nem jelenik meg plaintextben.
          KEY_B64="$(ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              "sudo cat /etc/primary-watchdog/resend_api_key 2>/dev/null | tr -d '\n\r' | base64 -w0" 2>/dev/null || true)"
          if [ -n "$KEY_B64" ]; then
            # Egyetlen SSH-parancs (NINCS beágyazott heredoc — az törné a YAML run-blokkot).
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
                "sudo mkdir -p /etc/primary-watchdog && printf '%s' '$KEY_B64' | base64 -d | sudo tee /etc/primary-watchdog/resend_api_key >/dev/null && sudo chmod 600 /etc/primary-watchdog/resend_api_key && echo \"Resend-kulcs telepitve a Hetznerre (\$(wc -c < /etc/primary-watchdog/resend_api_key) byte)\""
          else
            echo "FIGYELEM: a Scaleway-n sem találom a Resend-kulcsot — az email-riasztás kézi beállítást igényel."
          fi
          echo "=== telepítés + engedélyezés a boxon (sudo) ==="
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            DEST=/opt/valutavalto/deploy/hetzner/ha
            sudo mkdir -p "$DEST"
            sudo mv /tmp/freeze-watchdog.sh "$DEST/freeze-watchdog.sh"
            sudo chmod +x "$DEST/freeze-watchdog.sh"
            sudo mv /tmp/freeze-watchdog.service /etc/systemd/system/freeze-watchdog.service
            sudo mv /tmp/freeze-watchdog.timer  /etc/systemd/system/freeze-watchdog.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now freeze-watchdog.timer
            echo "=== verifikáció (read-only) ==="
            echo "timer enabled : $(systemctl is-enabled freeze-watchdog.timer 2>/dev/null)"
            echo "timer active  : $(systemctl is-active  freeze-watchdog.timer 2>/dev/null)"
            systemctl list-timers freeze-watchdog.timer --no-pager 2>/dev/null | grep -iE 'freeze-watchdog|NEXT' | head -2 || true
            echo "Resend kulcs   : $([ -f /etc/primary-watchdog/resend_api_key ] && echo 'JELEN (email-riasztás megy)' || echo 'NINCS — állítsd be /etc/primary-watchdog/resend_api_key')"
            echo "--- egyszeri teszt-futás (egészséges rendszeren NEM indít újra, csak ellenőriz) ---"
            sudo "$DEST/freeze-watchdog.sh" 2>&1 | tail -4 || true
            echo "=== Kész — a freeze-watchdog percenként fut; fagyás esetén AUTO-RESTART + email (leállt + újraindította). ==="
          ENDSSH

      - name: 'HA auto-failover LEALLITAS (Scaleway watchdog stop+disable)'
        if: ${{ github.event.inputs.action == 'ha-disable-failover' }}
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== HA auto-failover leallitas a Scaleway standby-n ==="
            echo "DONTES (Kosa, 2026-06-15): a Neon a primary -> a lokalis Hetzner<->Scaleway"
            echo "streaming-HA elavult, es a torott replikacioval (2026-06-14 15:00 ota) az"
            echo "auto-failover VESZELYES (elavult standby promote + DNS-atiranyitas)."
            echo ""
            echo "elotte (watchdog timer/service):"
            systemctl is-active primary-watchdog.timer 2>/dev/null || echo "  timer: inactive/nincs"
            systemctl is-active primary-watchdog.service 2>/dev/null || echo "  service: inactive/nincs"
            echo "--- stop + disable ---"
            systemctl stop primary-watchdog.timer 2>/dev/null || true
            systemctl disable primary-watchdog.timer 2>/dev/null || true
            systemctl stop primary-watchdog.service 2>/dev/null || true
            systemctl disable primary-watchdog.service 2>/dev/null || true
            echo ""
            echo "utana (read-only verify):"
            echo "  timer enabled : $(systemctl is-enabled primary-watchdog.timer 2>/dev/null || echo 'disabled/nincs')"
            echo "  timer active  : $(systemctl is-active primary-watchdog.timer 2>/dev/null || echo 'inactive')"
            echo "  service active: $(systemctl is-active primary-watchdog.service 2>/dev/null || echo 'inactive')"
            echo "VISSZAALLITAS (ha megis kell): systemctl enable --now primary-watchdog.timer"
            echo "=== Kesz — az auto-failover NEM fut tobbe ==="
          ENDSSH

      - name: 'B2-backup atallitas a Neon PROD DB-re (onellenorzo, auto-rollback)'
        if: ${{ github.event.inputs.action == 'ha-backup-to-neon' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            SCRIPT=/usr/local/bin/valuta-db-backup.sh
            ENVF=/opt/valutavalto/backend/.env
            echo "=== B2-backup atallitas a Neon PROD DB-re (DONTES: Neon a primary) ==="
            [ -f "$SCRIPT" ] || { echo "::error::nincs $SCRIPT"; exit 1; }
            NEON_URL=$(grep '^NEON_DATABASE_URL=' "$ENVF" 2>/dev/null | cut -d= -f2-)
            if [ -z "$NEON_URL" ]; then echo "::error::NEON_DATABASE_URL ures/hianyzik a .env-ben — NINCS valtoztatas"; exit 1; fi
            echo "Neon host: $(echo "$NEON_URL" | sed -E 's#.*@##; s#[/?].*##')"
            # A Neon PostgreSQL 17 -> a dumphoz pg_dump 17+ kell (a box default 16-os kliense
            # 'server version mismatch'-csel elszall). Telepitjuk a pgdg-repobol, ha hianyzik.
            PGD17=/usr/lib/postgresql/17/bin/pg_dump
            if [ ! -x "$PGD17" ]; then
              echo "--- postgresql-client-17 telepitese (pgdg) ---"
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 || { echo "::error::postgresql-client-17 telepites sikertelen"; exit 1; }
            fi
            [ -x "$PGD17" ] || { echo "::error::nincs $PGD17 a telepites utan sem"; exit 1; }
            echo "pg_dump 17 verzio: $("$PGD17" --version)"
            if grep -q '/usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL"' "$SCRIPT"; then
              echo "A backup-script MAR a Neonra (pg17) mutat — idempotens, nincs teendo."; exit 0
            fi
            BAK="$SCRIPT.bak.$(date +%Y%m%d%H%M%S)"
            cp -a "$SCRIPT" "$BAK"; echo "biztonsagi masolat: $BAK"
            # Surgical patch: a pg_dump forras a lokalis 'valuta' helyett a Neon (URL a .env-bol, pg_dump 17-tel)
            sed -i 's#^sudo -u postgres pg_dump -Fp valuta#NEON_DATABASE_URL=$(grep "^NEON_DATABASE_URL=" /opt/valutavalto/backend/.env | cut -d= -f2-); /usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL" -Fp#' "$SCRIPT"
            if ! grep -q '/usr/lib/postgresql/17/bin/pg_dump "$NEON_DATABASE_URL"' "$SCRIPT"; then
              echo "::error::a patch NEM alkalmazodott (a pg_dump sor eltert a vartol) — visszaallitas"; cp -a "$BAK" "$SCRIPT"; exit 1
            fi
            echo "--- TESZT-FUTAS: a patchelt backup-script (valodi Neon-dump + B2-feltoltes) ---"
            if bash "$SCRIPT"; then
              LATEST=$(ls -t /var/backups/valuta/valuta-*.sql.gz 2>/dev/null | head -1)
              SZ=$(stat -c%s "$LATEST" 2>/dev/null || echo 0)
              HAS=$(gunzip -c "$LATEST" 2>/dev/null | grep -cE 'currency' || true)
              echo "teszt-dump: $LATEST | meret=$SZ byte | 'currency' nyom=$HAS"
              if [ "${SZ:-0}" -lt 10000 ] || [ "${HAS:-0}" -lt 1 ]; then
                echo "::error::a Neon teszt-dump ures/gyanus (meret=$SZ, currency=$HAS) — VISSZAALLITAS a lokalis backupra"; cp -a "$BAK" "$SCRIPT"; exit 1
              fi
              echo "=== OK — a B2-backup mostantol a NEON PROD DB-t menti; teszt-dump validalva. ==="
              echo "Visszaallitas (ha kell): cp -a $BAK $SCRIPT"
            else
              echo "::error::a patchelt backup-script FUTASA sikertelen — VISSZAALLITAS a lokalis backupra"; cp -a "$BAK" "$SCRIPT"; exit 1
            fi
          ENDSSH

      - name: 'RUB reaktivalas (prod, idempotens)'
        if: ${{ github.event.inputs.action == 'rub-reactivate' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== RUB reaktivalas a prod 'valuta' DB-n (V327 kod-szandek) ==="
            echo "elotte : $(sudo -u postgres psql -d valuta -tAc "SELECT code||'.is_active='||is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            sudo -u postgres psql -d valuta -c "UPDATE currency SET is_active=true, updated_at=NOW() WHERE code='RUB' AND is_active=false;"
            echo "utana  : $(sudo -u postgres psql -d valuta -tAc "SELECT code||'.is_active='||is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "aktiv valutak  : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FILTER (WHERE is_active) FROM currency" 2>/dev/null)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon backup-szinkron bekapcsolas (prod .env + restart)'
        if: ${{ github.event.inputs.action == 'neon-sync-enable' }}
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_URL" ]; then
            echo "::error::NEON_DATABASE_URL repo-secret ures/hianyzik — allitsd be elobb."
            exit 1
          fi
          B64=$(printf '%s' "$NEON_URL" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEON_URL_B64='$B64' bash -s" << 'ENDSSH'
            set -o pipefail
            ENVFILE=/opt/valutavalto/backend/.env
            echo "=== Neon backup-szinkron bekapcsolas: $ENVFILE modositas ==="
            NEON_URL=$(printf '%s' "$NEON_URL_B64" | base64 -d)
            if [ -z "$NEON_URL" ]; then echo "::error::ures NEON_URL a dekodolas utan"; exit 1; fi
            # Biztonsagi masolat (visszaallithatosag) — ezt allitja vissza az auto-rollback is
            BAK="$ENVFILE.bak.$(date +%Y%m%d%H%M%S)"
            cp -a "$ENVFILE" "$BAK"
            # Idempotencia: korabbi NEON_SYNC_ENABLED / NEON_DATABASE_URL sorok eltavolitasa
            sed -i '/^NEON_SYNC_ENABLED=/d; /^NEON_DATABASE_URL=/d' "$ENVFILE"
            # KRITIKUS: zaro sortores garancia — kulonben a >> az utolso sorra (fo DB-jelszo) tapad
            # es elrontja a fo DB-kapcsolatot (ez okozta a korabbi 502-t).
            [ -n "$(tail -c1 "$ENVFILE")" ] && printf '\n' >> "$ENVFILE"
            printf 'NEON_SYNC_ENABLED=true\n' >> "$ENVFILE"
            printf 'NEON_DATABASE_URL=%s\n' "$NEON_URL" >> "$ENVFILE"
            chown valuta:valuta "$ENVFILE"
            chmod 600 "$ENVFILE"
            # VALIDACIO: a ket uj sornak pontosan sor-elejen kell allnia (kulonben append-corrupcio)
            OK_EN=$(grep -c '^NEON_SYNC_ENABLED=true$' "$ENVFILE" || true)
            OK_URL=$(grep -c '^NEON_DATABASE_URL=' "$ENVFILE" || true)
            if [ "$OK_EN" != "1" ] || [ "$OK_URL" != "1" ]; then
              echo "::error::.env validacio BUKOTT (NEON_SYNC_ENABLED=$OK_EN, NEON_DATABASE_URL=$OK_URL) — append-corrupcio, visszaallitas restart NELKUL"
              cp -a "$BAK" "$ENVFILE"; chown valuta:valuta "$ENVFILE"; chmod 600 "$ENVFILE"
              exit 1
            fi
            echo ".env frissitve es validalva (NEON_SYNC_ENABLED + NEON_DATABASE_URL sor-elejen, jelszo nem logolva)"
            echo "NEON_DATABASE_URL host: $(echo "$NEON_URL" | sed -E 's|.*@||; s|/.*||')"
            echo "=== valuta-backend.service restart ==="
            systemctl restart valuta-backend.service
            sleep 18
            # Health — ha NEM all fel 200-ra, AUTO-ROLLBACK (a prod NEM maradhat 502-n)
            HEALTHY=0
            for i in 1 2 3 4 5 6 7 8; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
              echo "health attempt $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { HEALTHY=1; break; }
              sleep 10
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "::error::backend NEM all fel 200-ra a Neon-bekapcsolas utan — AUTO-ROLLBACK"
              journalctl -u valuta-backend.service -n 50 --no-pager
              cp -a "$BAK" "$ENVFILE"; chown valuta:valuta "$ENVFILE"; chmod 600 "$ENVFILE"
              systemctl restart valuta-backend.service
              sleep 18
              for i in 1 2 3 4 5 6; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
                echo "rollback health attempt $i: HTTP $CODE"
                [ "$CODE" = "200" ] && { echo "=== AUTO-ROLLBACK OK — prod helyreallt, a Neon-bekapcsolas NEM sikerult ==="; exit 1; }
                sleep 10
              done
              echo "::error::AUTO-ROLLBACK utan sem 200 — KEZI beavatkozas kell"
              exit 1
            fi
            echo "service 200 — Neon bean log: $(journalctl -u valuta-backend.service -n 500 --no-pager | grep -o 'Neon DataSource konfigural[^\"]*' | tail -1 || echo '(nincs log-sor)')"
            # Az elso scheduled sync (fixedDelay) ~indulaskor fut; varjunk ra es nezzuk a logot
            echo "=== Neon sync-log varas (max ~60s) ==="
            for i in 1 2 3 4 5 6; do
              ROWS=$(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM neon_sync_log WHERE sync_finished_at > now() - interval '5 min'" 2>/dev/null || echo 0)
              echo "friss neon_sync_log sorok: $ROWS"
              [ "${ROWS:-0}" -gt 0 ] && break
              sleep 10
            done
            sudo -u postgres psql -d valuta -tAc "SELECT table_name||' '||status||' '||coalesce(sync_finished_at::text,'-') FROM neon_sync_log ORDER BY sync_finished_at DESC NULLS LAST LIMIT 5" 2>/dev/null || echo "(neon_sync_log meg ures — a kovetkezo ciklusban tolt)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon sync VERIFY (read-only diagnosztika)'
        if: ${{ github.event.inputs.action == 'neon-sync-verify' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== .env NEON sorok (jelszo maszkolva) ==="
            grep -E '^NEON_' /opt/valutavalto/backend/.env | sed -E 's|(://)[^@]+@|\1***@|' || echo "(nincs NEON sor a .env-ben)"
            echo ""
            echo "=== backend journal — Neon-vonatkozasu sorok (utolso elofordulasok) ==="
            journalctl -u valuta-backend.service -n 3000 --no-pager | grep -iE 'neon' | grep -oE '"level":"[A-Z]+"|message":"[^"]*"' | tail -20 || echo "(nincs Neon-sor a journalban)"
            echo ""
            echo "=== neon_sync_log (primary 'valuta' DB) ==="
            sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM neon_sync_log" 2>/dev/null | sed 's/^/  osszes sor: /'
            sudo -u postgres psql -d valuta -c "SELECT table_name, status, sync_finished_at FROM neon_sync_log ORDER BY sync_finished_at DESC NULLS LAST LIMIT 12" 2>/dev/null || echo "(neon_sync_log nincs/ures)"
            echo "=== Kesz ==="
          ENDSSH

      - name: 'Neon sync ROLLBACK (legutobbi .env.bak visszaallitas + restart)'
        if: ${{ github.event.inputs.action == 'neon-sync-rollback' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            ENVFILE=/opt/valutavalto/backend/.env
            echo "=== Neon sync ROLLBACK ==="
            BAK=$(ls -t "$ENVFILE".bak.* 2>/dev/null | head -1)
            if [ -z "$BAK" ]; then echo "::error::nincs .env.bak.* — kezi helyreallitas kell"; exit 1; fi
            echo "visszaallitando backup: $BAK"
            cp -a "$BAK" "$ENVFILE"
            chown valuta:valuta "$ENVFILE"
            chmod 600 "$ENVFILE"
            echo "NEON sorok a visszaallitott .env-ben (db_url maszkolva):"
            grep -c '^NEON_SYNC_ENABLED=' "$ENVFILE" | sed 's/^/  NEON_SYNC_ENABLED sorok: /'
            echo "=== valuta-backend.service restart ==="
            systemctl restart valuta-backend.service
            sleep 18
            systemctl is-active valuta-backend.service || { journalctl -u valuta-backend.service -n 40 --no-pager; echo "::error::backend nem aktiv"; exit 1; }
            for i in 1 2 3 4 5 6 7 8; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
              echo "health attempt $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { echo "=== ROLLBACK OK — prod helyreallt ==="; exit 0; }
              sleep 10
            done
            echo "::error::health meg nem 200 a rollback utan — journalctl:"
            journalctl -u valuta-backend.service -n 50 --no-pager
            exit 1
          ENDSSH
