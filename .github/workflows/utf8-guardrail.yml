name: UTF-8 Guardrail

on:
  pull_request:
  push:
    branches:
      - main

# Audit-iter3 P1 (2026-04-27, CodeQL actions/missing-workflow-permissions fix):
# UTF-8 guardrail csak olvas (checkout + diff). Default contents: read elegendo.
permissions:
  contents: read

jobs:
  utf8-guardrail:
    name: UTF-8 Guardrail Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: refs
        shell: pwsh
        run: |
          $baseRef = ""

          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseRef = "${{ github.event.pull_request.base.sha }}"
          }
          elseif ("${{ github.event.before }}" -and "${{ github.event.before }}" -ne "0000000000000000000000000000000000000000") {
            $baseRef = "${{ github.event.before }}"
          }

          "base_ref=$baseRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run UTF-8 guardrail
        shell: pwsh
        run: |
          ./scripts/security/check-utf8-guardrail.ps1 -BaseRef "${{ steps.refs.outputs.base_ref }}" -HeadRef "${{ github.sha }}"
