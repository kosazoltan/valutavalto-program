name: Business Invariant Guard

# Üzleti invariáns regex/AST-alapú ellenőrzés minden PR-en.
# Forrás: vault/feedback/claude-code-valutavalto-korrekcios-mandate-2026-05-17-v2.md (6. szakasz)
#
# JELEN ÁLLAPOT (2026-05-17, v2 PR #630):
# - BLOCKING (exit 1):  #1 (cash counter mező, allowlist-tel)
# - WARNING-only:       #2 (AML magic), #3 (test-skip), #4 (multi-tenant), #5/6 (state UPDATE), #7 (DELETE érzékeny)
#
# A warning-only minták szándékosan nem blokkolnak még — pontosabb regex / AST-elemzés szükséges
# a fals pozitívok elkerüléséhez (lásd Codex P1 + Copilot review #630). A blocking-ra konvertálás
# későbbi PR-ekben, mintánként, miután a fals pozitívok kiszűrve.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: business-invariant-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Node beállítása (verzió-szinkron gate stabil futtatásához)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 1. (BLOCKING) Tilos cash counter mező — készlet = SUM(tx) invariáns
        run: |
          # Allowlist: materialized view / aggregátum entitások — osztály-név végződés:
          # *Summary, *View, *Aggregate, *MaterializedView (denormalizált aggregátum-cache, NEM source-of-truth)
          OFFENDERS=$(find backend/src/main/java -name '*.java' 2>/dev/null \
             | xargs grep -l 'private\s\+\(Long\|Integer\|BigDecimal\)\s\+\(cashCounter\|cash_counter\|currentStock\|inventoryCount\)' 2>/dev/null \
             | grep -vE '(Summary|View|Aggregate|MaterializedView)\.java$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Tiltott minta #1: cash counter mező — VV-ELVI invariáns: készlet = SUM(tranzakciók)"
            echo "Sérelmes fájlok:"
            echo "$OFFENDERS"
            echo "Allowlist: *Summary, *View, *Aggregate, *MaterializedView végződésű osztályok (materialized view-k)."
            exit 1
          fi

      - name: 2. (WARNING) AML magic number (100k/300k @Value config nélkül)
        run: |
          # Word boundary regex (NEM substring) — 100000 ne match-eljen 1000000-t
          # Codex P1 #630 alapján: szűrjük az ismert konstansokat (SIMPLIFIED_IDENTIFICATION_LIMIT etc.)
          MATCHES=$(grep -rnE '\b(100000|300000)\b' backend/src/main/java/ 2>/dev/null \
             | grep -iE 'huf|aml|threshold|identification|pep' \
             | grep -vE '@Value|application\.yml|application\.properties|src/test/' \
             | grep -vE 'SIMPLIFIED_IDENTIFICATION_LIMIT|IDENTIFICATION_LIMIT' || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Minta #2 (warning-only): AML küszöb magic number @Value config nélkül. Vizsgálandó:"
            echo "$MATCHES"
          fi

      - name: 3. (WARNING) Java teszt-skip — Folyamatos tesztelési protokoll
        run: |
          # Codex P1 #630: csak Java explicit @Disabled/@Ignore — frontend Vitest/Jest .skip() legitim
          MATCHES=$(grep -rnE '@Disabled\b|@Ignore\b' backend/src/test/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Minta #3 (warning-only): backend Java teszt-skip. Vizsgálandó:"
            echo "$MATCHES"
          fi

      - name: 4. (WARNING) Multi-tenant guard — companyId minden tenant-Repository-ban
        run: |
          # Copilot P2 #630: NEM minden Repository tenant-es. Globális entitások (Currency, Country, MnbRate stb.)
          # nem tartoznak companyId-hez. Warning-only — manuális review.
          WARNINGS=""
          while IFS= read -r f; do
            if ! grep -q 'companyId\|company_id\|@Query\|@Modifying' "$f"; then
              WARNINGS="${WARNINGS}\n${f}"
            fi
          done < <(find backend/src/main/java -name '*Repository.java' 2>/dev/null)
          if [ -n "$WARNINGS" ]; then
            echo "::warning::Minta #4 (warning-only): Repository fájlok companyId szűrés nélkül. Globális entitásoknál (Currency, Country, MnbRate stb.) ez OK. Vizsgálandó:"
            echo -e "$WARNINGS"
          fi

      - name: 5/6. (WARNING) Állapotgép-megkerülés — közvetlen UPDATE rate/transaction SET status
        run: |
          MATCHES=$(grep -rnE 'UPDATE\s+(transaction|rate)\s+SET\s+status' backend/src/main/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Minta #5/6 (warning-only): állapotgép-megkerülés. TransactionStateMachine / RateStateMachine kötelező lesz E.4/E.5 implementáció után."
            echo "$MATCHES"
          fi

      - name: 7. (WARNING) Fizikai DELETE érzékeny táblákon
        run: |
          MATCHES=$(grep -rnE 'DELETE\s+FROM\s+(receipt|transaction|audit_log|daily_closing)' backend/src/ 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Minta #7 (warning-only): bizonylat/tranzakció/audit fizikai törlés. VOID/REVERSED státusz kötelező."
            echo "$MATCHES"
          fi

      - name: 14. (BLOCKING) 4-way (4+1) verzió-szinkron — release atomikusság
        run: |
          # VV-ELVI 11.1 / AI_CONTRACT 1.kivétel: a release KÖTELEZŐEN atomikus —
          # az 5 package.json + backend/pom.xml (valuta-backend) verziójának egyeznie kell.
          # DEDIKÁLT, szűk script: CSAK a verziókat hasonlítja (a pom.xml-t IS!), semmilyen
          # más invariánst — így nem blokkol verziótól független PR-eket, és elkapja a
          # backend-drift-et is. Eltérésnél exit 1 (BLOCKING).
          node scripts/check-version-sync.mjs

      - name: 15. (BLOCKING) Platform-hatar — kliens->kliens import tilalom
        run: |
          # PLATFORM-REFAKTOR (2026-08-10): a kozos Electron-modulok a
          # packages/electron-platform retegbe kerultek (vv-logger: 3 peldany ->
          # 1 forras; google-oauth cross-client shimek atkotve). Ez a kapu orzi,
          # hogy a csatolas NE szivarogjon vissza: kliens -> platform szabad,
          # kliens -> KLIENS tilos. Egyetlen dokumentalt kivetel a platform
          # google-oauth re-exportja (l. a script ALLOWED listaja).
          # Elteresnel exit 1 (BLOCKING).
          node scripts/check-platform-boundaries.mjs

      - name: 16. (BLOCKING) Reteg-ratchet — Clean Architecture fuggosegi szabaly
        run: |
          # CLEAN ARCHITECTURE (2026-08-11): a fuggosegek befele mutatnak.
          # Mert kiindulas: 39 sertes / 23 controller (Controller -> Repository
          # kozvetlen injektalas). Ezt EGY PR-ben javitani elo penzugyi
          # rendszerben felmerhetetlen blast radius: az OSIV ki van kapcsolva
          # (lazy csak service-tranzakcion belul) es a CashLockOrdering
          # lock-sorrend a service-retegben el -> minden athelyezes
          # tranzakciohatart mozgat.
          # Ezert RATCHET: a mert adossag baseline-ban rogzitve
          # (scripts/dev-tools/layer-violation.baseline.json), UJ sertes -> exit 1,
          # javitas -> baseline-frissites keres. A szam csak lefele mozdulhat.
          # Reszletek: vault/elvi/mernoki-alapelvek-valutavalto-kontextus.md
          python3 scripts/dev-tools/layer-violation-scan.py --check-baseline

      - name: Sum-up
        if: success()
        run: |
          echo "✅ Üzleti invariáns guard: blocking pattern (#1 cash counter mező, #14 4-way verzió-szinkron) zöld."
          echo "Warning-only minták: #2 AML magic, #3 Java test-skip, #4 multi-tenant, #5/6 state UPDATE, #7 DELETE érzékeny."
          echo ""
          echo "Roadmap (precízebb regex / AST):"
          echo "  - #2: @Value migráció után aktívra konvertálni"
          echo "  - #3: frontend Vitest .skip() explicit allowlist"
          echo "  - #4: globális entitás-Repository allowlist (Currency, Country, MnbRate, ...)"
          echo "  - #5/6: TransactionStateMachine + RateStateMachine implementáció után aktívra"
          echo "  - #7: VOID workflow implementáció után aktívra"
          echo ""
          echo "Még implementálandó minták: #8 (központ vezérel), #9 (last-write-wins), #10 (random receipt),"
          echo "  #11 (businessUnit), #12 (OAuth-only), #13 (secret log), #15 (aggregated POST/PUT/DELETE)."
