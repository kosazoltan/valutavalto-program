name: Business Invariant Guard

# Üzleti invariáns regex/AST-alapú blokkoló ellenőrzés minden PR-en.
# Forrás: vault/feedback/claude-code-valutavalto-korrekcios-mandate-2026-05-17-v2.md (6. szakasz, 15 tiltott minta)
# Cél: a VV-ELVI üzleti invariánsainak gépi enforce-olása, mielőtt egy fejlesztő bemerge-elne sérelmes változást.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: business-invariant-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 1. Tilos cash counter mező (készlet = SUM(tx) invariáns)
        run: |
          # v2 mandate 6.1 minta #1: mező-tiltás (NEM nézet).
          # Allowlist: materialized view / aggregátum entitások — osztály-név végződés:
          # *Summary, *View, *Aggregate, *MaterializedView
          OFFENDERS=$(find backend/src/main/java -name '*.java' 2>/dev/null \
             | xargs grep -l 'private\s\+\(Long\|Integer\|BigDecimal\)\s\+\(cashCounter\|cash_counter\|currentStock\|inventoryCount\)' 2>/dev/null \
             | grep -vE '(Summary|View|Aggregate|MaterializedView)\.java$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Tiltott minta #1: cash counter mező — VV-ELVI invariáns: készlet = SUM(tranzakciók)"
            echo "Sérelmes fájlok:"
            echo "$OFFENDERS"
            echo "Allowlist: *Summary, *View, *Aggregate, *MaterializedView végződésű osztályok (materialized view-k)."
            exit 1
          fi

      - name: 2. Tilos AML magic number (100k/300k @Value config nélkül)
        run: |
          if grep -rn '100000\|300000' backend/src/main/java/ 2>/dev/null \
             | grep -iE 'huf|aml|threshold|identification|pep' \
             | grep -vE '@Value|application\.yml|application\.properties|src/test/' \
             | grep -v 'SIMPLIFIED_IDENTIFICATION_LIMIT\|IDENTIFICATION_LIMIT'; then
            echo "::error::Tiltott minta #2: AML küszöb magic number @Value config nélkül"
            exit 1
          fi

      - name: 3. Tilos teszt-skip (Folyamatos tesztelési protokoll)
        run: |
          MATCHES=$(grep -rn '@Disabled\|@Ignore\|\.skip(' backend/src/test/ frontend-react/src penztar-client/src 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tiltott minta #3: teszt-skip — VV-ELVI Folyamatos tesztelési protokoll megsértve"
            echo "$MATCHES"
            exit 1
          fi

      - name: 4. Multi-tenant guard (companyId minden Repository-ban)
        run: |
          FAILED=0
          while IFS= read -r f; do
            if ! grep -q 'companyId\|company_id' "$f"; then
              echo "::error::Tiltott minta #4: $f nincs companyId szűrés (multi-tenant invariáns)"
              FAILED=1
            fi
          done < <(find backend/src/main/java -name '*Repository.java' 2>/dev/null)
          exit $FAILED

      - name: 5. Tilos közvetlen state UPDATE (állapotgép-megkerülés)
        run: |
          if grep -rnE 'UPDATE\s+(transaction|rate)\s+SET\s+status' backend/src/main/ 2>/dev/null; then
            echo "::error::Tiltott minta #5/6: állapotgép-megkerülés — TransactionStateMachine vagy RateStateMachine kötelező"
            exit 1
          fi

      - name: 7. Tilos fizikai DELETE érzékeny táblákon
        run: |
          if grep -rnE 'DELETE\s+FROM\s+(receipt|transaction|audit_log|daily_closing)' backend/src/ 2>/dev/null; then
            echo "::error::Tiltott minta #7: bizonylat/tranzakció/audit fizikai törlés — VOID/REVERSED státusz kötelező"
            exit 1
          fi

      - name: 14. 4-way version sync
        run: |
          PENZTAR_VERSION=$(jq -r .version penztar-client/package.json 2>/dev/null || echo "MISSING")
          # NOTE: A kozponti-client, arfolyam-keszito-client jelen állapotban
          # nem külön mappa, csak az appMode alapján más build. A 4-way version
          # sync ellenőrzés akkor lesz teljes, ha külön package.json-okra
          # bontjuk őket — addig csak a penztar-client verzió ellenőrzendő.
          if [ "$PENZTAR_VERSION" = "MISSING" ]; then
            echo "::warning::penztar-client/package.json nem található — 4-way version sync skip"
          else
            echo "penztar-client version: $PENZTAR_VERSION"
          fi

      - name: Sum-up
        if: success()
        run: |
          echo "✅ Üzleti invariáns guard: minden ellenőrzés zöld."
          echo "Lefuttatott minták: #1 (cash counter), #2 (AML magic), #3 (teszt-skip), #4 (multi-tenant), #5/6 (state UPDATE), #7 (DELETE), #14 (version)."
          echo "Még implementálandó: #8 (központ vezérel), #9 (last-write-wins érzékeny entitásokon), #10 (random receipt), #11 (businessUnit), #12 (OAuth-only login), #13 (secret log), #15 (aggregated POST/PUT/DELETE)."
