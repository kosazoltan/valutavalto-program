name: Update GOOGLE_DESKTOP_CLIENT_ID env on Hetzner (multi-client support)

# Manualis workflow_dispatch — a Hetzner systemd valuta-backend.service GOOGLE_DESKTOP_CLIENT_ID
# env valtozojahoz egy uj client_id-t fuz hozza, vesszovel elvalasztva. A PR #588 alapjan a
# backend tamogatja a comma-separated client_id-ket az audience lista hianyaban.
#
# Hasznalat: gh workflow run update-google-desktop-client-id.yml \
#              -f additional_client_id="<full-google-desktop-client-id>" \
#              -f restart_backend=true

on:
  workflow_dispatch:
    inputs:
      additional_client_id:
        description: 'A hozzaadandi Google Desktop client_id (teljes string, NEM csak prefix)'
        required: true
        type: string
      restart_backend:
        description: 'Backend ujraindittasa az env update utan?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: hetzner-env-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: valuta-backend.service

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Append client_id to EnvironmentFile + restart service
        env:
          NEW_CLIENT_ID: ${{ github.event.inputs.additional_client_id }}
          RESTART: ${{ github.event.inputs.restart_backend }}
        run: |
          # 2026-05-15: Tobb forrasbol jovo env-conflict megoldas — UPDATE az
          # EnvironmentFile-ban (/opt/valutavalto/backend/.env), NEM drop-in
          # conf-ban. A korabbi drop-in megszunik (clean fresh single source).
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEW_CLIENT_ID='$NEW_CLIENT_ID' RESTART='$RESTART' bash -s" << 'ENDSSH'
            set -euo pipefail
            ENV_FILE=/opt/valutavalto/backend/.env
            OLD_DROPIN=/etc/systemd/system/valuta-backend.service.d/google-clients.conf

            # 0. Cleanup: regi drop-in conf eltavolitasa (single-source-of-truth)
            if [ -f "$OLD_DROPIN" ]; then
              rm -f "$OLD_DROPIN"
              echo "=== Removed stale drop-in: $OLD_DROPIN"
            fi

            if [ ! -f "$ENV_FILE" ]; then
              echo "FATAL: $ENV_FILE missing"
              exit 1
            fi

            # 1. Read current value from EnvironmentFile
            CURRENT=$(grep -oP '(?<=^GOOGLE_DESKTOP_CLIENT_ID=).+' "$ENV_FILE" || true)
            echo "=== Current in $ENV_FILE: ${CURRENT:-<empty>}"

            if [ -z "$CURRENT" ]; then
              MERGED="$NEW_CLIENT_ID"
            elif echo "$CURRENT" | tr ',' '\n' | grep -qFx "$NEW_CLIENT_ID"; then
              echo "=== Client ID mar bent van a .env-ben, skip"
              MERGED="$CURRENT"
            else
              MERGED="$CURRENT,$NEW_CLIENT_ID"
            fi
            echo "=== Merged: $MERGED"

            # 2. Update env file (sed: replace existing line; if absent, append)
            if grep -q '^GOOGLE_DESKTOP_CLIENT_ID=' "$ENV_FILE"; then
              sed -i "s|^GOOGLE_DESKTOP_CLIENT_ID=.*|GOOGLE_DESKTOP_CLIENT_ID=$MERGED|" "$ENV_FILE"
            else
              echo "GOOGLE_DESKTOP_CLIENT_ID=$MERGED" >> "$ENV_FILE"
            fi
            echo "=== Updated $ENV_FILE:"
            grep '^GOOGLE_DESKTOP_CLIENT_ID=' "$ENV_FILE"

            # 3. daemon-reload + restart
            systemctl daemon-reload
            echo "=== systemd daemon-reload done"

            if [ "$RESTART" = "true" ]; then
              echo "=== Restarting valuta-backend.service"
              systemctl restart valuta-backend.service
              sleep 12
              systemctl is-active valuta-backend.service || { journalctl -u valuta-backend.service -n 20 --no-pager; exit 1; }
              echo "=== Backend UP"
            else
              echo "=== Restart skipped"
            fi
          ENDSSH

      - name: Verify via public config-status endpoint
        run: |
          sleep 5
          echo "=== Public Google config status ==="
          curl -s --max-time 8 https://excvaluta.com/api/v1/public/auth/google-config-status | tee /tmp/cfg.json
          echo ""
