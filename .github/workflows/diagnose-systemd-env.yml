name: Diagnose systemd Environment for valuta-backend

# Manualis workflow_dispatch - diagnosztikai output a Hetzner production-rol.
# A teljes ertekek REDAKTALVA - csak key-nevek + EnvironmentFile path-ok
# kerulnek a workflow log-ba. A GOOGLE_DESKTOP_CLIENT_ID (publikus OAuth
# client id) teljes ertekevel jelenik meg.

on:
  workflow_dispatch:

concurrency:
  group: hetzner-production-mutate
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: valuta-backend.service

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Setup SSH (pin host key if available)
        env:
          HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          SERVER_IP: ${{ secrets.VPS_SERVER_IP }}
          PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
            echo "WARN: VPS_SSH_HOST_KEY secret not set, using TOFU keyscan."
          fi

      - name: Dump systemd config (REDACTED)
        env:
          STRICT_HOST: ${{ secrets.VPS_SSH_HOST_KEY != '' && 'yes' || 'accept-new' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o "StrictHostKeyChecking=${STRICT_HOST}" \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s -- "${SERVICE_NAME}" <<'ENDSSH'
          set -uo pipefail
          SERVICE_NAME="$1"
          DROPIN_DIR="/etc/systemd/system/${SERVICE_NAME}.d"
          REDACTOR=$(mktemp)
          trap 'rm -f "$REDACTOR"' EXIT

          # Python redactor reading stdin -> redacted stdout.
          # PUBLIC: only the full key=value of GOOGLE_*CLIENT_ID is emitted verbatim
          # (public OAuth identifier). For ANY other token sequence, only emit
          # KEY=<REDACTED> per K=V pair detected; never preserve a trailing token
          # without '=' (which may be value-continuation past a space).
          cat >"$REDACTOR" <<'PYEOF'
          import re, sys
          PUBLIC = re.compile(r'^GOOGLE_(DESKTOP_)?CLIENT_ID$')
          KV = re.compile(r'\b([A-Za-z_][A-Za-z0-9_]*)=([^\s]*)')
          for raw in sys.stdin:
              line = raw.rstrip('\n')
              if line.startswith('Environment='):
                  prefix = 'Environment='
                  rest = line[len(prefix):]
              else:
                  prefix = ''
                  rest = line
              # Find all KEY=value tokens; redact non-public values; drop
              # anything between them (which would be value-continuation past
              # a space and could leak data).
              out = []
              for m in KV.finditer(rest):
                  k, v = m.group(1), m.group(2)
                  if PUBLIC.match(k):
                      out.append(k + '=' + v)
                  else:
                      out.append(k + '=<REDACTED>')
              # If no KEY=VAL tokens at all (e.g. comment line, blank, '['stanza), emit as-is
              if not out and rest.strip():
                  print(prefix + rest)
              else:
                  print(prefix + ' '.join(out))
          PYEOF

          redact() { python3 "$REDACTOR"; }

          echo "==== systemctl cat $SERVICE_NAME (Environment= lines REDACTED) ===="
          systemctl cat "$SERVICE_NAME" 2>/dev/null | redact || echo "(no unit found)"

          echo ""
          echo "==== Drop-in dir contents (Environment= REDACTED) ===="
          ls -la "$DROPIN_DIR/" 2>/dev/null || true
          if [ -d "$DROPIN_DIR" ]; then
              for f in "$DROPIN_DIR"/*.conf; do
                  if [ -f "$f" ]; then
                      echo "----- $f -----"
                      redact <"$f"
                  fi
              done
          fi

          echo ""
          echo "==== systemctl show --property=EnvironmentFiles (paths only) ===="
          systemctl show "$SERVICE_NAME" --property=EnvironmentFiles 2>/dev/null

          echo ""
          echo "==== systemctl show --property=Environment (REDACTED) ===="
          systemctl show "$SERVICE_NAME" --property=Environment 2>/dev/null | redact

          echo ""
          echo "==== Running process env (REDACTED, GOOGLE_*CLIENT_ID visible) ===="
          PID=$(systemctl show "$SERVICE_NAME" --property=MainPID --value 2>/dev/null)
          if [ -n "$PID" ] && [ "$PID" != "0" ] && [ -r "/proc/$PID/environ" ]; then
              tr '\0' '\n' < "/proc/$PID/environ" | redact
          else
              echo "(no running process or /proc/$PID/environ unreadable)"
          fi
          ENDSSH
