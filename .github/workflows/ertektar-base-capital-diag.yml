name: Ertektar vs valos keszlet — base_capital diag (read-only)

# FK-052 follow-up (2026-07-03): a currency_stock VAULT sorok (218M HUF gyanú) vs a
# ténylegesen levezethető készlet. KIZÁRÓLAG SELECT — semmit nem ír.
# A cél: számszerűen megállapítani, mennyi a seed-eredetű torzítás territory/valuta
# bontásban, és mi a mozgás-alapú levezetett érték (shipment-booking + transfer).

on:
  workflow_dispatch:

jobs:
  diag:
    name: base_capital vs derived stock (Neon read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read-only SELECT-ek az elo DB-n
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          NEON_URL=$(grep '^NEON_DATABASE_URL=' /opt/valutavalto/backend/.env 2>/dev/null | cut -d= -f2-)
          NEON_URL="${NEON_URL%\"}"; NEON_URL="${NEON_URL#\"}"
          PSQL17=/usr/lib/postgresql/17/bin/psql; [ -x "$PSQL17" ] || PSQL17=psql
          if [ -z "$NEON_URL" ]; then echo "::error::NEON_DATABASE_URL nincs a prod .env-ben"; exit 1; fi

          echo "=== D1 — currency_stock VAULT sorok (a panel adatforrása) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT cs.entity_id AS territory_id, vt.name AS territory, cs.currency_code,
                   cs.quantity, cs.weighted_avg_cost, cs.last_updated
            FROM currency_stock cs
            LEFT JOIN vault_territory vt ON vt.id::text = cs.entity_id
            WHERE cs.entity_type = 'VAULT'
            ORDER BY cs.entity_id::int, cs.currency_code;"

          echo "=== D2 — vault_territory base_capital (a gyanús seed-forrás, V159/V332) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT id, name, base_capital FROM vault_territory ORDER BY id;"

          echo "=== D3 — Shipment-booking mozgások vault territory-nként (d499a650 óta) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT b.vault_territory_id AS territory, sri.currency_code IS NULL AS curr_null,
                   COALESCE(c.code, sri.currency_code::text) AS currency,
                   sr.status, COUNT(*) AS cnt, SUM(sri.quantity) AS total_qty
            FROM shipment_request sr
            JOIN shipment_request_item sri ON sri.shipment_request_id = sr.id
            LEFT JOIN currency c ON c.id::text = sri.currency_code::text
            JOIN branch b ON b.id = sr.to_branch_id AND b.is_vault = TRUE
            GROUP BY 1,2,3,4 ORDER BY 1,3,4;" 2>/dev/null || \
          "$PSQL17" "$NEON_URL" -c "
            SELECT table_name, column_name FROM information_schema.columns
            WHERE table_name IN ('shipment_request','shipment_request_item')
            ORDER BY table_name, ordinal_position;"

          echo "=== D4 — inventory_movement vault-branch erintettseggel (historikusan ~0 vart) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT im.movement_type, im.status, COUNT(*) AS cnt, SUM(im.amount) AS total
            FROM inventory_movement im
            LEFT JOIN branch bf ON bf.id = im.from_branch_id
            LEFT JOIN branch bt ON bt.id = im.to_branch_id
            WHERE COALESCE(bf.is_vault, FALSE) OR COALESCE(bt.is_vault, FALSE)
            GROUP BY 1,2 ORDER BY 1,2;"

          echo "=== D5 — Transfer alrendszer vault-erintettseg (currency_stock-ot iro masik ut) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT t.status, COUNT(*) AS cnt
            FROM transfer t
            JOIN branch b ON (b.id = t.from_branch_id OR b.id = t.to_branch_id)
            WHERE b.is_vault = TRUE
            GROUP BY 1 ORDER BY 1;" 2>/dev/null || echo "(transfer tabla nem letezik / mas neven fut — OK)"

          echo "=== D6 — currency_stock updated_at histogram (mikor irodott utoljara VAULT sor) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT date_trunc('day', last_updated) AS nap, COUNT(*)
            FROM currency_stock WHERE entity_type='VAULT'
            GROUP BY 1 ORDER BY 1 DESC LIMIT 10;"

          echo "=== D7 — MOZGAS-ALAPU LEVEZETETT vault-keszlet territory+valuta bontasban ==="
          # A vault tenyleges keszlete a lezart (DELIVERED) shipmentekbol:
          #   +delivered_amount ahol a vault a CEL (to_branch), -ahol a FORRAS (from_branch);
          # + a lezart (COMPLETED) transferek ugyanigy. inventory_movement historikusan 0 (D4).
          "$PSQL17" "$NEON_URL" -c "
            WITH ship AS (
              SELECT b.vault_territory_id AS territory, c.code AS currency,
                     SUM(CASE WHEN sr.to_branch_id = b.id THEN COALESCE(sri.delivered_amount, sri.approved_amount, 0) ELSE 0 END)
                   - SUM(CASE WHEN sr.from_branch_id = b.id THEN COALESCE(sri.delivered_amount, sri.approved_amount, 0) ELSE 0 END) AS net
              FROM shipment_request sr
              JOIN shipment_request_item sri ON sri.shipment_request_id = sr.id
              JOIN currency c ON c.id = sri.currency_id
              JOIN branch b ON b.is_vault = TRUE AND (b.id = sr.to_branch_id OR b.id = sr.from_branch_id)
              WHERE sr.status = 'DELIVERED'
              GROUP BY 1, 2
            ), tr AS (
              SELECT b.vault_territory_id AS territory, c.code AS currency,
                     SUM(CASE WHEN t.to_branch_id = b.id THEN COALESCE(t.received_amount, t.amount, 0) ELSE 0 END)
                   - SUM(CASE WHEN t.from_branch_id = b.id THEN COALESCE(t.amount, 0) ELSE 0 END) AS net
              FROM transfer t
              JOIN currency c ON c.id = t.currency_id
              JOIN branch b ON b.is_vault = TRUE AND (b.id = t.to_branch_id OR b.id = t.from_branch_id)
              WHERE t.status = 'COMPLETED'
              GROUP BY 1, 2
            )
            SELECT COALESCE(s.territory, tr.territory) AS territory,
                   COALESCE(s.currency, tr.currency) AS currency,
                   COALESCE(s.net, 0) AS shipment_net,
                   COALESCE(tr.net, 0) AS transfer_net,
                   COALESCE(s.net, 0) + COALESCE(tr.net, 0) AS derived_stock
            FROM ship s FULL OUTER JOIN tr ON tr.territory = s.territory AND tr.currency = s.currency
            ORDER BY 1, 2;" 2>&1 || true

          echo "=== D7b — transfer tabla oszlopai (ha a fenti elhasalt) ==="
          "$PSQL17" "$NEON_URL" -c "
            SELECT column_name FROM information_schema.columns
            WHERE table_name = 'transfer' ORDER BY ordinal_position;" 2>&1 || true
          REMOTE
