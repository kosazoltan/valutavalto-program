name: Update B2 credentials on Hetzner

# Manualis workflow_dispatch - frissiti a Hetzner backend B2 credentials-eit
# az UJ rotalt key-vel. Az ertekek GitHub Secrets-bol jonnek
# (B2_KEY_ID_NEW, B2_APP_KEY_NEW), soha nem jelennek meg sima szovegben
# sem a remote shell command line-on (base64+stdin injection).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROTATE-B2 to confirm production B2 credential rotation'
        required: true
        type: string
      restart_backend:
        description: 'Restart backend after env update?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: hetzner-production-mutate
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: valuta-backend.service
  ENV_FILE: /opt/valutavalto/backend/.env
  RCLONE_FILE: /root/.config/rclone/rclone.conf

jobs:
  update-creds:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate confirmation input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ROTATE-B2" ]; then
            echo "ERROR: confirm input must equal ROTATE-B2"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Setup SSH (pin host key if available)
        env:
          HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          SERVER_IP: ${{ secrets.VPS_SERVER_IP }}
          PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Using pinned host key from VPS_SSH_HOST_KEY secret."
          else
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
            echo "WARN: no pinned host key, falling back to TOFU keyscan."
          fi

      - name: Update .env + rclone.conf with rotated B2 credentials
        env:
          NEW_KEY_ID: ${{ secrets.B2_KEY_ID_NEW }}
          NEW_APP_KEY: ${{ secrets.B2_APP_KEY_NEW }}
          RESTART: ${{ github.event.inputs.restart_backend }}
          STRICT_HOST: ${{ secrets.VPS_SSH_HOST_KEY != '' && 'yes' || 'accept-new' }}
        run: |
          # Base64-encode secrets so quoting / special chars cannot break injection,
          # and so the values never appear on the remote process command line.
          NEW_KEY_ID_B64=$(printf '%s' "$NEW_KEY_ID" | base64 -w0)
          NEW_APP_KEY_B64=$(printf '%s' "$NEW_APP_KEY" | base64 -w0)
          ROTATION_LABEL=$(date -u +%Y-%m-%d)

          ssh -i ~/.ssh/deploy_key \
              -o "StrictHostKeyChecking=${STRICT_HOST}" \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s -- "${NEW_KEY_ID_B64}" "${NEW_APP_KEY_B64}" "${RESTART}" "${ROTATION_LABEL}" "${SERVICE_NAME}" "${ENV_FILE}" "${RCLONE_FILE}" <<'ENDSSH'
          set -euo pipefail
          NEW_KEY_ID="$(printf '%s' "$1" | base64 -d)"
          NEW_APP_KEY="$(printf '%s' "$2" | base64 -d)"
          RESTART="$3"
          ROTATION_LABEL="$4"
          SERVICE_NAME="$5"
          ENV_FILE="$6"
          RCLONE_FILE="$7"

          # ---- ENV FILE UPDATE (python: no sed escaping pitfalls) ----
          if [ ! -f "$ENV_FILE" ]; then
            echo "FATAL: $ENV_FILE missing - aborting (B2 update would be lost)"
            exit 1
          fi
          BAK="$ENV_FILE.pre-rotation-$ROTATION_LABEL.bak"
          [ -f "$BAK" ] || { cp "$ENV_FILE" "$BAK"; chmod 600 "$BAK"; }

          ENV_FILE="$ENV_FILE" NEW_KEY_ID="$NEW_KEY_ID" NEW_APP_KEY="$NEW_APP_KEY" python3 <<'PYEOF'
          import os
          path = os.environ['ENV_FILE']
          updates = {
              'B2_KEY_ID': os.environ['NEW_KEY_ID'],
              'B2_APP_KEY': os.environ['NEW_APP_KEY'],
          }
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          remaining = dict(updates)
          for i, line in enumerate(lines):
              for k in list(remaining):
                  if line.startswith(k + '='):
                      lines[i] = k + '=' + remaining.pop(k) + '\n'
                      break
          if remaining:
              if lines and not lines[-1].endswith('\n'):
                  lines[-1] += '\n'
              for k, v in remaining.items():
                  lines.append(k + '=' + v + '\n')
          tmp = path + '.tmp'
          with open(tmp, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PYEOF
          echo "=== $ENV_FILE: B2 key fields updated (values redacted)"
          grep -E '^B2_(KEY_ID|APP_KEY)=' "$ENV_FILE" | sed 's/=.*/=<REDACTED>/'

          # ---- RCLONE CONF UPDATE ----
          if [ -f "$RCLONE_FILE" ]; then
            BAK="$RCLONE_FILE.pre-rotation-$ROTATION_LABEL.bak"
            [ -f "$BAK" ] || { cp "$RCLONE_FILE" "$BAK"; chmod 600 "$BAK"; }

            RCLONE_FILE="$RCLONE_FILE" NEW_KEY_ID="$NEW_KEY_ID" NEW_APP_KEY="$NEW_APP_KEY" python3 <<'PYEOF'
          import os
          path = os.environ['RCLONE_FILE']
          new_id = os.environ['NEW_KEY_ID']
          new_key = os.environ['NEW_APP_KEY']
          with open(path, 'r', encoding='utf-8') as f:
              text = f.read()
          out, in_b2 = [], False
          for line in text.splitlines(keepends=True):
              stripped = line.strip()
              if stripped.startswith('[') and stripped.endswith(']'):
                  in_b2 = (stripped == '[b2]')
                  out.append(line)
                  continue
              if in_b2:
                  if stripped.startswith('account') and '=' in stripped:
                      out.append('account = ' + new_id + '\n')
                      continue
                  if stripped.startswith('key') and '=' in stripped:
                      out.append('key = ' + new_key + '\n')
                      continue
              out.append(line)
          tmp = path + '.tmp'
          with open(tmp, 'w', encoding='utf-8') as f:
              f.write(''.join(out))
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PYEOF
            chmod 600 "$RCLONE_FILE"

            echo "=== $RCLONE_FILE: account + key updated under [b2] (values redacted)"
            # Show only the [b2] stanza
            awk '/^\[b2\]/{p=1;print;next} /^\[/{p=0} p{print}' "$RCLONE_FILE" \
              | grep -E '^(account|key)[[:space:]]*=' \
              | sed 's/=.*/=<REDACTED>/' || true
          else
            echo "WARN: $RCLONE_FILE missing - skipping rclone update"
          fi

          # ---- VERIFY VIA RCLONE (must succeed or workflow fails) ----
          if command -v rclone >/dev/null 2>&1 && [ -f "$RCLONE_FILE" ]; then
            echo "=== rclone lsd b2: (smoke test against valuta-backup bucket)"
            SMOKE_LOG="$(mktemp)"
            if ! rclone lsd b2:valuta-backup --max-depth 1 >"$SMOKE_LOG" 2>&1; then
              echo "FATAL: rclone smoke test FAILED with rotated credentials:"
              sed 's/[A-Za-z0-9_]\{20,\}/<REDACTED>/g' "$SMOKE_LOG"
              rm -f "$SMOKE_LOG"
              exit 2
            fi
            ENTRIES=$(wc -l <"$SMOKE_LOG" | tr -d ' ')
            echo "rclone smoke OK - $ENTRIES entries listed"
            rm -f "$SMOKE_LOG"
          else
            echo "WARN: rclone not installed - skipping smoke test"
          fi

          # ---- OPTIONAL BACKEND RESTART ----
          if [ "$RESTART" = "true" ]; then
            echo "=== Restarting $SERVICE_NAME"
            systemctl daemon-reload
            systemctl restart "$SERVICE_NAME"
            sleep 10
            if ! systemctl is-active "$SERVICE_NAME" >/dev/null; then
              journalctl -u "$SERVICE_NAME" -n 30 --no-pager
              exit 3
            fi
            echo "=== Backend UP"
          else
            echo "=== Restart skipped (backup script runs standalone)"
          fi
          ENDSSH
