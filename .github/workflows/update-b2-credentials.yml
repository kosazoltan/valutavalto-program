name: Update B2 credentials on Hetzner (rotation 2026-05-16)

# Manualis workflow_dispatch — frissiti a Hetzner backend B2 credentials-eit
# az UJ rotalt key-vel (master-eq, valuta-backup-master-v2).
# Az ertekek GitHub Secrets-bol jonnek (B2_KEY_ID_NEW, B2_APP_KEY_NEW),
# soha nem jelennek meg sima szovegben.

on:
  workflow_dispatch:
    inputs:
      restart_backend:
        description: 'Restart backend after env update?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: hetzner-b2-creds-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: valuta-backend.service

jobs:
  update-creds:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update .env + rclone.conf with rotated B2 credentials
        env:
          NEW_KEY_ID: ${{ secrets.B2_KEY_ID_NEW }}
          NEW_APP_KEY: ${{ secrets.B2_APP_KEY_NEW }}
          RESTART: ${{ github.event.inputs.restart_backend }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "NEW_KEY_ID='$NEW_KEY_ID' NEW_APP_KEY='$NEW_APP_KEY' RESTART='$RESTART' bash -s" << 'ENDSSH'
            set -euo pipefail
            ENV_FILE=/opt/valutavalto/backend/.env
            RCLONE_FILE=/root/.config/rclone/rclone.conf

            # ---- ENV FILE UPDATE ----
            if [ -f "$ENV_FILE" ]; then
              # backup once (idempotent)
              [ -f "$ENV_FILE.pre-rotation-2026-05-16.bak" ] || cp "$ENV_FILE" "$ENV_FILE.pre-rotation-2026-05-16.bak"

              if grep -q '^B2_KEY_ID=' "$ENV_FILE"; then
                sed -i "s|^B2_KEY_ID=.*|B2_KEY_ID=$NEW_KEY_ID|" "$ENV_FILE"
              else
                echo "B2_KEY_ID=$NEW_KEY_ID" >> "$ENV_FILE"
              fi
              if grep -q '^B2_APP_KEY=' "$ENV_FILE"; then
                sed -i "s|^B2_APP_KEY=.*|B2_APP_KEY=$NEW_APP_KEY|" "$ENV_FILE"
              else
                echo "B2_APP_KEY=$NEW_APP_KEY" >> "$ENV_FILE"
              fi
              echo "=== $ENV_FILE: B2 key fields updated (values redacted)"
              grep -E '^B2_(KEY_ID|APP_KEY)=' "$ENV_FILE" | sed 's/=.*/=<REDACTED>/'
            else
              echo "WARN: $ENV_FILE missing — skipping"
            fi

            # ---- RCLONE CONF UPDATE ----
            if [ -f "$RCLONE_FILE" ]; then
              [ -f "$RCLONE_FILE.pre-rotation-2026-05-16.bak" ] || cp "$RCLONE_FILE" "$RCLONE_FILE.pre-rotation-2026-05-16.bak"

              # rclone.conf format expected:
              # [b2]
              # type = b2
              # account = ...
              # key = ...
              # hard_delete = true
              # Update account + key lines under [b2] section only
              awk -v new_id="$NEW_KEY_ID" -v new_key="$NEW_APP_KEY" '
                BEGIN { in_b2 = 0 }
                /^\[/ {
                  if ($0 == "[b2]") in_b2 = 1
                  else in_b2 = 0
                  print; next
                }
                in_b2 && /^account[[:space:]]*=/ { print "account = " new_id; next }
                in_b2 && /^key[[:space:]]*=/     { print "key = " new_key; next }
                { print }
              ' "$RCLONE_FILE" > "$RCLONE_FILE.tmp" && mv "$RCLONE_FILE.tmp" "$RCLONE_FILE"
              chmod 600 "$RCLONE_FILE"

              echo "=== $RCLONE_FILE: account + key updated under [b2] (values redacted)"
              grep -E '^(account|key)[[:space:]]*=' "$RCLONE_FILE" | sed 's/=.*/=<REDACTED>/'
            else
              echo "WARN: $RCLONE_FILE missing — skipping"
            fi

            # ---- VERIFY VIA RCLONE ----
            if command -v rclone >/dev/null 2>&1 && [ -f "$RCLONE_FILE" ]; then
              echo "=== rclone lsd b2: (smoke test against valuta-backup bucket)"
              rclone lsd b2:valuta-backup --max-depth 1 || echo "WARN: rclone smoke test failed (may need to re-run after a moment)"
            fi

            # ---- OPTIONAL BACKEND RESTART ----
            if [ "$RESTART" = "true" ]; then
              echo "=== Restarting valuta-backend.service"
              systemctl daemon-reload
              systemctl restart valuta-backend.service
              sleep 10
              systemctl is-active valuta-backend.service || { journalctl -u valuta-backend.service -n 20 --no-pager; exit 1; }
              echo "=== Backend UP"
            else
              echo "=== Restart skipped (backup script runs standalone, not bound to backend)"
            fi
          ENDSSH
