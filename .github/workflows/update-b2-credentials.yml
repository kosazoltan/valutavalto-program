name: Update B2 credentials on Hetzner

# Manualis workflow_dispatch - frissiti a Hetzner backend B2 credentials-eit
# az UJ rotalt key-vel. Az ertekek GitHub Secrets-bol jonnek
# (B2_KEY_ID_NEW, B2_APP_KEY_NEW), soha nem jelennek meg sima szovegben
# sem a remote shell command line-on (argv-mentes scp + source pattern).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROTATE-B2 to confirm production B2 credential rotation'
        required: true
        type: string
      restart_backend:
        description: 'Restart backend after env update?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: hetzner-production-mutate
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: valuta-backend.service
  ENV_FILE: /opt/valutavalto/backend/.env
  RCLONE_FILE: /root/.config/rclone/rclone.conf

jobs:
  update-creds:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate confirmation input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ROTATE-B2" ]; then
            echo "ERROR: confirm input must equal ROTATE-B2"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Setup SSH (pin host key if available)
        env:
          HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          SERVER_IP: ${{ secrets.VPS_SERVER_IP }}
          PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Using pinned host key from VPS_SSH_HOST_KEY secret."
          else
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
            echo "WARN: no pinned host key, falling back to TOFU keyscan."
          fi

      - name: Update .env + rclone.conf with rotated B2 credentials
        env:
          NEW_KEY_ID: ${{ secrets.B2_KEY_ID_NEW }}
          NEW_APP_KEY: ${{ secrets.B2_APP_KEY_NEW }}
          RESTART: ${{ github.event.inputs.restart_backend }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SERVER_IP: ${{ secrets.VPS_SERVER_IP }}
          STRICT_HOST: ${{ secrets.VPS_SSH_HOST_KEY != '' && 'yes' || 'accept-new' }}
        run: |
          # Step 1: write secrets to a LOCAL tempfile (mode 600), then scp it to
          # remote tempfile. This keeps the raw values OUT of any process argv
          # (rclone smoke test, ssh command line, /proc/<pid>/cmdline).
          # The remote shell script reads them via `source`, then shreds the file.
          ROTATION_LABEL=$(date -u +%Y-%m-%d)
          LOCAL_TMP=$(mktemp)
          chmod 600 "$LOCAL_TMP"
          cat > "$LOCAL_TMP" <<EOF
          NEW_KEY_ID=$NEW_KEY_ID
          NEW_APP_KEY=$NEW_APP_KEY
          EOF

          # Pick a remote tempfile path (predictable but in /root/ to keep it
          # root-only readable until the script shreds it).
          REMOTE_TMP="/root/.b2-rotation-$(date -u +%s).env"

          # Single scp invocation, then a single ssh invocation that sources +
          # shreds. The path argument is not secret.
          scp -i ~/.ssh/deploy_key \
              -o "StrictHostKeyChecking=${STRICT_HOST}" \
              "$LOCAL_TMP" "${SSH_USER}@${SERVER_IP}:${REMOTE_TMP}"
          shred -u "$LOCAL_TMP" 2>/dev/null || rm -f "$LOCAL_TMP"

          ssh -i ~/.ssh/deploy_key \
              -o "StrictHostKeyChecking=${STRICT_HOST}" \
              "${SSH_USER}@${SERVER_IP}" \
              bash -s -- "${REMOTE_TMP}" "${RESTART}" "${ROTATION_LABEL}" "${SERVICE_NAME}" "${ENV_FILE}" "${RCLONE_FILE}" <<'ENDSSH'
          set -euo pipefail
          REMOTE_TMP="$1"
          RESTART="$2"
          ROTATION_LABEL="$3"
          SERVICE_NAME="$4"
          ENV_FILE="$5"
          RCLONE_FILE="$6"

          # Source secrets into env, then immediately shred the source file.
          # NEW_KEY_ID and NEW_APP_KEY are now in this shell's env only.
          chmod 600 "$REMOTE_TMP"
          set -a
          # shellcheck disable=SC1090
          source "$REMOTE_TMP"
          set +a
          shred -u "$REMOTE_TMP" 2>/dev/null || rm -f "$REMOTE_TMP"

          # ---- ENV FILE pre-check ----
          if [ ! -f "$ENV_FILE" ]; then
            echo "FATAL: $ENV_FILE missing - aborting (B2 update would be lost)"
            exit 1
          fi
          ENV_BAK="$ENV_FILE.pre-rotation-$ROTATION_LABEL.bak"
          [ -f "$ENV_BAK" ] || { cp "$ENV_FILE" "$ENV_BAK"; chmod 600 "$ENV_BAK"; }

          RCLONE_BAK=""
          if [ -f "$RCLONE_FILE" ]; then
            RCLONE_BAK="$RCLONE_FILE.pre-rotation-$ROTATION_LABEL.bak"
            [ -f "$RCLONE_BAK" ] || { cp "$RCLONE_FILE" "$RCLONE_BAK"; chmod 600 "$RCLONE_BAK"; }
          fi

          # Rollback function — restore both files from the .bak created above.
          ROLLBACK() {
            echo "=== ROLLBACK: restoring $ENV_BAK -> $ENV_FILE"
            cp "$ENV_BAK" "$ENV_FILE" || true
            if [ -n "$RCLONE_BAK" ] && [ -f "$RCLONE_BAK" ]; then
              echo "=== ROLLBACK: restoring $RCLONE_BAK -> $RCLONE_FILE"
              cp "$RCLONE_BAK" "$RCLONE_FILE" || true
            fi
          }

          # ---- ENV FILE UPDATE (python: no sed escaping pitfalls) ----
          ENV_FILE="$ENV_FILE" NEW_KEY_ID="$NEW_KEY_ID" NEW_APP_KEY="$NEW_APP_KEY" python3 <<'PYEOF'
          import os
          path = os.environ['ENV_FILE']
          updates = {
              'B2_KEY_ID': os.environ['NEW_KEY_ID'],
              'B2_APP_KEY': os.environ['NEW_APP_KEY'],
          }
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          remaining = dict(updates)
          for i, line in enumerate(lines):
              for k in list(remaining):
                  if line.startswith(k + '='):
                      lines[i] = k + '=' + remaining.pop(k) + '\n'
                      break
          if remaining:
              if lines and not lines[-1].endswith('\n'):
                  lines[-1] += '\n'
              for k, v in remaining.items():
                  lines.append(k + '=' + v + '\n')
          tmp = path + '.tmp'
          with open(tmp, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PYEOF
          echo "=== $ENV_FILE: B2 key fields updated (values redacted)"
          grep -E '^B2_(KEY_ID|APP_KEY)=' "$ENV_FILE" | sed 's/=.*/=<REDACTED>/'

          # ---- RCLONE CONF UPDATE ----
          if [ -f "$RCLONE_FILE" ]; then
            RCLONE_FILE="$RCLONE_FILE" NEW_KEY_ID="$NEW_KEY_ID" NEW_APP_KEY="$NEW_APP_KEY" python3 <<'PYEOF'
          import os
          path = os.environ['RCLONE_FILE']
          new_id = os.environ['NEW_KEY_ID']
          new_key = os.environ['NEW_APP_KEY']
          with open(path, 'r', encoding='utf-8') as f:
              text = f.read()
          out, in_b2 = [], False
          for line in text.splitlines(keepends=True):
              stripped = line.strip()
              if stripped.startswith('[') and stripped.endswith(']'):
                  in_b2 = (stripped == '[b2]')
                  out.append(line)
                  continue
              if in_b2:
                  if stripped.startswith('account') and '=' in stripped:
                      out.append('account = ' + new_id + '\n')
                      continue
                  if stripped.startswith('key') and '=' in stripped:
                      out.append('key = ' + new_key + '\n')
                      continue
              out.append(line)
          tmp = path + '.tmp'
          with open(tmp, 'w', encoding='utf-8') as f:
              f.write(''.join(out))
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PYEOF
            chmod 600 "$RCLONE_FILE"

            echo "=== $RCLONE_FILE: account + key updated under [b2] (values redacted)"
            # Show only the [b2] stanza
            awk '/^\[b2\]/{p=1;print;next} /^\[/{p=0} p{print}' "$RCLONE_FILE" \
              | grep -E '^(account|key)[[:space:]]*=' \
              | sed 's/=.*/=<REDACTED>/' || true
          else
            echo "WARN: $RCLONE_FILE missing - skipping rclone update"
          fi

          # ---- VERIFY VIA RCLONE (must succeed or workflow fails + rollback) ----
          if ! command -v rclone >/dev/null 2>&1; then
            echo "FATAL: rclone not installed on remote - cannot verify rotated credentials"
            ROLLBACK
            exit 4
          fi
          if [ ! -f "$RCLONE_FILE" ]; then
            echo "FATAL: $RCLONE_FILE missing after update - cannot verify"
            ROLLBACK
            exit 5
          fi

          echo "=== rclone lsd b2: (smoke test against valuta-backup bucket)"
          SMOKE_LOG="$(mktemp)"
          if ! rclone lsd b2:valuta-backup --max-depth 1 >"$SMOKE_LOG" 2>&1; then
            echo "FATAL: rclone smoke test FAILED with rotated credentials - rolling back"
            sed 's/[A-Za-z0-9_]\{20,\}/<REDACTED>/g' "$SMOKE_LOG"
            rm -f "$SMOKE_LOG"
            ROLLBACK
            exit 2
          fi
          ENTRIES=$(wc -l <"$SMOKE_LOG" | tr -d ' ')
          echo "rclone smoke OK - $ENTRIES entries listed"
          rm -f "$SMOKE_LOG"

          # ---- OPTIONAL BACKEND RESTART (also rollback on failure) ----
          if [ "$RESTART" = "true" ]; then
            echo "=== Restarting $SERVICE_NAME"
            systemctl daemon-reload
            systemctl restart "$SERVICE_NAME"
            sleep 10
            if ! systemctl is-active "$SERVICE_NAME" >/dev/null; then
              journalctl -u "$SERVICE_NAME" -n 30 --no-pager
              ROLLBACK
              systemctl daemon-reload || true
              systemctl restart "$SERVICE_NAME" || true
              exit 3
            fi
            echo "=== Backend UP"
          else
            echo "=== Restart skipped (backup script runs standalone)"
          fi
          ENDSSH
