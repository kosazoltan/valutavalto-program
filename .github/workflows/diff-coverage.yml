name: Diff Coverage

# Diff-coverage gate: measures test coverage on the lines CHANGED by the PR (backend JaCoCo +
# frontend Vitest), NOT on the whole repo - so legacy debt never blocks, while new/modified code
# has to carry tests.
#
# PHASE: enforce (BLOCKING). DIFF_COVERAGE_MIN is the minimum coverage of the changed lines.
# Threshold rationale (measured 2026-09-11, #1744 follow-up): the FK-111 PR scored 89% frontend
# diff-coverage with ordinary TDD, and the repo-wide frontend line coverage is 65%. 70 therefore
# demands genuinely tested new code without being reachable only by exceptional effort.
#
# NOTE: a diff touching no measurable line reports "No lines with coverage information in this
# diff." and PASSES - that is correct, there is nothing to cover (docs, config, pure type files).

on:
  pull_request:
    branches: [main]
    # NO `paths:` filter. A required status check that is skipped by a path filter never
    # reports at all, which leaves such PRs permanently BLOCKED ("Expected - waiting for
    # status"). The jobs instead detect an empty diff themselves and exit early (see the
    # "relevant changes" guard step), so a docs-only PR passes in seconds.

permissions:
  contents: read
  pull-requests: write

env:
  DIFF_COVERAGE_MIN: '70'   # enforce: changed lines must be >= 70% covered

jobs:
  backend-diff-coverage:
    name: Backend diff-coverage (JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a diff-cover a base branch-hez méri a diffet
      - name: Relevant changes?
        id: changed
        run: |
          # #1748: no `| grep -q` here. Under pipefail `grep -q` exits on the first match,
          # git diff takes SIGPIPE, and the pipeline can report non-zero even though files
          # DID change - which would silently skip the gate. `--quiet` exits 1 on changes.
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- backend/src/main/java; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend main-source change in this PR - diff-coverage is vacuous, skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.changed.outputs.run == 'true'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Python (diff-cover)
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: diff-cover telepítése
        if: steps.changed.outputs.run == 'true'
        run: pip install "diff-cover==9.2.0"
      - name: Backend teszt + JaCoCo riport
        if: steps.changed.outputs.run == 'true'
        run: cd backend && mvn -B test --no-transfer-progress
      - name: Diff-coverage kiértékelés (backend)
        if: steps.changed.outputs.run == 'true'
        # BLOCKING: no `|| true` - that swallowed the non-zero exit of --fail-under and made the
        # threshold decorative. diff-cover exits 1 below the threshold, which fails the job.
        run: |
          cd backend
          diff-cover target/site/jacoco/jacoco.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=${{ env.DIFF_COVERAGE_MIN }} \
            --markdown-report ../backend-diff-cover.md \
            --src-roots src/main/java
      - name: Job summary (backend)
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          echo "## Backend diff-coverage (JaCoCo)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f backend-diff-cover.md ]; then cat backend-diff-cover.md >> "$GITHUB_STEP_SUMMARY"; else echo "Nincs backend-diff a PR-ben." >> "$GITHUB_STEP_SUMMARY"; fi

  frontend-diff-coverage:
    name: Frontend diff-coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Relevant changes?
        id: changed
        run: |
          # #1748: no `| grep -q` here. Under pipefail `grep -q` exits on the first match,
          # git diff takes SIGPIPE, and the pipeline can report non-zero even though files
          # DID change - which would silently skip the gate. `--quiet` exits 1 on changes.
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- frontend-react/src; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend-react/src change in this PR - diff-coverage is vacuous, skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          # #1744: on Node 20 the vitest worker crashes at startup
          # (webidl.util.markAsUncloneable is not a function) because frontend-react's
          # jsdom@30 / @testing-library/jest-dom@7 require Node >=22 (npm EBADENGINE in
          # the job log). As a result NOT A SINGLE test executed.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Python (diff-cover)
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: diff-cover telepítése
        if: steps.changed.outputs.run == 'true'
        run: pip install "diff-cover==9.2.0"
      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        run: cd frontend-react && npm ci
      - name: Vitest + coverage
        if: steps.changed.outputs.run == 'true'
        run: cd frontend-react && npm run test:coverage
      - name: Diff-coverage kiértékelés (frontend)
        if: steps.changed.outputs.run == 'true'
        # BLOCKING: see the backend job above - `|| true` would neutralise --fail-under.
        run: |
          cd frontend-react
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=${{ env.DIFF_COVERAGE_MIN }} \
            --markdown-report ../frontend-diff-cover.md \
            --src-roots .
      - name: Job summary (frontend)
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          echo "## Frontend diff-coverage (Vitest)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f frontend-diff-cover.md ]; then cat frontend-diff-cover.md >> "$GITHUB_STEP_SUMMARY"; else echo "Nincs frontend-diff a PR-ben." >> "$GITHUB_STEP_SUMMARY"; fi

  # NOT a required check on purpose: this job calls the LIVE production API, so a deploy
  # window or a prod incident can turn it red for reasons unrelated to the PR.
  frontend-production-api-integration:
    name: Frontend production API integration (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Relevant changes?
        id: changed
        run: |
          # #1748: no `| grep -q` here. Under pipefail `grep -q` exits on the first match,
          # git diff takes SIGPIPE, and the pipeline can report non-zero even though files
          # DID change - which would silently skip the gate. `--quiet` exits 1 on changes.
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- frontend-react; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend-react change in this PR - skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          # #1744: on Node 20 the vitest worker crashes at startup
          # (webidl.util.markAsUncloneable is not a function) because frontend-react's
          # jsdom@30 / @testing-library/jest-dom@7 require Node >=22 (npm EBADENGINE in
          # the job log). As a result NOT A SINGLE test executed.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        run: cd frontend-react && npm ci
      - name: Production API integration
        if: steps.changed.outputs.run == 'true'
        run: cd frontend-react && npm run test:integration:prod
