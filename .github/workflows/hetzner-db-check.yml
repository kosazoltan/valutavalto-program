name: Hetzner DB Check (read-only)

# Egyszeri/igény szerinti, KIZÁRÓLAG OLVASÓ ellenőrzés a Hetzner prod 'valuta' DB-n a
# meglévő deploy-secret SSH-kulccsal (ugyanaz, amivel a deploy-hetzner.yml dolgozik).
# Célja: a prod DB migráció-verziójának igazolása + a Neon backup-szinkron env állapota.
# NEM módosít semmit (csak SELECT + systemctl show). A connection string jelszava maszkolva.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-check:
    name: Read-only prod DB + backup-sync check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          # Scaleway standby (HA) read-only diagnosztikahoz
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read-only DB + backup-sync env check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== Prod backend futás-állapot (read-only) ==="
            echo "futó JAR        : $(readlink -f /opt/valutavalto/backend/target/valuta-backend-current.jar 2>/dev/null || echo '(nincs symlink)')"
            echo "service uptime  : $(systemctl show valuta-backend.service --property=ActiveEnterTimestamp --value 2>/dev/null)"
            ENV_DUMP0=$(systemctl show valuta-backend.service --property=Environment 2>/dev/null | tr ' ' '\n')
            echo "SPRING_FLYWAY_ENABLED (systemd): $(echo "$ENV_DUMP0" | grep -oE 'SPRING_FLYWAY_ENABLED=[^ ]*' || echo '(nincs)')"
            echo "SPRING_FLYWAY_ENABLED (.env)   : $(grep -E '^SPRING_FLYWAY_ENABLED=' /opt/valutavalto/backend/.env 2>/dev/null || echo '(nincs a .env-ben)')"
            echo "Flyway startup log (utolsó 5)  :"
            journalctl -u valuta-backend.service -n 4000 --no-pager 2>/dev/null | grep -iE 'flyway|migrat' | tail -5 || echo "  (nincs flyway log-sor)"
            echo ""
            echo "=== Prod 'valuta' DB állapot (read-only) ==="
            echo "hostname        : $(hostname)"
            echo "max migráció    : V$(sudo -u postgres psql -d valuta -tAc "SELECT max(version::int) FROM flyway_schema_history WHERE version ~ '^[0-9]+\$'" 2>/dev/null)"
            echo "RUB.is_active   : $(sudo -u postgres psql -d valuta -tAc "SELECT is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "aktív valuták   : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FILTER (WHERE is_active) FROM currency" 2>/dev/null)"
            echo "curr_stock VAULT: $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM currency_stock WHERE entity_type='VAULT'" 2>/dev/null)"
            echo "vault_territory : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM vault_territory" 2>/dev/null)"
            echo "worker_role_asg : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM worker_role_assignment" 2>/dev/null)"
            echo "Szeged ÉT stock : $(sudo -u postgres psql -d valuta -tAc "SELECT (SELECT count(*) FROM currency_stock cs WHERE cs.entity_type='VAULT' AND cs.entity_id=b.vault_territory_id::text) FROM branch b WHERE b.name ILIKE '%Szeged Értéktár%'" 2>/dev/null)"
            echo ""
            echo "=== HA replikáció-állapot (HETZNER, read-only) ==="
            echo "pg_is_in_recovery : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)  (t=standby, f=primary)"
            PGDATA=$(sudo -u postgres psql -tAc "SHOW data_directory" 2>/dev/null)
            echo "PGDATA            : $PGDATA"
            echo "standby/recovery jel: $(sudo ls "$PGDATA"/standby.signal "$PGDATA"/recovery.signal 2>/dev/null | tr '\n' ' ' || echo '(nincs — valódi primary)')"
            echo "--- pg_stat_replication (ha primary: csatlakozott standby-k) ---"
            sudo -u postgres psql -d valuta -c "SELECT client_addr, state, sync_state, replay_lag FROM pg_stat_replication" 2>/dev/null || echo "(nincs sor)"
            echo "--- pg_replication_slots ---"
            sudo -u postgres psql -d valuta -c "SELECT slot_name, slot_type, active, restart_lsn FROM pg_replication_slots" 2>/dev/null || echo "(nincs slot)"
            echo "--- pg_stat_wal_receiver (ha standby: honnan replikál) ---"
            sudo -u postgres psql -d valuta -c "SELECT status, sender_host, last_msg_receipt_time FROM pg_stat_wal_receiver" 2>/dev/null || echo "(nincs WAL receiver — nem standby)"
            echo ""
            echo "=== Neon backup-szinkron env (jelszó maszkolva) ==="
            ENV_DUMP=$(systemctl show valuta-backend.service --property=Environment 2>/dev/null | tr ' ' '\n')
            echo "NEON_SYNC_ENABLED : $(echo "$ENV_DUMP" | grep -oE 'NEON_SYNC_ENABLED=[^ ]*' || echo '(nincs beállítva -> default false)')"
            echo "NEON_DB_URL host  : $(echo "$ENV_DUMP" | grep -oE 'NEON_DATABASE_URL=[^ ]+' | sed -E 's|.*@||; s|/.*||' | head -1 || echo '(nincs)')"
            echo "DATABASE_URL host : $(echo "$ENV_DUMP" | grep -oE 'DATABASE_URL=[^ ]+' | sed -E 's|.*@||; s|/.*||' | head -1 || echo '(localhost / unix socket)')"
            echo ""
            echo "=== utolsó 3 Neon sync-log (ha létezik) ==="
            sudo -u postgres psql -d valuta -tAc "SELECT table_name||' '||status||' '||coalesce(sync_finished_at::text,'-') FROM neon_sync_log ORDER BY sync_finished_at DESC NULLS LAST LIMIT 3" 2>/dev/null || echo "(neon_sync_log nincs / üres)"
          ENDSSH

      - name: 'Hetzner ROOT-CAUSE — mi/mikor állítja vissza a primaryt (read-only)'
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== HETZNER root-cause (read-only) ==="
            echo "postmaster start  : $(sudo -u postgres psql -tAc "SELECT pg_postmaster_start_time()" 2>/dev/null)  (ha ~10:43 -> postgres-restart/recovery a revert)"
            echo "current WAL lsn    : $(sudo -u postgres psql -tAc "SELECT pg_current_wal_lsn()" 2>/dev/null)"
            echo ""
            echo "--- cron (root + postgres) restore/backup/sync/rewind ---"
            (sudo crontab -l 2>/dev/null; sudo -u postgres crontab -l 2>/dev/null; cat /etc/cron.d/* 2>/dev/null) | grep -iE 'restore|backup|basebackup|rewind|resync|sync|valuta|standby|pg_' | grep -v '^#' || echo "(nincs releváns cron sor)"
            echo "--- systemd timerek (restore/backup/sync) ---"
            systemctl list-timers --all 2>/dev/null | grep -iE 'restore|backup|sync|valuta|standby|rewind|pg' || echo "(nincs releváns timer)"
            echo "--- backup/restore logok ---"
            ls -la /var/log/ 2>/dev/null | grep -iE 'backup|restore|b2|basebackup|resync|rewind' || echo "(nincs backup/restore log a /var/log-ban)"
            echo "--- postgres log: recovery/restore/rewind/redo a 10:40-11:00 ablakban ---"
            (sudo journalctl -u postgresql@16-main --since '2026-06-15 10:40' --until '2026-06-15 11:05' --no-pager 2>/dev/null; sudo tail -300 /var/log/postgresql/postgresql-16-main.log 2>/dev/null) | grep -iE 'recovery|restore|rewind|redo|starting point|database system was|shut down|consistent|received|promot|base backup|reset' | tail -25 || echo "(nincs releváns postgres log-sor)"
            echo "--- legutóbbi V327-329 nyoma a flyway history-ban (volt-e, törölve lett-e) ---"
            sudo -u postgres psql -d valuta -c "SELECT version, description, success, installed_on FROM flyway_schema_history WHERE version::text IN ('327','328','329') ORDER BY installed_rank" 2>/dev/null || echo "(nincs 327-329 sor)"
            echo "--- flyway history utolsó 5 (mire áll most) ---"
            sudo -u postgres psql -d valuta -c "SELECT version, description, success, installed_on FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 5" 2>/dev/null || true
            echo ""
            echo "=== HOVÁ ÍR A BACKEND VALÓJÁBAN? (read-only, jelszó maszkolva) ==="
            echo "--- .env DB-cél sorok (érték maszkolva) ---"
            grep -E '^(DATABASE_URL|SPRING_DATASOURCE_URL|DATABASE_USERNAME|DB_HOST|DB_PORT|DB_NAME|POSTGRES)' /opt/valutavalto/backend/.env 2>/dev/null | sed -E 's#(://)[^@]+@#\1***@#; s#(password=)[^&]*#\1***#I' || echo "(nincs DB-sor a .env-ben)"
            echo "--- backend startup JDBC-cél (Flyway/Hikari log) ---"
            journalctl -u valuta-backend.service -n 6000 --no-pager 2>/dev/null | grep -oE 'jdbc:postgresql://[^ \"}]+' | sed -E 's#//[^@/]*@#//***@#' | sort -u | tail -5 || echo "(nincs jdbc URL a logban)"
            echo "--- postgres clusterek + figyelő portok ---"
            pg_lsclusters 2>/dev/null || echo "(nincs pg_lsclusters)"
            sudo ss -tlnp 2>/dev/null | grep -iE 'postgres|5432|5433' || echo "(nincs postgres listen port)"
            echo "--- a 10:42-es RUB-írás létezik-e a lokális DB-ben? (denomination RUB) ---"
            echo "RUB denomination sorok (lokális): $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM denomination d JOIN currency c ON c.id=d.currency_id WHERE c.code='RUB'" 2>/dev/null)"
            echo ""
            echo "=== PgBouncer 6432 routing — hová megy a 'valuta' DB? (read-only, maszkolva) ==="
            sudo ss -tlnp 2>/dev/null | grep -E ':6432' || echo "(nincs 6432 listener)"
            echo "--- pgbouncer [databases] szekció (host maszkolva) ---"
            sudo grep -A30 '^\[databases\]' /etc/pgbouncer/pgbouncer.ini 2>/dev/null | grep -iE 'valuta|host=|neon|=' | sed -E 's#(password=)[^ ]*#\1***#I' | head -15 || echo "(nincs pgbouncer.ini / databases szekció)"
            echo "--- DÖNTŐ: él-e a backend a LOKÁLIS valuta DB-n? (pg_stat_activity) ---"
            echo "lokális valuta backend-kapcsolatok : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM pg_stat_activity WHERE datname='valuta' AND backend_type='client backend'" 2>/dev/null)"
            echo "ebből aktív (nem idle)             : $(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM pg_stat_activity WHERE datname='valuta' AND state='active'" 2>/dev/null)"
            echo "legutóbbi query a lokális valuta-n  : $(sudo -u postgres psql -d valuta -tAc "SELECT max(query_start) FROM pg_stat_activity WHERE datname='valuta'" 2>/dev/null)"
            echo "kliens app-ok a lokális valuta-n   :"
            sudo -u postgres psql -d valuta -tAc "SELECT DISTINCT application_name||' ('||client_addr||')' FROM pg_stat_activity WHERE datname='valuta' AND backend_type='client backend'" 2>/dev/null || echo "  (nincs)"
            echo "--- @Primary datasource (bounded Hikari log) ---"
            journalctl -u valuta-backend.service -n 3000 --no-pager 2>/dev/null | grep -iE 'HikariPool|jdbcUrl|Database:' | grep -oE 'HikariPool-[0-9]+|jdbc:postgresql://[^ "}]+' | sed -E 's#//[^@/]*@#//***@#' | sort -u | head -10 || echo "(nincs Hikari log-sor)"
            echo "--- actuator: melyik DB-t kezeli a Flyway + health DB-komponens (no-auth próba) ---"
            for AEP in "/actuator/flyway" "/actuator/health" "/actuator/health/db" "/actuator/configprops"; do
              CODE=$(curl -s -o /tmp/act.json -w "%{http_code}" --max-time 8 "http://localhost:8080$AEP" 2>/dev/null || echo 000)
              echo "GET $AEP -> HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                grep -oE '(neon\.tech|localhost:6432|127\.0\.0\.1:5432|"version":"32[0-9]"|jdbc:postgresql://[^"]+)' /tmp/act.json 2>/dev/null | sed -E 's#//[^@/]*@#//***@#' | sort -u | head -10
              fi
            done
            echo "--- a backend melyik DB-ben látja a RUB-ot aktívként? közvetlen mindkét oldal ---"
            echo "LOKÁLIS valuta RUB.is_active : $(sudo -u postgres psql -d valuta -tAc "SELECT is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo ""
            echo "=== B2-BACKUP átállítás felderítés (read-only, host maszkolva) ==="
            echo "--- Neon-kapcsolati string a .env-ben? (jelszó+host maszkolva) ---"
            grep -E '^(NEON_DATABASE_URL|SPRING_DATASOURCE_URL|DATABASE_URL)=' /opt/valutavalto/backend/.env 2>/dev/null | sed -E 's#//[^@/]*@#//***@#' || echo "(nincs ilyen sor)"
            echo "--- jelenlegi B2-backup script pg_dump sora ---"
            grep -nE 'pg_dump' /usr/local/bin/valuta-db-backup.sh 2>/dev/null || echo "(nincs /usr/local/bin/valuta-db-backup.sh)"
            echo "--- valuta-backup.timer állapota ---"
            systemctl is-active valuta-backup.timer 2>/dev/null || echo "  timer inactive/nincs"
          ENDSSH

      - name: 'Scaleway STANDBY — DB + watchdog failover-log (read-only)'
        if: always()
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -o pipefail
            echo "=== SCALEWAY STANDBY ($(hostname)) ==="
            echo "pg_is_in_recovery : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)  (t=standby, f=PROMOTED primary!)"
            echo "max migráció      : V$(sudo -u postgres psql -d valuta -tAc "SELECT max(version::int) FROM flyway_schema_history WHERE version ~ '^[0-9]+\$'" 2>/dev/null)"
            echo "RUB.is_active     : $(sudo -u postgres psql -d valuta -tAc "SELECT is_active FROM currency WHERE code='RUB'" 2>/dev/null)"
            echo "last WAL replay   : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_last_wal_replay_lsn()" 2>/dev/null)"
            echo "last replay ts    : $(sudo -u postgres psql -d valuta -tAc "SELECT pg_last_xact_replay_timestamp()" 2>/dev/null)"
            echo "postmaster start  : $(sudo -u postgres psql -tAc "SELECT pg_postmaster_start_time()" 2>/dev/null)"
            echo ""
            echo "--- postgres log: MIÉRT állt le a replikáció 2026-06-14 15:00 körül ---"
            (sudo journalctl -u postgresql@16-main --since '2026-06-14 14:55' --until '2026-06-14 15:15' --no-pager 2>/dev/null; sudo tail -500 /var/log/postgresql/postgresql-16-main.log 2>/dev/null) | grep -iE 'replication|streaming|terminating|timeline|connection|wal receiver|could not|error|FATAL|recovery' | tail -20 || echo "(nincs releváns postgres log-sor)"
            echo ""
            echo "--- primary-watchdog unit állapot ---"
            (systemctl is-active primary-watchdog.timer 2>/dev/null; systemctl is-active primary-watchdog.service 2>/dev/null) | tr '\n' ' '; echo ""
            echo "--- watchdog state file ---"
            cat /var/lib/primary-watchdog/state 2>/dev/null || echo "(nincs state file)"
            echo "--- failover-log (utolsó 25 sor) ---"
            tail -25 /var/log/primary-watchdog-failover.log 2>/dev/null || echo "(nincs failover-log — sosem promote-olt)"
          ENDSSH
