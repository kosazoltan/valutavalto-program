name: Windows Unsigned Release (auto-update delivery)

# ============================================================================
# ALAIRATLAN release a 2 Electron telepitohoz, AMIG a DigiCert EV CS cert nincs kiadva.
#
# MIERT: a kollegak desktop-kliensei a BUNDLE-OLT frontendet futtatjak (app://localhost),
# es CSAK az electron-updater-en at frissulnek (GitHub Releases -> <channel>.yml). Eddig
# nem volt v2.27.x release + a kozponti-nek nem volt publish-configja + a penztar latest.yml-t
# senki sem toltotte fel -> a modositasok SOSEM jutottak el a kliensekbe.
#
# EZ A WORKFLOW: epiti a 2 telepitot ALAIRATLANUL, manualisan generalja a per-app update
# manifestet (penztar.yml + munkaallomas.yml: version + files[url,sha512,size] + path),
# es egyetlen GitHub Release-be tolti fel mindent. A verifyUpdateCodeSignature=false
# (electron-builder.json) miatt az updater elfogadja az alairatlan csomagot; a sha512
# integritas-ellenorzes megmarad.
#
# Cert kiadasa utan: a windows-signed-release.yml az elsodleges (alairt) ut.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzio (uresen -> package.json)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (markdown)'
        required: false
        default: 'Unsigned delivery release (auto-update channel: penztar / munkaallomas).'

permissions:
  contents: read

concurrency:
  group: windows-unsigned-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  preflight:
    name: Preflight — Google secret + verzio
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_date: ${{ steps.resolve.outputs.build_date }}
    steps:
      - shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Resolve version + build date
        id: resolve
        shell: pwsh
        env:
          # Env-en at olvassuk (NEM kozvetlen ${{ }} interpolacio a scriptbe) — shell-injection ellen.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) { $version = (Get-Content package.json | ConvertFrom-Json).version }
          $version = $version.Trim().TrimStart('v')
          # Szigoru semver-validacio: csak a vart formatumot engedjuk (injection + elgepeles ellen).
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Host "::error::Ervenytelen verzio-formatum: '$version' (vart: X.Y.Z)"; exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_date=$(Get-Date -Format yyyyMMdd)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Verify Google OAuth secrets present (build-installer.ps1 production gate)
        shell: pwsh
        env:
          A: ${{ secrets.GOOGLE_CLIENT_ID != '' }}
          B: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
          C: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID != '' }}
          D: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET != '' }}
        run: |
          $missing = @()
          if ($env:A -ne 'true') { $missing += 'GOOGLE_CLIENT_ID' }
          if ($env:B -ne 'true') { $missing += 'GOOGLE_CLIENT_SECRET' }
          if ($env:C -ne 'true') { $missing += 'GOOGLE_DESKTOP_CLIENT_ID' }
          if ($env:D -ne 'true') { $missing += 'GOOGLE_DESKTOP_CLIENT_SECRET' }
          if ($missing.Count -gt 0) {
            foreach ($s in $missing) { Write-Host "::error::Hianyzo secret: $s" }
            exit 1
          }
          Write-Host "Google OAuth secrets OK (4/4)."

  build-backend:
    name: Build Backend JAR
    runs-on: windows-latest
    needs: preflight
    steps:
      - shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Maven package (skip tests)
        working-directory: backend
        shell: pwsh
        run: ./mvnw -B package -DskipTests --no-transfer-progress
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ needs.preflight.outputs.version }}
          path: backend/target/valuta-backend-*.jar
          if-no-files-found: error
          retention-days: 7

  build-penztar:
    name: Build Penztar (unsigned, custom NSIS)
    runs-on: windows-latest
    needs: [preflight, build-backend]
    timeout-minutes: 60
    steps:
      - shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            penztar-client/package-lock.json
            frontend-react/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --version=3.10
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Construct .env from secrets (Google OAuth production gate)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          @(
            "GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET",
            "GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID",
            "GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
          ) -join "`n" | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar-${{ needs.preflight.outputs.version }}
          path: backend/target/
      - name: Stage backend JAR
        shell: pwsh
        run: |
          $stage = "installer/build/stage/backend"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $jar = Get-ChildItem backend/target/valuta-backend-*.jar |
                 Where-Object { $_.Name -notlike "*sources*" -and $_.Name -notlike "*javadoc*" } |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $jar) { Write-Host "::error::Backend JAR nem talalhato"; exit 1 }
          Copy-Item $jar.FullName "$stage/valuta-backend.jar" -Force
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          Push-Location penztar-client; npm ci --no-audit --no-fund; Pop-Location
          Push-Location frontend-react; npm ci --legacy-peer-deps --no-audit --no-fund; Pop-Location
      - name: Build Penztar installer (UNSIGNED) + Eltavolito
        shell: pwsh
        env:
          ALLOW_UNSIGNED_BUILD: '1'
        run: |
          Push-Location installer
          ./build-installer.ps1 -SkipBackendBuild
          ./build-cleanup.ps1
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: penztar-unsigned-${{ needs.preflight.outputs.version }}
          path: |
            installer/build/Penztar-Setup-*.exe
            installer/build/Penztar-Eltavolito-*.exe
          if-no-files-found: error
          retention-days: 7

  build-kozponti:
    name: Build Kozponti Munkaallomas (unsigned)
    runs-on: windows-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            kozponti-client/package-lock.json
            frontend-react/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          Push-Location kozponti-client; npm ci --no-audit --no-fund; Pop-Location
          Push-Location frontend-react; npm ci --legacy-peer-deps --no-audit --no-fund; Pop-Location
      # KRITIKUS FIX (login-blokkoló): a kozponti electron a Google DESKTOP OAuth client ID-t a
      # kozponti-client/vite.config.ts loadEnv(repoRoot)-jából kapja (-> process.env.GOOGLE_DESKTOP_CLIENT_ID
      # inline). E lépés nélkül a bundle desktop-OAuth NÉLKÜL épült -> "Google Desktop OAuth client nincs
      # konfigurálva". A bundle-ölt frontend WEB login-gombja a frontend-react/.env.production VITE_GOOGLE_CLIENT_ID-t kéri.
      - name: Construct Google OAuth env (.env + frontend-react/.env.production)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          @(
            "GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET",
            "GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID",
            "GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
          ) -join "`n" | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
          $tpl = Get-Content "frontend-react/.env.production.example" -Raw
          $tpl = $tpl.Replace('<<__GOOGLE_WEB_CLIENT_ID__>>', $env:GOOGLE_CLIENT_ID)
          $tpl = $tpl.Replace('<<__GOOGLE_DESKTOP_CLIENT_ID__>>', $env:GOOGLE_DESKTOP_CLIENT_ID)
          $tpl = $tpl.Replace('<<__GOOGLE_DESKTOP_CLIENT_SECRET__>>', $env:GOOGLE_DESKTOP_CLIENT_SECRET)
          $tpl | Out-File -FilePath "frontend-react/.env.production" -Encoding utf8 -NoNewline
          Write-Host "Google OAuth env kész (.env + frontend-react/.env.production)."
      - name: Build Kozponti installer (UNSIGNED)
        working-directory: kozponti-client
        shell: pwsh
        env:
          ALLOW_UNSIGNED_BUILD: '1'
        # --publish never: csak BUILD (a publish config miatt az electron-builder kulonben
        # GH_TOKEN-t keresne es elbukna). A release-feltoltest a publish-release job vegzi.
        run: npm run package:unsigned -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kozponti-unsigned-${{ needs.preflight.outputs.version }}
          path: kozponti-client/release/Kozponti-Munkaallomas-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release + update manifests
    runs-on: windows-latest
    needs: [preflight, build-penztar, build-kozponti]
    # A top-level permissions read-only; CSAK ennek a job-nak adunk irast a Release-hez.
    permissions:
      contents: write
    steps:
      - shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
      - name: Collect installers + generate per-app update manifests + SHA-256
        id: manifests
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          $flat = "release-flat"
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          Get-ChildItem release-artifacts -Recurse -Include "*.exe","*.jar" | ForEach-Object {
            Copy-Item $_.FullName -Destination $flat -Force
          }

          # --- per-app electron-updater manifest generalas (NO blockmap -> full download) ---
          function New-UpdateManifest($exePath, $ymlName) {
            $bytes = [System.IO.File]::ReadAllBytes($exePath)
            $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
            $name = Split-Path $exePath -Leaf
            $size = (Get-Item $exePath).Length
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            # Array-join (NEM here-string), hogy a YAML run-blokk indentacioja ne toresen el;
            # a string-tartalom adja az electron-updater manifest 0-oszlopos kulcsait.
            $yml = @(
              "version: $version",
              "files:",
              "  - url: $name",
              "    sha512: $sha512",
              "    size: $size",
              "path: $name",
              "sha512: $sha512",
              "releaseDate: '$date'"
            ) -join "`n"
            $target = Join-Path $flat $ymlName
            [System.IO.File]::WriteAllText($target, $yml, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Manifest: $ymlName -> $name ($size byte)"
          }

          $penztar = Get-ChildItem "$flat/Penztar-Setup-*.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          $kozponti = Get-ChildItem "$flat/Kozponti-Munkaallomas-Setup-*.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $penztar) { Write-Host "::error::Penztar-Setup exe hianyzik"; exit 1 }
          if (-not $kozponti) { Write-Host "::error::Kozponti-Munkaallomas-Setup exe hianyzik"; exit 1 }
          New-UpdateManifest $penztar.FullName "penztar.yml"
          New-UpdateManifest $kozponti.FullName "munkaallomas.yml"

          # SHA-256 manifest (emberi ellenorzeshez)
          # FIX (v2.27.100 lelet): a `Get-ChildItem $flat -Include "*.exe"` -Recurse/path-wildcard
          # NELKUL ures halmazt ad (az -Include a path-elemre, azaz a MAPPARA illeszkedik) →
          # a fajlba csak a fejlec-sor irodott. Path-wildcarddal + .jar-ral javitva, es
          # regresszio-orrel: ures manifest eseten a step BUKIK, nem publikal hibas fajlt.
          $shaFile = "$flat/windows-unsigned-release-sha256.txt"
          "# Valutavalto v$version UNSIGNED release SHA-256 — Git SHA: ${{ github.sha }}" | Out-File $shaFile
          $shaTargets = @(Get-ChildItem "$flat/*" -Include "*.exe","*.jar" -File | Sort-Object Name)
          if ($shaTargets.Count -lt 3) {
            throw "SHA-256 manifest: csak $($shaTargets.Count) artifact talalhato a $flat alatt (minimum 3 vart: 2 telepito + eltavolito) — a glob ujra elromlott?"
          }
          foreach ($f in $shaTargets) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)" | Out-File $shaFile -Append
          }
      - name: Create GitHub Release (unsigned)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3 (supply-chain: full SHA pin)
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: 'v${{ needs.preflight.outputs.version }} — Unsigned delivery release'
          body: |
            ${{ github.event.inputs.release_notes }}

            ## Telepitok (ALAIRATLAN — DigiCert EV CS cert kiadasaig)
            - `Penztar-Setup-${{ needs.preflight.outputs.version }}-*.exe` — penztar + ertektar kliens
            - `Penztar-Eltavolito-*.exe` — eltavolito
            - `Kozponti-Munkaallomas-Setup-${{ needs.preflight.outputs.version }}.exe` — kozponti (full) + arfolyamkeszito (rate-maker), inditaskori mod-valasztoval

            ## Auto-update manifestek
            - `penztar.yml` (channel: penztar) — a Penztar kliens innen frissul
            - `munkaallomas.yml` (channel: munkaallomas) — a Kozponti Munkaallomas innen frissul

            > Elso telepites kezi (a SmartScreen-figyelmeztetesnel: "Tovabbi informaciok" -> "Futtatas mindenkepp"),
            > utana az auto-update automatikus. Az alairatlan csomagot a verifyUpdateCodeSignature=false engedi;
            > a sha512 integritas-ellenorzes megmarad.

            Git SHA: ${{ github.sha }}
          files: |
            release-flat/*.exe
            release-flat/penztar.yml
            release-flat/munkaallomas.yml
            release-flat/*.jar
            release-flat/windows-unsigned-release-sha256.txt
          draft: false
          prerelease: false
