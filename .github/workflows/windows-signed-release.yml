name: Windows Signed Release (v2.x)

# Production-grade signed installer build a Valutavalto Penztar Rendszerhez.
#
# Eredmenyek (GitHub Release artifact-okkent):
#   - Penztar-Setup-<version>-<date>.exe           (NSIS, ~280 MB, kod-alairva)
#   - Penztar-Eltavolito-<version>-<date>.exe      (NSIS uninstaller, ~60 KB)
#   - Kozponti-Munkaallomas-Setup-<version>.exe    (~100 MB, kod-alairva;
#     tartalmazza az arfolyamkeszito/rate-maker modot is)
#   - SHA-256 manifest (windows-signed-release-sha256.txt)
#
# Alairas: Azure Key Vault Premium HSM-en tarolt cert + AzureSignTool (vcsjones).
# A workflow VENDOR-AGNOSTIC — az AzureSignTool a Key Vault-on lévő cert-tel mukodik,
# fuggetlenul attol hogy melyik CA bocsatotta ki (DigiCert, Sectigo, GlobalSign, stb.).
# Csak az env-var-ok kotik a konkret kornyezethez.
#
# Sign hook: penztar-client/scripts/sign-with-azure-keyvault.js (electron-builder signtoolOptions).
# Timestamp: RFC 3161, default `http://timestamp.digicert.com` (env-overide-olhato).
#
# Aktualis cert vendor + folyamat-historia + reszletes audit-status:
#   -> vault/operations/code-signing-setup-path.md
#
# Tooling refs:
#   - https://github.com/vcsjones/azuresigntool

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzio (uresen marad -> package.json-bol olvas)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (markdown, opcionalis)'
        required: false
        default: 'Production signed release.'
      publish_release:
        description: 'GitHub Release-be felluploadolja? (false = csak artifact)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      rollout_percent:
        # A penztar suite-updater staged rolloutja (docs/auto-update-terv-es-vegrehajtas.md 5.6).
        # 0 = KILL-SWITCH: a flotta nem frissul (a manifest felkerul, de egyetlen gep
        # sem fogadja el). Elso eles kor javasolt erteke: 25, majd 24 ora megfigyeles
        # utan 100. A mar kiadott release assetje kesobb kezzel is szerkesztheto.
        description: 'Penztar frissitesi rollout (0-100; 0 = kill-switch, nem frissul a flotta)'
        required: false
        default: '100'

permissions:
  contents: write  # GitHub Release-hez
  id-token: write  # SLSA attestation-hoz (jovoben)

concurrency:
  group: windows-signed-release
  cancel-in-progress: false  # release build SOHA nem cancel-eli onmagat

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  DOTNET_VERSION: '8.0'

jobs:
  preflight:
    name: Preflight — secret + workspace check
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_date: ${{ steps.resolve.outputs.build_date }}
      version_bumped: ${{ steps.version_gate.outputs.bumped }}
      has_signing_secrets: ${{ steps.secrets.outputs.has_signing }}
    steps:
      - name: Enable git longpaths (Windows MAX_PATH workaround)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout (CSAK a kész main-ből épül a release)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build-integritasi kapu (KOTELEZO — Kosa Zoltan direktiva 2026-06-29)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A telepítő CSAK a kész, legfrissebb main-ből épülhet. Ha egy javítás
          # child branch-en / nyitott PR-en maradt és nincs main-be merge-elve, a
          # build régi kódból épülne → a javítás "eltűnik" (visszaesés). Ez a kapu
          # ezt CI-szinten kikényszeríti. Részletek: AGENTS.md §3.1.
          set -uo pipefail
          git fetch --prune origin >/dev/null 2>&1 || true
          BLOCK=0; WARN=0

          # 1. a checkout valóban a main HEAD-jén áll (origin/main = HEAD)
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$HEAD_SHA" = "$MAIN_SHA" ]; then
            echo "✓ a build forrása az origin/main HEAD ($HEAD_SHA)"
          else
            echo "::error::A build NEM az origin/main HEAD-jéről indul (HEAD=$HEAD_SHA, origin/main=$MAIN_SHA)."
            BLOCK=1
          fi

          # 2. a workflow-t a main branch-ről indították (workflow_dispatch ref)
          if [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            echo "✓ a workflow a 'main' branch-ről indult"
          else
            echo "::error::A release workflow-t a '${GITHUB_REF_NAME:-?}' ref-ről indították — CSAK 'main'-ről engedélyezett."
            BLOCK=1
          fi

          # 3. tiszta fa (CI-ban triviálisan az, de a szabály explicit)
          if [ -z "$(git status --porcelain)" ]; then
            echo "✓ tiszta working tree"
          else
            echo "::error::A working tree nem tiszta a build előtt."; BLOCK=1
          fi

          # 4. nincs unmerged, main-be szánt FEATURE/FIX branch (dependabot/release külön)
          UNMERGED="$(git branch -r --no-merged origin/main 2>/dev/null | sed 's/^[[:space:]]*//' | grep -v 'origin/main$' || true)"
          FEATURE="$(echo "$UNMERGED" | grep -vE 'origin/(dependabot/|release/|HEAD)' | grep -v '^$' || true)"
          if [ -n "$FEATURE" ]; then
            echo "::warning::FELADAT/FIX branch-ek NINCSENEK main-ben — ellenőrizd, hogy egy aktuális javítás sem maradt ki:"
            echo "$FEATURE" | sed 's/^/  - /'
            WARN=1
          else
            echo "✓ nincs unmerged feature/fix branch"
          fi

          # 5. nincs nyitott PR a main ellen (gh elérhető a runneren)
          if command -v gh >/dev/null 2>&1; then
            OPEN_PRS="$(gh pr list --state open --base main --json number,title --jq '.[] | "#\(.number) \(.title)"' 2>/dev/null || true)"
            if [ -n "$OPEN_PRS" ]; then
              echo "::warning::NYITOTT PR(ek) a main ellen — tartalmazhatnak buildbe szánt javítást:"
              echo "$OPEN_PRS" | sed 's/^/  - /'
              WARN=1
            else
              echo "✓ nincs nyitott PR a main ellen"
            fi
          fi

          echo ""
          if [ "$BLOCK" = "1" ]; then
            echo "::error::BUILD-INTEGRITÁS BLOKKOL — a release nem a kész main-ből épülne. Lásd AGENTS.md §3.1."
            exit 1
          fi
          if [ "$WARN" = "1" ]; then
            echo "::warning::Build-integritás: FELTÉTELES — main tiszta és szinkronban, de van nyitott ág/PR. Erősítsd meg, hogy nem maradt ki javítás."
          fi
          echo "Build-integritási kapu: OK — a release a kész main HEAD-ről ($HEAD_SHA) épül."

      - name: Version bump gate (AUTO-PATCH — duplikált release verzió tiltás)
        id: version_gate
        if: github.event.inputs.version == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoLogo -NoProfile -File installer/scripts/ci-version-bump-gate.ps1

      # Explicit verzio-input eseten a kaput NEM kerulhetjuk meg: a publish job
      # akkor is letrehozza/frissiti a v<input> taget, tehat pontosan az a
      # duplikalt-verzio ut maradna nyitva, amit ez a valtozas be akar zarni.
      # Ezert az explicit verziot a publikalt release-baseline ellen validaljuk.
      - name: Validate explicit version input against published releases
        if: github.event.inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:INPUT_VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Ervenytelen version input '$v' (X.Y.Z kell)."
            exit 1
          }
          . ./installer/build-common.ps1
          $lookup = Get-LatestPublishedReleaseVersion
          if ($lookup -and $lookup.PSObject.Properties.Name -contains 'LookupFailed') {
            Write-Host "::error::Release baseline lekerdezes elbukott: $($lookup.Reason) — fail-closed."
            exit 1
          }
          if (-not $lookup) {
            Write-Host "Nincs publikalt release baseline — az explicit v$v elfogadva."
            exit 0
          }
          $baseline = [version]::Parse($lookup.Version)
          if ([version]::Parse($v).CompareTo($baseline) -le 0) {
            Write-Host "::error::A megadott verzio ($v) NEM nagyobb a legutobbi kiadott release-nel ($($lookup.TagName)). Az auto-update semver-t nez: azonos vagy kisebb verzio eseten a flotta NEM frissul."
            exit 1
          }
          Write-Host "Explicit verzio OK: v$v > $($lookup.TagName)"

      - name: Resolve version + build date
        id: resolve
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $pkg = Get-Content package.json | ConvertFrom-Json
            $version = $pkg.version
          }
          $buildDate = Get-Date -Format "yyyyMMdd"
          Write-Host "version=$version, build_date=$buildDate"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_date=$buildDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify signing + production secrets present
        id: secrets
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI_PRESENT: ${{ secrets.AZURE_KEY_VAULT_URI != '' }}
          AZURE_KEY_VAULT_CERT_NAME_PRESENT: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME != '' }}
          AZURE_TENANT_ID_PRESENT: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_CLIENT_ID_PRESENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_CLIENT_SECRET_PRESENT: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          GOOGLE_CLIENT_ID_PRESENT: ${{ secrets.GOOGLE_CLIENT_ID != '' }}
          GOOGLE_CLIENT_SECRET_PRESENT: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
          GOOGLE_DESKTOP_CLIENT_ID_PRESENT: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID != '' }}
          GOOGLE_DESKTOP_CLIENT_SECRET_PRESENT: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET != '' }}
        run: |
          # 9 secret-et ellenorzunk:
          #   5 Azure Key Vault (signing): URI, CERT_NAME, TENANT_ID, CLIENT_ID, CLIENT_SECRET
          #   4 Google OAuth (build-installer.ps1 production secret gate): WEB + DESKTOP client + secret
          # Hianyzo secret early-exit -> NEM teszti a felhasznalo a 30 perces build-et fail-elni.
          $missing = @()
          if ($env:AZURE_KEY_VAULT_URI_PRESENT -ne 'true') { $missing += 'AZURE_KEY_VAULT_URI' }
          if ($env:AZURE_KEY_VAULT_CERT_NAME_PRESENT -ne 'true') { $missing += 'AZURE_KEY_VAULT_CERT_NAME' }
          if ($env:AZURE_TENANT_ID_PRESENT -ne 'true') { $missing += 'AZURE_TENANT_ID' }
          if ($env:AZURE_CLIENT_ID_PRESENT -ne 'true') { $missing += 'AZURE_CLIENT_ID' }
          if ($env:AZURE_CLIENT_SECRET_PRESENT -ne 'true') { $missing += 'AZURE_CLIENT_SECRET' }
          if ($env:GOOGLE_CLIENT_ID_PRESENT -ne 'true') { $missing += 'GOOGLE_CLIENT_ID' }
          if ($env:GOOGLE_CLIENT_SECRET_PRESENT -ne 'true') { $missing += 'GOOGLE_CLIENT_SECRET' }
          if ($env:GOOGLE_DESKTOP_CLIENT_ID_PRESENT -ne 'true') { $missing += 'GOOGLE_DESKTOP_CLIENT_ID' }
          if ($env:GOOGLE_DESKTOP_CLIENT_SECRET_PRESENT -ne 'true') { $missing += 'GOOGLE_DESKTOP_CLIENT_SECRET' }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Hianyzo GitHub Secret(ek) ($($missing.Count) db). Beallitando: Settings > Secrets > Actions:"
            foreach ($s in $missing) { Write-Host "::error::  - $s" }
            Write-Host "::error::Reszletek: vault/operations/code-signing-setup-path.md"
            "has_signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 1
          }
          Write-Host "All 9 required secrets present (Azure Key Vault 5 + Google OAuth 4)."
          "has_signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-backend:
    name: Build Backend JAR (Maven)
    runs-on: windows-latest
    needs: preflight
    outputs:
      jar_name: ${{ steps.mvn.outputs.jar_name }}
    steps:
      - name: Enable git longpaths (Windows MAX_PATH workaround)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Version bump gate (AUTO-PATCH)
        if: github.event.inputs.version == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -File installer/scripts/ci-version-bump-gate.ps1

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven package (skip tests — separate CI runs them)
        id: mvn
        working-directory: backend
        shell: pwsh
        run: |
          ./mvnw -B package -DskipTests --no-transfer-progress
          $jar = Get-ChildItem target/valuta-backend-*.jar | Where-Object { $_.Name -notlike "*SNAPSHOT*" } | Select-Object -Last 1
          Write-Host "Built: $($jar.FullName) ($($jar.Length) bytes)"
          "jar_name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar-${{ needs.preflight.outputs.version }}
          path: backend/target/valuta-backend-*.jar
          if-no-files-found: error
          retention-days: 14

  build-penztar:
    name: Build Penztar Installer (NSIS + signed Electron via Azure Key Vault)
    runs-on: windows-latest
    needs: [preflight, build-backend]
    timeout-minutes: 60
    steps:
      - name: Enable git longpaths (Windows MAX_PATH workaround)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Version bump gate (AUTO-PATCH)
        if: github.event.inputs.version == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -File installer/scripts/ci-version-bump-gate.ps1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            penztar-client/package-lock.json
            frontend-react/package-lock.json

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install AzureSignTool (vcsjones)
        shell: pwsh
        run: |
          # AzureSignTool: dotnet global tool, Azure Key Vault Premium HSM signing-hez.
          # https://github.com/vcsjones/azuresigntool
          dotnet tool install --global AzureSignTool
          # Verifikacio
          azuresigntool --version

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --version=3.10
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Construct .env from GitHub Secrets (production secret gate)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          # build-installer.ps1 production secret gate .env file-bol olvas:
          # GOOGLE_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_SECRET.
          # Hianyzo .env -> throw 'PRODUCTION SECRET GATE'.
          # CI-en a .env file-t a GitHub Secrets-bol szerkesztjuk ossze.
          $envContent = @(
            "GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET",
            "GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID",
            "GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
          ) -join "`n"
          $envContent | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
          Write-Host ".env constructed from secrets (values not logged)"

      - name: Download backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar-${{ needs.preflight.outputs.version }}
          path: backend/target/

      - name: Stage backend JAR (manualisan, mert build-installer.ps1 -SkipBackendBuild)
        shell: pwsh
        run: |
          $stageBackend = "installer/build/stage/backend"
          New-Item -ItemType Directory -Force -Path $stageBackend | Out-Null
          $jar = Get-ChildItem backend/target/valuta-backend-*.jar |
                 Where-Object { $_.Name -notlike "*sources*" -and $_.Name -notlike "*javadoc*" } |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $jar) {
            Write-Host "::error::Backend JAR nem talalhato"
            exit 1
          }
          Copy-Item -Path $jar.FullName -Destination "$stageBackend/valuta-backend.jar" -Force
          Write-Host "Backend JAR staged: $($jar.Name)"

      - name: Install dependencies (root + penztar-client + frontend-react + shared packages)
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          # PLATFORM-REFAKTOR (2026-08-10): a penztar electron-kod (vv-logger) a
          # megosztott packages/electron-platform retegre epul. A vite a FORRAST
          # bundle-eli, de a csomag sajat dependency-i (electron-log) telepitve
          # kell legyenek, kulonben a build elbukik.
          Push-Location packages/electron-platform
          npm ci --legacy-peer-deps --no-audit --no-fund
          Pop-Location
          Push-Location penztar-client
          npm ci --no-audit --no-fund
          Pop-Location
          Push-Location frontend-react
          npm ci --legacy-peer-deps --no-audit --no-fund
          Pop-Location

      - name: Build Penztar installer (signed via Azure Key Vault)
        shell: pwsh
        env:
          CODE_SIGN_ENABLED: '1'
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Push-Location installer
          ./build-installer.ps1 -SkipBackendBuild
          Pop-Location

      - name: Build Eltavolito (NSIS uninstaller — alairas a kovetkezo lepesben)
        shell: pwsh
        run: |
          Push-Location installer
          ./build-cleanup.ps1
          Pop-Location

      # A build-installer.ps1 csak a BELSO Electron exe-t iratja ala (electron-builder
      # signtoolOptions hook). A VEGSO NSIS-kimeneteket KULON kell alairni — ugyanazzal a hookkal
      # (DRY: azonos cert/timestamp/digest, mint a belso exe):
      #   - Penztar-Setup-*.exe       (telepito)
      #   - Penztar-Eltavolito-*.exe  (standalone NSIS uninstaller) — kulonben SmartScreen-figyelmeztetes,
      #                               ha vegfelhasznalohoz juttatjuk a standalone eltavolitot.
      - name: Sign final Penztar NSIS installers (Setup + Eltavolito, Azure Key Vault)
        shell: pwsh
        env:
          CODE_SIGN_ENABLED: '1'
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $setup = Get-ChildItem installer/build/Penztar-Setup-*.exe |
                   Sort-Object LastWriteTime | Select-Object -Last 1
          $cleanup = Get-ChildItem installer/build/Penztar-Eltavolito-*.exe |
                     Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $setup) {
            Write-Host "::error::Penztar-Setup exe nem talalhato az alairashoz"
            exit 1
          }
          if (-not $cleanup) {
            Write-Host "::error::Penztar-Eltavolito exe nem talalhato az alairashoz"
            exit 1
          }
          foreach ($exe in @($setup, $cleanup)) {
            Write-Host "Signing final NSIS exe: $($exe.FullName)"
            node -e "require('./penztar-client/scripts/sign-with-azure-keyvault.js').default({path: process.argv[1]}).then(() => process.exit(0)).catch(e => { console.error(e.message); process.exit(1) })" "$($exe.FullName)"
            # PowerShell NEM all le automatikusan natív parancs non-zero exit kódjára (Copilot review):
            # explicit fail-fast, kulonben egy bukott alairas utan a kovetkezo sikeres alairas
            # 0-val zarna a lepest (alairatlan EXE szallitasaval).
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Alairas sikertelen: $($exe.Name) (exit $LASTEXITCODE)"
              exit 1
            }
          }

      - name: Verify Penztar installer signatures (Setup + Eltavolito)
        shell: pwsh
        run: |
          $exes = @(
            (Get-ChildItem installer/build/Penztar-Setup-*.exe | Sort-Object LastWriteTime | Select-Object -Last 1),
            (Get-ChildItem installer/build/Penztar-Eltavolito-*.exe | Sort-Object LastWriteTime | Select-Object -Last 1)
          )
          foreach ($exe in $exes) {
            if (-not $exe) {
              Write-Host "::error::Egy Penztar NSIS exe nem talalhato a verifikaciohoz"
              exit 1
            }
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): Status=$($sig.Status), Signer=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($exe.Name) NEM valid alairas — Status=$($sig.Status)"
              exit 1
            }
          }

      - name: Upload Penztar artifacts
        uses: actions/upload-artifact@v7
        with:
          name: penztar-signed-${{ needs.preflight.outputs.version }}
          path: |
            installer/build/Penztar-Setup-*.exe
            installer/build/Penztar-Eltavolito-*.exe
          if-no-files-found: error
          retention-days: 14

  build-kozponti:
    name: Build Kozponti Iranyitokozpont (signed via Azure Key Vault)
    runs-on: windows-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Enable git longpaths (Windows MAX_PATH workaround)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Version bump gate (AUTO-PATCH)
        if: github.event.inputs.version == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -File installer/scripts/ci-version-bump-gate.ps1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            kozponti-client/package-lock.json
            frontend-react/package-lock.json

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install AzureSignTool
        shell: pwsh
        run: dotnet tool install --global AzureSignTool

      - name: Install dependencies (kozponti + frontend-react + shared packages)
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          # PLATFORM-REFAKTOR (2026-08-10): a kozponti electron-kod megosztott
          # csomagokra epul (packages/electron-platform, packages/local-first-core).
          # A vite a FORRAST bundle-eli, de a csomagok sajat dependency-i
          # (pl. electron-log) telepitve kell legyenek, kulonben a build elbukik.
          Push-Location packages/local-first-core
          npm ci --legacy-peer-deps --no-audit --no-fund
          Pop-Location
          Push-Location packages/electron-platform
          npm ci --legacy-peer-deps --no-audit --no-fund
          Pop-Location
          Push-Location kozponti-client
          npm ci --no-audit --no-fund
          Pop-Location
          Push-Location frontend-react
          npm ci --legacy-peer-deps --no-audit --no-fund
          Pop-Location

      # KRITIKUS (login-blokkolo): a kozponti electron a Google DESKTOP OAuth client ID-t a
      # kozponti-client/vite.config.ts loadEnv(repoRoot)-jabol kapja, a bundle-olt WEB login-gomb
      # pedig a frontend-react/.env.production VITE_GOOGLE_CLIENT_ID-t. E lepes nelkul a kozponti
      # Google login NEM mukodik. (Azonos env-felepites kell a kozponti signed buildben.)
      - name: Construct Google OAuth env (.env + frontend-react/.env.production)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          @(
            "GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET",
            "GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID",
            "GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
          ) -join "`n" | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
          $tpl = Get-Content "frontend-react/.env.production.example" -Raw
          $tpl = $tpl.Replace('<<__GOOGLE_WEB_CLIENT_ID__>>', $env:GOOGLE_CLIENT_ID)
          $tpl = $tpl.Replace('<<__GOOGLE_DESKTOP_CLIENT_ID__>>', $env:GOOGLE_DESKTOP_CLIENT_ID)
          $tpl = $tpl.Replace('<<__GOOGLE_DESKTOP_CLIENT_SECRET__>>', $env:GOOGLE_DESKTOP_CLIENT_SECRET)
          $tpl | Out-File -FilePath "frontend-react/.env.production" -Encoding utf8 -NoNewline
          Write-Host "Google OAuth env kesz (.env + frontend-react/.env.production)."

      - name: Build Kozponti installer (signed via Azure Key Vault)
        shell: pwsh
        env:
          CODE_SIGN_ENABLED: '1'
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # --publish never: csak BUILD+SIGN (a publish config miatt az electron-builder kulonben
        # GH_TOKEN-t keresne es elbukna). A release-feltoltest a publish-release job vegzi.
        working-directory: kozponti-client
        run: npm run package -- --publish never

      - name: Verify Kozponti signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem kozponti-client/release/Kozponti-Munkaallomas-Setup-*.exe |
                       Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $installer) {
            Write-Host "::error::Kozponti installer nem talalhato"
            exit 1
          }
          Write-Host "Verifying: $($installer.FullName)"
          $sig = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Kozponti installer NEM valid alairas — Status=$($sig.Status)"
            exit 1
          }

      - name: Verify Kozponti update manifest (munkaallomas.yml <-> signed exe hash)
        shell: pwsh
        # MIERT KELL: az electron-updater a `munkaallomas.yml`-ben kozolt sha512 alapjan
        # fogadja el a letoltott telepitot. A yml-t az electron-builder a csomagolas
        # vegen, a MAR ALAIRT exe-rol generalja (a signtool-hook a csomagolas kozben fut),
        # tehat a ket fajlnak egyutt kell utaznia es az exe-t a yml generalasa UTAN mar
        # nem szabad felulirni. Ez a lepes ezt gepileg bizonyitja: eltero hash eseten a
        # release NEM keszul el, mert a flotta amugy is elutasitana a frissitest
        # ("checksum mismatch"), csak eppen a hibat a telepitett gepeken latnank meg.
        run: |
          $yml = "kozponti-client/release/munkaallomas.yml"
          if (-not (Test-Path $yml)) {
            Write-Host "::error::munkaallomas.yml nem keszult el — az electron-updater feed nelkul a kozponti kliens NEM tud frissulni."
            exit 1
          }
          Write-Host "=== munkaallomas.yml ==="
          Get-Content $yml
          $ymlText = Get-Content $yml -Raw
          # A `path:` a telepito fajlnevet, a `sha512:` a base64-kodolt SHA-512-t adja.
          $pathMatch = [regex]::Match($ymlText, '(?m)^\s*path:\s*(.+?)\s*$')
          $shaMatch  = [regex]::Match($ymlText, '(?m)^\s*sha512:\s*(.+?)\s*$')
          if (-not $pathMatch.Success -or -not $shaMatch.Success) {
            Write-Host "::error::munkaallomas.yml-bol nem olvashato ki a path/sha512 — ertelmezhetetlen manifest."
            exit 1
          }
          $exeName = $pathMatch.Groups[1].Value.Trim("'", '"')
          $expected = $shaMatch.Groups[1].Value
          $exePath = Join-Path "kozponti-client/release" $exeName
          if (-not (Test-Path $exePath)) {
            Write-Host "::error::A manifestben hivatkozott telepito nem talalhato: $exeName"
            exit 1
          }
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead((Resolve-Path $exePath))
          try { $actual = [Convert]::ToBase64String($sha512.ComputeHash($stream)) }
          finally { $stream.Dispose(); $sha512.Dispose() }
          Write-Host "manifest sha512: $expected"
          Write-Host "actual   sha512: $actual"
          if ($actual -ne $expected) {
            Write-Host "::error::munkaallomas.yml sha512 NEM egyezik az alairt exe hash-evel — a flotta elutasitana a frissitest."
            exit 1
          }
          Write-Host "Update manifest hash OK — az electron-updater feed konzisztens az alairt telepitovel."

      - name: Upload Kozponti artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kozponti-signed-${{ needs.preflight.outputs.version }}
          # A `.blockmap` (delta-letoltes) es a `munkaallomas.yml` (electron-updater feed)
          # nelkul a kozponti kliens onfrissitese NEM mukodik — v2.28.78-ig ezek
          # legeneralodtak a release/ ala, de sosem kerultek fel a release-be.
          path: |
            kozponti-client/release/Kozponti-Munkaallomas-Setup-*.exe
            kozponti-client/release/Kozponti-Munkaallomas-Setup-*.exe.blockmap
            kozponti-client/release/munkaallomas.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release + SHA-256 manifest
    runs-on: windows-latest
    needs: [preflight, build-penztar, build-kozponti]
    if: github.event.inputs.publish_release == 'true'
    steps:
      - name: Enable git longpaths (Windows MAX_PATH workaround)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts/

      - name: Flatten artifacts + generate SHA-256 manifest
        shell: pwsh
        run: |
          $flatDir = "release-flat"
          New-Item -ItemType Directory -Force -Path $flatDir | Out-Null
          Get-ChildItem release-artifacts -Recurse -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination $flatDir -Force
          }
          Get-ChildItem release-artifacts -Recurse -Filter "*.jar" | ForEach-Object {
            Copy-Item $_.FullName -Destination $flatDir -Force
          }
          # Auto-update assetek (electron-updater feed a KOZPONTI kliensnek):
          # a .blockmap adja a delta-letoltest, a munkaallomas.yml a feed-manifest.
          Get-ChildItem release-artifacts -Recurse -Filter "*.exe.blockmap" | ForEach-Object {
            Copy-Item $_.FullName -Destination $flatDir -Force
          }
          Get-ChildItem release-artifacts -Recurse -Filter "munkaallomas.yml" | ForEach-Object {
            Copy-Item $_.FullName -Destination $flatDir -Force
          }
          # BIZTONSAGI KAPU (docs/auto-update-terv-es-vegrehajtas.md 3.2 + 7. szakasz):
          # `penztar.yml` / `latest.yml` NEM kerulhet a release-be. A mar kint levo
          # penztar-telepitesek `app-update.yml`-je a `penztar` channelt keresi; ha
          # kapnanak feedet, az electron-updater a sajat GUID-alapu registry-kulcsa
          # szerint egy MASODIK, parhuzamos telepitest hozna letre, miközben a suite
          # (backend JAR, JRE, PostgreSQL, NSSM service-ek) a regi helyen, regi
          # verzion maradna -> kliens/lokalis-backend verzio-szetcsuszas.
          # A penztar frissitese a teljes suite-telepitovel tortenik (2. fazis).
          $forbidden = Get-ChildItem $flatDir -File |
                       Where-Object { $_.Name -in 'penztar.yml', 'latest.yml' }
          if ($forbidden) {
            Write-Host "::error::TILOS update-manifest a release-ben: $($forbidden.Name -join ', ') — a regi penztar-flotta duplikalt telepitest kapna (3.2 szakasz)."
            exit 1
          }
          $manifest = "$flatDir/windows-signed-release-sha256.txt"
          "# Valutavalto v${{ needs.preflight.outputs.version }} signed release SHA-256" | Out-File $manifest
          "# Build date: ${{ needs.preflight.outputs.build_date }}" | Out-File $manifest -Append
          "# Git SHA: ${{ github.sha }}" | Out-File $manifest -Append
          "# Signing: DigiCert EV CS via Azure Key Vault Premium HSM (AzureSignTool)" | Out-File $manifest -Append
          "" | Out-File $manifest -Append
          # FIX: a -Include -Recurse/záró \* nélkül csendben üres listát ad (PowerShell-gotcha),
          # ezért korábban a manifeszt csak a fejlécet tartalmazta hash-sorok nélkül. Extension-szűrés.
          Get-ChildItem $flatDir -File | Where-Object { $_.Extension -in '.exe', '.jar' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "${hash}  $($_.Name)" | Out-File $manifest -Append
          }
          Write-Host "=== Manifest ==="
          Get-Content $manifest

          # === update-manifest.json (suite-updater feed a PENZTAR kliensnek) ===
          # A penztar frissitesi egysege a TELJES suite-telepito, ezert nem
          # electron-updater feedet kap, hanem sajat manifestet (3.4 szakasz).
          # A hash NEM ujraszamolt: a fent generalt SHA-256 manifest soraibol jon,
          # igy egyetlen igazsagforras van — ha a ketto elcsuszna, a kliens
          # elutasitana a telepitot es a hibat csak a flottan latnank meg.
          $penztarExe = Get-ChildItem $flatDir -File |
                        Where-Object { $_.Name -like 'Penztar-Setup-*.exe' } |
                        Sort-Object Name | Select-Object -Last 1
          if (-not $penztarExe) {
            Write-Host "::error::Penztar-Setup-*.exe nem talalhato a release-assetek kozott — update-manifest.json nem generalhato."
            exit 1
          }
          $manifestLines = Get-Content $manifest
          $hashLine = $manifestLines | Where-Object { $_ -match "\s$([regex]::Escape($penztarExe.Name))$" } | Select-Object -First 1
          if (-not $hashLine) {
            Write-Host "::error::A SHA-256 manifestben nincs sor a(z) $($penztarExe.Name) fajlhoz."
            exit 1
          }
          $penztarHash = ($hashLine -split '\s+')[0]
          if ($penztarHash -notmatch '^[0-9a-f]{64}$') {
            Write-Host "::error::Ervenytelen SHA-256 a manifest sorban: $hashLine"
            exit 1
          }
          $rollout = '${{ github.event.inputs.rollout_percent }}'
          if ([string]::IsNullOrWhiteSpace($rollout)) { $rollout = '100' }
          $rolloutInt = 0
          if (-not [int]::TryParse($rollout, [ref]$rolloutInt) -or $rolloutInt -lt 0 -or $rolloutInt -gt 100) {
            Write-Host "::error::rollout_percent erteke 0-100 kozotti egesz szam legyen (kapott: '$rollout')."
            exit 1
          }
          $tag = "v${{ needs.preflight.outputs.version }}"
          $updateManifest = [ordered]@{
            schemaVersion  = 1
            version        = '${{ needs.preflight.outputs.version }}'
            releasedAt     = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            rolloutPercent = $rolloutInt
            mandatory      = $false
            notes          = '${{ github.event.inputs.release_notes }}'
            penztar        = [ordered]@{
              file       = $penztarExe.Name
              url        = "https://github.com/${{ github.repository }}/releases/download/$tag/$($penztarExe.Name)"
              sha256     = $penztarHash
              sizeBytes  = $penztarExe.Length
              silentArgs = @('/S')
            }
          }
          $updateManifestPath = "$flatDir/update-manifest.json"
          $updateManifest | ConvertTo-Json -Depth 5 | Out-File $updateManifestPath -Encoding utf8
          Write-Host "=== update-manifest.json ==="
          Get-Content $updateManifestPath

          Write-Host "=== Release assetek ==="
          Get-ChildItem $flatDir -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: 'v${{ needs.preflight.outputs.version }} — Production signed release'
          body: |
            ${{ github.event.inputs.release_notes }}

            ## Artifacts (mind DigiCert EV CS-szel alairva, Azure Key Vault Premium HSM)

            - `Penztar-Setup-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.build_date }}.exe` — penztaros kliens
            - `Penztar-Eltavolito-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.build_date }}.exe` — uninstaller
            - `Kozponti-Munkaallomas-Setup-${{ needs.preflight.outputs.version }}.exe` — kozponti irodavezetoi munkaallomas (tartalmazza az arfolyamkeszito/rate-maker modot is, inditaskori mod-valasztoval)
            - `munkaallomas.yml` + `.exe.blockmap` — **auto-update feed a kozponti munkaallomashoz** (electron-updater; ne torolje, kulonben a mar telepitett gepek nem talalnak frissitest)

            > A **penztaros kliens** frissitese NEM ezen a feeden tortenik, hanem a teljes
            > suite-telepitovel (backend JAR + JRE + PostgreSQL + NSSM service-ek egyben) —
            > lasd `docs/auto-update-terv-es-vegrehajtas.md` 3.2 es 3.6 szakasz.
            > `penztar.yml`-t TILOS a release-hez adni (duplikalt telepitest okoz a regi flottan).

            ## Verifikalas
            ```powershell
            Get-AuthenticodeSignature .\Penztar-Setup-*.exe
            # Status: Valid
            # SignerCertificate.Subject: CN=EXCLUSIVE BEST Change Zrt., ...
            ```

            SHA-256 hash-ek a `windows-signed-release-sha256.txt`-ben.

            Git SHA: ${{ github.sha }}
          files: |
            release-flat/*.exe
            release-flat/*.exe.blockmap
            release-flat/munkaallomas.yml
            release-flat/update-manifest.json
            release-flat/*.jar
            release-flat/windows-signed-release-sha256.txt
          draft: false
          prerelease: false

  commit-version-bump:
    name: Commit 9-way version bump to main
    runs-on: ubuntu-latest
    needs: [preflight, publish-release]
    if: >-
      success() &&
      github.event.inputs.publish_release == 'true' &&
      needs.preflight.outputs.version_bumped == 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the exact released version (NO gate re-run)
        shell: pwsh
        env:
          TARGET_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # FONTOS: itt NEM futtatjuk ujra a verzio-kaput. Ez a job a
          # publish-release UTAN fut, ekkor a kapu baseline-ja mar az EPP KIADOTT
          # tag lenne, igy meg egy patch-csel tovabb bumpolna (TARGET+1), a lenti
          # ellenorzes elbukna, es a kiadott verzio sosem kerulne be a main-be.
          # Helyette determinisztikusan a preflight altal kiadott verziot irjuk be.
          pwsh -NoLogo -NoProfile -File installer/scripts/apply-release-version.ps1 -TargetVersion $env:TARGET_VERSION

      - name: Commit and push version files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            frontend-react/package.json frontend-react/package-lock.json \
            penztar-client/package.json penztar-client/package-lock.json \
            kozponti-client/package.json kozponti-client/package-lock.json \
            backend/pom.xml
          if git diff --cached --quiet; then
            echo "No version file changes to commit."
            exit 0
          fi
          git commit -m "chore(release): bump to v${{ needs.preflight.outputs.version }} [skip ci]"
          git push origin main

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [preflight, build-penztar, build-kozponti]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Windows Signed Release — v${{ needs.preflight.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build date:** ${{ needs.preflight.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing:** DigiCert EV CS via Azure Key Vault Premium HSM (AzureSignTool)" >> $GITHUB_STEP_SUMMARY
          echo "- **Penztar:** ${{ needs.build-penztar.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kozponti:** ${{ needs.build-kozponti.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** ${{ github.event.inputs.publish_release }}" >> $GITHUB_STEP_SUMMARY
