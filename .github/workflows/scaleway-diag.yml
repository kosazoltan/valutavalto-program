name: Scaleway Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run Diagnostics on Scaleway
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
            root@${{ secrets.SCALEWAY_SERVER_IP }} \
            "echo '=== Disk Space ===' && df -h && \
             echo '=== Memory ===' && free -m && \
             echo '=== Load ===' && uptime && \
             echo '=== PG processes ===' && ps aux | grep -iE 'postgres|postmaster' && \
             echo '=== systemctl PG status ===' && systemctl status postgresql* --no-pager || true"
