name: Scaleway Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run Diagnostics and Cleanup on Scaleway
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
            root@${{ secrets.SCALEWAY_SERVER_IP }} \
            "echo '=== Force killing postgres to break the deadlock ===' && \
             pkill -9 -u postgres || true && \
             pkill -9 -f postgres || true && \
             pkill -9 -f postmaster || true && \
             sleep 2 && \
             echo '=== Systemctl stop PG ===' && \
             systemctl stop postgresql@16-main postgresql || true && \
             echo '=== Largest directories in / ===' && \
             du -hx --max-depth=2 / | sort -rh | head -n 20 && \
             echo '=== Cleaning up journal logs ===' && \
             journalctl --vacuum-size=100M || true && \
             echo '=== Cleaned Disk Space ===' && \
             df -h"
