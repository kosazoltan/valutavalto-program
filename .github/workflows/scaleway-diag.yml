name: Scaleway Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 'READ-ONLY watchdog stderr trace'
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
            root@${{ secrets.SCALEWAY_SERVER_IP }} \
            bash -s << 'ENDSSH'
          set +e
          WD=/opt/valutavalto/deploy/hetzner/ha/primary-watchdog.sh
          echo "=== run watchdog with bash -x trace, capture last 40 lines before it exits 1 ==="
          timeout 30 bash -x "$WD" 2>&1 | tail -40
          echo "  === exit: ${PIPESTATUS[0]} ==="
          echo ""
          echo "=== the config/env block of the script (what does it need?) ==="
          sed -n '1,60p' "$WD" | grep -nE 'PRIMARY|HEALTH|URL|EMAIL|CF_|CONFIG|source|\.env|MAIL|curl|exit 1|REQUIRE' | head -25
          echo ""
          echo "=== is there a watchdog .env / config file it sources? ==="
          ls -la /opt/valutavalto/deploy/hetzner/ha/*.env /etc/primary-watchdog* 2>/dev/null
          echo "=== Kesz ==="
          ENDSSH
