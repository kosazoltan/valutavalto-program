name: Scaleway Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 'READ-ONLY watchdog health + fresh-code + failover-safety probe'
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
            root@${{ secrets.SCALEWAY_SERVER_IP }} \
            bash -s << 'ENDSSH'
          set +e
          echo "=== watchdog timer/service state ==="
          echo "timer: enabled=$(systemctl is-enabled primary-watchdog.timer 2>/dev/null) active=$(systemctl is-active primary-watchdog.timer 2>/dev/null)"
          systemctl list-timers primary-watchdog.timer --no-pager 2>/dev/null | grep -iE 'NEXT|primary-watchdog' | head -2
          echo ""
          echo "=== fresh #1318 code present? (cf_apex_ip + FAILBACK_REMIND_SECS markers) ==="
          WD=/opt/valutavalto/deploy/hetzner/ha/primary-watchdog.sh
          grep -c 'cf_apex_ip' "$WD" 2>/dev/null | xargs echo "  cf_apex_ip occurrences:"
          grep -c 'FAILBACK_REMIND_SECS' "$WD" 2>/dev/null | xargs echo "  FAILBACK_REMIND_SECS occurrences:"
          grep -E '^AUTO_FAILOVER=' "$WD" 2>/dev/null | xargs echo "  config:"
          echo "  executable? $([ -x "$WD" ] && echo YES || echo 'NO - 203/EXEC risk!')"
          echo ""
          echo "=== SAFETY: does the watchdog see the Hetzner primary as UP (no false failover)? ==="
          echo "  public probe:  $(curl -s -o /dev/null -w '%{http_code}' --max-time 12 https://excvaluta.com/api/v1/auth/bootstrap-status)"
          echo "  origin probe:  $(curl -s -o /dev/null -w '%{http_code}' --max-time 12 --resolve excvaluta.com:443:95.216.191.162 https://excvaluta.com/api/v1/auth/bootstrap-status)"
          echo "  watchdog state file: $(cat /var/lib/primary-watchdog/state 2>/dev/null | tr '\n' ' ' || echo '(none - clean, no failure counter)')"
          echo ""
          echo "=== last watchdog run (journal) ==="
          journalctl -u primary-watchdog.service -n 8 --no-pager 2>/dev/null | tail -8 || echo "(no runs yet - timer just installed)"
          echo ""
          echo "=== standby PG still in recovery (correct for a standby)? ==="
          sudo -u postgres psql -tAc "SELECT 'pg_is_in_recovery='||pg_is_in_recovery()" 2>/dev/null
          echo "=== Kesz ==="
          ENDSSH
