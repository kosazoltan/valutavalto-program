name: Flyway Migration Lint

# F14/F15 fix (2026-05-07 backend audit follow-up):
#  - F14: out-of-order V<n>_<m>__ style version detection. A V3_5/V3_7/V108_1
#    formátumokat Flyway "decimal" verzióként értelmezi, és bizonyos
#    konfigurációkban out-of-order error-t dob. Új migration NEM használhatja
#    ezt a formátumot.
#  - F15: már alkalmazott migration fájl módosítását blokkoljuk. Flyway
#    `validate` checksum-ellenőrzést végez, és bármi változás → outage.
#    A CI lint script biztosítja hogy a main-on lévő migration-fájlok
#    NEM változnak hozzáadás nélkül.

on:
  pull_request:
    paths:
      - 'backend/src/main/resources/db/migration/**'
  push:
    branches: [main]
    paths:
      - 'backend/src/main/resources/db/migration/**'

permissions:
  contents: read

jobs:
  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history needed for diff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: F14 — Reject decimal-style version (V<n>_<m>__)
        run: |
          set -e
          MIGR_DIR="backend/src/main/resources/db/migration"
          # Find files matching V<digits>_<digits>__
          DECIMAL_FILES=$(ls "$MIGR_DIR" 2>/dev/null | grep -E '^V[0-9]+_[0-9]+__' || true)
          if [ -n "$DECIMAL_FILES" ]; then
            # Allow legacy decimal-style files that already exist on main
            git fetch origin main --depth=1 2>/dev/null || true
            ALLOWED=$(git ls-tree -r --name-only origin/main "$MIGR_DIR" 2>/dev/null | sed "s|$MIGR_DIR/||" | grep -E '^V[0-9]+_[0-9]+__' || true)
            NEW_DECIMAL=$(comm -23 <(echo "$DECIMAL_FILES" | sort) <(echo "$ALLOWED" | sort) || echo "$DECIMAL_FILES")
            if [ -n "$NEW_DECIMAL" ]; then
              echo "::error::F14 — New migration uses decimal-style version (V<n>_<m>__). Use V<integer>__ only:"
              echo "$NEW_DECIMAL"
              exit 1
            else
              echo "Existing decimal-style files (allowed legacy):"
              echo "$DECIMAL_FILES"
            fi
          fi
          echo "F14 lint OK."

      - name: F15 — Reject modification of already-merged migration files
        if: github.event_name == 'pull_request'
        run: |
          set -e
          MIGR_DIR="backend/src/main/resources/db/migration"
          ALLOWLIST="$MIGR_DIR/.flyway-lint-allowed-modifications"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # Files modified (NOT added) under migration dir
          MODIFIED=$(git diff --name-only --diff-filter=M "$BASE_SHA" -- "$MIGR_DIR")
          if [ -n "$MODIFIED" ]; then
            # Whitelist: a .flyway-lint-allowed-modifications fájl tartalmazhat olyan filename-eket
            # amelyek dokumentált production-repair eljárással módosíthatóak (lásd a fájl tetején).
            #
            # Codex P1 #574 fix: az allowlist a BASE revision-bõl (main HEAD) olvasandó, NEM a
            # PR workspace-ből. Különben egy PR ugyanabban a commit-ban módosíthatna egy
            # V<n>__ migration-t ÉS hozzáadhatná a filename-et az allowlist-hez → F15 átengedi
            # (self-bypass). A védelem értelmét vesztené.
            #
            # Helyes: csak akkor allowed, ha a base revision ALREADY contained az entryt
            # — vagyis egy korábbi (külön) PR dokumentált eljárással bevezette.
            ALLOWED_LIST=""
            ALLOWED_LIST=$(git show "${BASE_SHA}:${ALLOWLIST}" 2>/dev/null | grep -vE '^\s*#|^\s*$' | awk '{print $1}' || true)
            # Copilot P2 #574: a regi `printf "$BLOCKED"` format-string interpolaciot csinalt,
            # `%` karakteres filename hibazna. Helyette array-alapu akkumulacio + per-file
            # printf '%s\n' "$f" (literal print, nincs format expansion).
            BLOCKED_FILES=()
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              basename_f=$(basename "$f")
              # Skip the allowlist file itself
              if [ "$basename_f" = ".flyway-lint-allowed-modifications" ]; then
                continue
              fi
              if echo "$ALLOWED_LIST" | grep -Fxq "$basename_f"; then
                printf '  (allowed, see .flyway-lint-allowed-modifications): %s\n' "$f"
              else
                BLOCKED_FILES+=("$f")
              fi
            done <<< "$MODIFIED"
            if [ "${#BLOCKED_FILES[@]}" -gt 0 ]; then
              echo "::error::F15 — Already-merged migration file MODIFIED. Flyway checksum mismatch will cause production outage on next deploy. Create a new V<n+1>__ instead OR add the file to .flyway-lint-allowed-modifications with a documented production-repair plan."
              echo "Blocked files:"
              for f in "${BLOCKED_FILES[@]}"; do
                printf '%s\n' "$f"
              done
              exit 1
            fi
          fi
          echo "F15 lint OK — only additions or whitelisted modifications in $MIGR_DIR."

      - name: F14b — Detect duplicate version prefixes
        run: |
          set -e
          MIGR_DIR="backend/src/main/resources/db/migration"
          DUPS=$(ls "$MIGR_DIR" 2>/dev/null | awk -F'__' '{print $1}' | sort | uniq -c | awk '$1 > 1 {print $2}')
          if [ -n "$DUPS" ]; then
            echo "::error::Duplicate Flyway version prefix found (Flyway will refuse to apply):"
            echo "$DUPS"
            exit 1
          fi
          echo "No duplicate versions."
