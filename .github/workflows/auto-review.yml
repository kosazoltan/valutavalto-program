name: Auto Review (Bence)

# Automatikus review pipeline - Bence agent helyett GitHub Actions triggereli
# Sourcery review-t minden uj / ready PR-en.
#
# 2026-04-27 audit gyokerok-fix: a `@codex review` mention el lett tavolitva,
# mert a Codex GitHub App AUTO-review-t fut PR-eken anelkul is (a `/pulls/{N}/reviews`
# API-n erkezo "💡 Codex Review" valodi findingek). Az `@codex review` mention
# CSAK az `chatgpt-codex-connector[bot]` "create Codex account" setup-prompt-jat
# triggerelte (166 zaj-comment 3 nap alatt) — ez a kosazoltan-hez nem linkelt
# ChatGPT/Codex fiok hianya miatt. A mention torleseval a zaj megszunt, a Codex
# auto-review valodi findingekkel valtozatlanul elerheto.
#
# Muveletek:
#   1. PR nyitas / draft->ready / sync -> @sourcery-ai review komment (Codex auto-fut anelkul is)
#   2. Post-CI -> ha CI green, badge-kommenttel jelzi a review-allapotot
#
# Bot felhasznalok:
#   - sourcery-ai[bot]      - statikus analizis, stilus, bug_risk (mention triggered)
#   - chatgpt-codex-connector[bot] - javaslatok + P1/P2 badge-ek (auto-review, NEM mention)
#
# Manual trigger: @sourcery-ai review komment egy PR-en.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  trigger-review-bots:
    name: Trigger Sourcery + Codex review
    runs-on: ubuntu-latest
    # Draft PR-eken nem futunk - csak ready_for_review utan
    if: github.event.pull_request.draft == false
    steps:
      - name: Check if already reviewed in this push
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // Az utolso 50 komment kozott keresunk mar meghivott bot-trigger-t
            // EZEN a commit-sha-n belul (hogy push utan ismet fusson).
            const headSha = context.payload.pull_request.head.sha;
            const stateKey = `<!-- bence-auto-review: ${headSha} -->`;
            const alreadyTriggered = comments.some(c => c.body?.includes(stateKey));
            core.setOutput('already', alreadyTriggered ? 'true' : 'false');
            core.setOutput('state_key', stateKey);

      - name: Post review trigger comment
        if: steps.check.outputs.already == 'false'
        uses: actions/github-script@v9
        env:
          STATE_KEY: ${{ steps.check.outputs.state_key }}
        with:
          script: |
            const stateKey = process.env.STATE_KEY;
            const body = [
              stateKey,
              '## :robot: Auto review triggered (Bence)',
              '',
              'A reviewer bot-ok mostantol futnak a legfrissebb commit-on:',
              '',
              '- **@sourcery-ai** - statikus analizis, stilus, bug_risk (mention trigger)',
              '- **Codex GitHub App** - automatikus review (NEM mention; `/pulls/{N}/reviews` API-n)',
              '',
              '---',
              '',
              '@sourcery-ai review',
              '',
              '---',
              '',
              '_Automatikus Bence trigger. Megjegyzes (2026-04-27 audit fix): a `@codex review`',
              'mention el lett tavolitva, mert a Codex GitHub App auto-review valodi findingeket',
              'ad anelkul is. Korabban a mention csak "create Codex account" setup-prompt zajt termelt._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Trigger komment posztolva: ${stateKey}`);

      - name: Skip (already triggered for this SHA)
        if: steps.check.outputs.already == 'true'
        run: |
          echo "Bot trigger mar fut / lefutott ezen a commit-sha-n. Skip."
