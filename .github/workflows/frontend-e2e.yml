name: Frontend E2E

on:
  push:
    branches: [main]
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-e2e.yml'
      - '.github/workflows/deploy-vercel-render.yml'
  pull_request:
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-e2e.yml'
      - '.github/workflows/deploy-vercel-render.yml'
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

# Audit-iter3 P1 (2026-04-27, CodeQL actions/missing-workflow-permissions fix):
# Playwright E2E csak olvas + npm install + Playwright run. Default contents: read elegendo.
permissions:
  contents: read

jobs:
  auth-reload-smoke:
    name: Auth Reload Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            frontend-react/playwright-report
            frontend-react/test-results
