name: Deploy to Vercel + Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  frontend-vercel:
    name: Frontend Deploy (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: frontend-react
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: frontend-react
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        working-directory: frontend-react
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  backend-render:
    name: Backend Deploy (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [frontend-vercel, backend-render]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend / Vercel | ${{ needs.frontend-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend / Render | ${{ needs.backend-render.result }} |" >> $GITHUB_STEP_SUMMARY
