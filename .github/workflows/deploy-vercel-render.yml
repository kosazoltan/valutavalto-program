# Vercel + Render Deployment
# Frontend: Vercel (automatikus, ez csak notification)
# Backend: Render (webhook trigger)

name: Deploy to Vercel + Render

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Frontend - Vercel automatikusan deployol push-ra
  # Ez a job csak statuszt jelez
  frontend-vercel:
    name: Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-react
        continue-on-error: true

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-react
        continue-on-error: true

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-react
        continue-on-error: true

  # Backend - Render webhook trigger
  backend-render:
    name: Backend (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Triggering Render deployment..."
          # Ha van deploy hook URL beallitva:
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ] && [ "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" != "https://api.render.com/deploy/srv-YOUR_SERVICE_ID?key=YOUR_DEPLOY_KEY" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deploy triggered!"
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured - Render auto-deploys on push"
            echo "Set up deploy hook in Render Dashboard -> Service -> Settings -> Deploy Hook"
          fi

  # Status notification
  notify:
    name: Deployment Status
    needs: [frontend-vercel, backend-render]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Vercel | ${{ needs.frontend-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | Render | ${{ needs.backend-render.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://valutavalto.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: https://valuta-backend.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- API Docs: https://valuta-backend.onrender.com/swagger-ui.html" >> $GITHUB_STEP_SUMMARY
