name: Deploy to Vercel + Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  RENDER_BACKEND_HOST: valuta-backend-spbx.onrender.com
  RENDER_BACKEND_SERVICE_CANDIDATES: valuta-backend-spbx,valuta-backend

jobs:
  frontend-vercel:
    name: Frontend Deploy (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: frontend-react
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: frontend-react
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        working-directory: frontend-react
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  backend-render:
    name: Backend Deploy (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_HOST: ${{ env.RENDER_BACKEND_HOST }}
          RENDER_BACKEND_SERVICE_CANDIDATES: ${{ env.RENDER_BACKEND_SERVICE_CANDIDATES }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import sys
          from urllib.parse import urlparse
          import urllib.error
          import urllib.request

          api_key = os.environ.get("RENDER_API_KEY", "").strip()
          backend_host = os.environ.get("RENDER_BACKEND_HOST", "").strip().lower()
          candidate_names = [
              item.strip().lower()
              for item in os.environ.get("RENDER_BACKEND_SERVICE_CANDIDATES", "").split(",")
              if item.strip()
          ]

          if not api_key:
              print("Missing Render API key", file=sys.stderr)
              raise SystemExit(1)

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", data=None):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                return exc.code, exc.read().decode("utf-8")

            def parse_json(body):
              if not body:
                return {}
              try:
                return json.loads(body)
              except json.JSONDecodeError:
                return {"raw": body}

            def deploy_payload(item):
              return item.get("deploy") or item

          status, body = request("https://api.render.com/v1/services")
            if not 200 <= status < 300:
              print(f"Render service list failed with status {status}", file=sys.stderr)
              print(body, file=sys.stderr)
              raise SystemExit(1)

          services = json.loads(body)

          def unwrap(item):
              service = item.get("service") or item
              details = service.get("serviceDetails") or item.get("serviceDetails") or {}
              url = details.get("url") or service.get("url") or item.get("url") or ""
              host = urlparse(url).netloc.lower() if url else ""
              return {
                  "id": service.get("id") or item.get("id") or "",
                  "name": (service.get("name") or item.get("name") or "").strip(),
                  "slug": (service.get("slug") or item.get("slug") or "").strip(),
                  "url": url,
                  "host": host,
              }

          ranked = []
          for raw_service in services:
              service = unwrap(raw_service)
              score = 0
              if backend_host and service["host"] == backend_host:
                  score += 100
              if service["slug"].lower() in candidate_names:
                  score += 50
              if service["name"].lower() in candidate_names:
                  score += 40
              if score > 0:
                  ranked.append((score, service))

          ranked.sort(key=lambda item: item[0], reverse=True)

          if not ranked:
              print(
                  f"Render target not found for host={backend_host or '-'} candidates={candidate_names}",
                  file=sys.stderr,
              )
              for service in map(unwrap, services):
                  print(
                      f"Available Render service: name={service['name']} slug={service['slug']} host={service['host']}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          selected = ranked[0][1]
          print(
              f"Selected Render service: name={selected['name']} slug={selected['slug']} host={selected['host']}"
          )

          service_id = selected["id"]
          if not service_id:
              print("Render service ID missing", file=sys.stderr)
              raise SystemExit(1)

          deploy_payload = json.dumps({"clearCache": "clear"}).encode("utf-8")

            status, body = request(
              f"https://api.render.com/v1/services/{service_id}/deploys",
              method="POST",
              data=deploy_payload,
          )
            if not 200 <= status < 300:
              print(f"Render deploy failed with status {status}", file=sys.stderr)
              print(body, file=sys.stderr)
              raise SystemExit(1)

            created_deploy = parse_json(body)
            deploy = deploy_payload(created_deploy)
            deploy_id = deploy.get("id")
            print("Render deploy triggered via API")
            print(json.dumps(created_deploy, indent=2))

            if not deploy_id:
              print("Render deploy response did not include a deploy id", file=sys.stderr)
              raise SystemExit(1)

            terminal_failure_statuses = {
              "build_failed",
              "canceled",
              "cancelled",
              "deactivated",
              "failed",
              "pre_deploy_failed",
              "timed_out",
              "update_failed",
            }
            running_statuses = {
              "build_in_progress",
              "created",
              "in_progress",
              "pre_deploy_in_progress",
              "queued",
              "starting",
              "triggered",
              "update_in_progress",
            }

            detail_url = f"https://api.render.com/v1/services/{service_id}/deploys/{deploy_id}"
            last_status = None
            last_detail = None

            for attempt in range(80):
              status, body = request(detail_url)
              if not 200 <= status < 300:
                print(f"Render deploy status lookup failed with status {status}", file=sys.stderr)
                print(body, file=sys.stderr)
                raise SystemExit(1)

              last_detail = parse_json(body)
              deploy = deploy_payload(last_detail)
              deploy_status = (deploy.get("status") or "unknown").lower()

              if deploy_status != last_status:
                print(
                  f"Render deploy status changed: {last_status or 'initial'} -> {deploy_status}"
                )
                print(json.dumps(last_detail, indent=2))
                last_status = deploy_status

              if deploy_status == "live":
                print("Render deploy reached live state")
                raise SystemExit(0)

              if deploy_status in terminal_failure_statuses:
                print(f"Render deploy ended with failure status: {deploy_status}", file=sys.stderr)
                print(json.dumps(last_detail, indent=2), file=sys.stderr)
                raise SystemExit(1)

              if deploy_status not in running_statuses:
                print(f"Render deploy ended with unexpected status: {deploy_status}", file=sys.stderr)
                print(json.dumps(last_detail, indent=2), file=sys.stderr)
                raise SystemExit(1)

              time.sleep(15)

            print("Render deploy polling timed out", file=sys.stderr)
            if last_detail is not None:
              print(json.dumps(last_detail, indent=2), file=sys.stderr)
            raise SystemExit(1)
          PY

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [frontend-vercel, backend-render]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend / Vercel | ${{ needs.frontend-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend / Render | ${{ needs.backend-render.result }} |" >> $GITHUB_STEP_SUMMARY
