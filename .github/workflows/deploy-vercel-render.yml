name: Deploy to Vercel + Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  frontend-vercel:
    name: Frontend Deploy (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: frontend-react
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: frontend-react
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        working-directory: frontend-react
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  backend-render:
    name: Backend Deploy (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          api_key = os.environ.get("RENDER_API_KEY", "").strip()
          deploy_hook = os.environ.get("RENDER_DEPLOY_HOOK_URL", "").strip()

          if deploy_hook:
              req = urllib.request.Request(deploy_hook, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if 200 <= resp.status < 300:
                          print("Render deploy triggered via deploy hook")
                          raise SystemExit(0)
              except Exception:
                  print("Deploy hook failed, falling back to Render API")

          if not api_key:
              print("Missing Render API key", file=sys.stderr)
              raise SystemExit(1)

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", data=None):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8")

          status, body = request("https://api.render.com/v1/services")
          services = json.loads(body)

          service = next(
              (
                  item
                  for item in services
                  if item.get("service", {}).get("name") == "valuta-backend"
                  or item.get("name") == "valuta-backend"
              ),
              None,
          )
          if service is None:
              print("Render service valuta-backend not found", file=sys.stderr)
              raise SystemExit(1)

          service_id = service.get("service", {}).get("id") or service.get("id")
          if not service_id:
              print("Render service ID missing", file=sys.stderr)
              raise SystemExit(1)

          status, _ = request(
              f"https://api.render.com/v1/services/{service_id}/deploys",
              method="POST",
              data=b"{}",
          )
          if 200 <= status < 300:
              print("Render deploy triggered via API")
              raise SystemExit(0)

          print(f"Render deploy failed with status {status}", file=sys.stderr)
          raise SystemExit(1)
          PY

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [frontend-vercel, backend-render]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend / Vercel | ${{ needs.frontend-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend / Render | ${{ needs.backend-render.result }} |" >> $GITHUB_STEP_SUMMARY
