name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend-react/**'
      - 'deploy/hetzner/**'
      - '.github/workflows/deploy-hetzner.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without backend changes'
        required: false
        default: 'false'

concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: false

# Audit-iter3 P1 (2026-04-27, CodeQL actions/missing-workflow-permissions fix):
# Default `contents: read` minden job-ra. Az SSH-alapu deploy a secrets-szel megy
# (HETZNER_SSH_PRIVATE_KEY), nem igenyel `contents: write` token-t. Ha specifikus
# job tobbet igenyel, ott jobszinten override-olando.
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  VPS_DEPLOY_PATH: /opt/valutavalto/backend
  VPS_USER_OWNER: valuta
  SERVICE_NAME: valuta-backend.service
  JAR_SYMLINK: valuta-backend-current.jar
  HEALTH_URL: https://excvaluta.com/api/v1/auth/bootstrap-status
  VERSION_URL: https://excvaluta.com/api/v1/version

jobs:
  build:
    name: Build Backend JAR
    runs-on: ubuntu-latest
    outputs:
      jar_name: ${{ steps.mvn.outputs.jar_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 2026-05-20 V234 outage hotfix: deploy pre-flight Flyway dup-version guard.
      # A flyway-migration-lint.yml F14b a PR-branch-en fut, de a collision csak
      # merge UTÁN áll elő main-en (két külön branch ugyanazt a Vnnn-t adja). Ez a
      # pre-flight a tényleges deploy-jar forrásán fut, így FAIL-loud a deploy ELŐTT,
      # NEM production startup-on (ami 502 outage-ot okozott).
      - name: Pre-flight — Flyway duplicate version guard (BLOCKING)
        run: |
          set -e
          MIGR_DIR="backend/src/main/resources/db/migration"
          DUPS=$(ls "$MIGR_DIR" 2>/dev/null | awk -F'__' '{print $1}' | sort | uniq -c | awk '$1 > 1 {print $2}')
          if [ -n "$DUPS" ]; then
            echo "::error::DEPLOY BLOCKED — Duplicate Flyway version prefix on main (production startup would fail with 'Found more than one migration with version'):"
            echo "$DUPS"
            echo "Fix: rename one of the colliding V<n>__ migrations to the next free version, push hotfix."
            exit 1
          fi
          echo "Pre-flight OK — no duplicate Flyway versions."

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven package (skip tests — tests run in CI separately)
        id: mvn
        working-directory: backend
        run: |
          mvn -B package -DskipTests --no-transfer-progress
          JAR=$(ls target/valuta-backend-*.jar | grep -v SNAPSHOT | tail -1)
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Built: $JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/valuta-backend-*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: ./deploy-artifacts

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload JAR to VPS
        run: |
          JAR=$(ls ./deploy-artifacts/valuta-backend-*.jar | grep -v SNAPSHOT | tail -1)
          JAR_NAME=$(basename $JAR)
          echo "Uploading $JAR_NAME ..."
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "$JAR" \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:${{ env.VPS_DEPLOY_PATH }}/target/$JAR_NAME"
          echo "jar_name=$JAR_NAME" >> $GITHUB_ENV

      - name: Repair Flyway failed migrations (auto)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -euo pipefail
            # 2026-05-15 hotfix: ha egy korabbi deploy soran egy migracio FAILED-elt,
            # Flyway refuses to proceed. Itt tisztitjuk a failed sorokat a schema_history-bol
            # (csak success=false sorokat) MIELOTT a backend ujrainduljon es Flyway megint
            # probalja. A migration-tartalmat addig javitottuk a kovetkezo deploy-ban.
            DB_NAME=$(systemctl show ${{ env.SERVICE_NAME }} --property=Environment 2>/dev/null | grep -oP 'DATABASE_URL=[^ ]+' | head -1 | sed -E 's|.*/([^?]+).*|\1|' || echo valuta)
            DB_USER=$(systemctl show ${{ env.SERVICE_NAME }} --property=Environment 2>/dev/null | grep -oP 'DATABASE_USERNAME=\S+' | head -1 | cut -d= -f2 || echo valuta_user)
            DB_NAME=${DB_NAME:-valuta}
            DB_USER=${DB_USER:-valuta_user}
            echo "=== Flyway repair: DELETE failed rows from schema_history ==="
            echo "DB: $DB_NAME (user $DB_USER)"
            # PostgreSQL postgres OS user has peer auth, can connect to any DB
            sudo -u postgres psql -d "$DB_NAME" -c "SELECT version, success FROM flyway_schema_history WHERE success = false ORDER BY installed_rank DESC LIMIT 10;" || true
            sudo -u postgres psql -d "$DB_NAME" -c "DELETE FROM flyway_schema_history WHERE success = false;" || true
            # 2026-07-04 hotfix (PROD-502): a V339 ALTER TABLE exchange_rate_distribution
            # elbukott "must be owner of table" hibaval — egyes tablak nem a runtime
            # DB_USER (valuta_user) tulajdonaban voltak (V71 postgres-owner-rel jott letre),
            # igy a Flyway ADD COLUMN nem futott le -> backend startup crash -> 502.
            # Normalizaljuk a NEM runtime-DB_USER tulajdonu public tabla+sequence
            # objektumokat a DB_USER-re (idempotens: elso futaskor a tortenelmi
            # postgres-owner maradekot javitja, steady-state-ben az AND ... <> szuro
            # miatt 0 ALTER = 0 lock; dollar-quote/heredoc NELKUL, hogy a bash/YAML
            # ne torje) MIELOTT a backend ujrainditva Flyway-t futtat.
            echo "=== Owner-normalizalas: public tablak+sequence-ek -> $DB_USER ==="
            sudo -u postgres psql -d "$DB_NAME" -tAc "SELECT format('ALTER TABLE public.%I OWNER TO %I;', tablename, '$DB_USER') FROM pg_tables WHERE schemaname='public' AND tableowner <> '$DB_USER'" | sudo -u postgres psql -d "$DB_NAME" -v ON_ERROR_STOP=0 || true
            sudo -u postgres psql -d "$DB_NAME" -tAc "SELECT format('ALTER SEQUENCE public.%I OWNER TO %I;', sequencename, '$DB_USER') FROM pg_sequences WHERE schemaname='public' AND sequenceowner <> '$DB_USER'" | sudo -u postgres psql -d "$DB_NAME" -v ON_ERROR_STOP=0 || true
            echo "=== Repair done ==="
          ENDSSH

      - name: Symlink + chown + restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -euo pipefail
            DEPLOY=${{ env.VPS_DEPLOY_PATH }}
            SYMLINK=$DEPLOY/target/${{ env.JAR_SYMLINK }}
            JAR=$(ls $DEPLOY/target/valuta-backend-*.jar | grep -v SNAPSHOT | grep -v current | sort -V | tail -1)
            echo "=== Symlinking: $JAR -> $SYMLINK ==="
            ln -sf "$JAR" "$SYMLINK"
            chown -h ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} "$SYMLINK" || true
            chown ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} "$JAR"
            # V234 hotfix 2026-05-18: a backend logback-spring.xml a /opt/valutavalto/backend/logs
            # mappaba ir. Biztositani kell hogy letezzen + a `valuta` user-nek joga legyen.
            # Az elozo deploy fail-elt: FileNotFoundException /var/log/valuta-backend/...
            mkdir -p "$DEPLOY/logs"
            chown -R ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} "$DEPLOY/logs"
            ENV_FILE="$DEPLOY/.env"
            # RP-HA (2026-07-06): a #1307 kezi ops-lepese (RATE-PRINT-SECRET.md) a meglevo
            # prodon nem futott le -> a deploy auto-provisionalja (idempotens; a
            # bootstrap-vps.sh gen_secret_hex mintaja). Csak akkor general, ha hianyzik.
            if ! grep -qE '^APP_RATE_PRINT_HMAC_SECRET=.+$' "$ENV_FILE"; then
              printf '\n# RP-HA stabil HMAC secret (auto-provisioned by deploy, 2026-07-06)\nAPP_RATE_PRINT_HMAC_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$ENV_FILE"
              chown root:${{ env.VPS_USER_OWNER }} "$ENV_FILE" || true
              chmod 640 "$ENV_FILE" || true
              echo "APP_RATE_PRINT_HMAC_SECRET auto-provisioned"
            fi
            # Fail-closed orseg: ha a fenti utan SINCS ertekes secret, allj le.
            if ! grep -qE '^APP_RATE_PRINT_HMAC_SECRET=.+$' "$ENV_FILE"; then
              echo "::error::APP_RATE_PRINT_HMAC_SECRET hianyzik vagy ures a $ENV_FILE fajlban; APP_RATE_PRINT_HMAC_SECRET_REQUIRED=true nem kapcsolhato be biztonsagosan."
              exit 1
            fi
            if ! grep -qE '^APP_RATE_PRINT_HMAC_SECRET_REQUIRED=' "$ENV_FILE"; then
              printf '\n# RP-HA guarded fail-fast (2026-07-06): prodon kotelezo stabil secret.\nAPP_RATE_PRINT_HMAC_SECRET_REQUIRED=true\n' >> "$ENV_FILE"
              chown root:${{ env.VPS_USER_OWNER }} "$ENV_FILE" || true
              chmod 640 "$ENV_FILE" || true
            fi
            # FS-15 (2026-07-11): PV-kód jelenlét-smoke. Nem blokkoló; a runtime fail-closed véd.
            if ! grep -qE '^DARIUS_PV_CODES=.+$' "$ENV_FILE"; then
              echo "::warning::DARIUS_PV_CODES hianyzik a $ENV_FILE fajlbol — a Raiffeisen importfajl-export fail-closed tiltva."
            fi
            # FK-091 (2026-08-24): prod profil, nem application-production.properties — env-ből kell.
            if ! grep -qE '^EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED=' "$ENV_FILE"; then
              printf '\n# FK-091 HQ veszkijarat (auto-provisioned by deploy, 2026-08-24)\nEVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED=true\n' >> "$ENV_FILE"
              chown root:${{ env.VPS_USER_OWNER }} "$ENV_FILE" || true
              chmod 640 "$ENV_FILE" || true
              echo "EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED auto-provisioned (true)"
            elif grep -qE '^EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED=false' "$ENV_FILE"; then
              sed -i 's/^EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED=false/EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED=true/' "$ENV_FILE"
              chown root:${{ env.VPS_USER_OWNER }} "$ENV_FILE" || true
              chmod 640 "$ENV_FILE" || true
              echo "EVENING_CLOSING_ARTIFACT_SUCCESS_ENABLED upgraded false -> true (FK-091)"
            fi
            echo "=== Restarting ${{ env.SERVICE_NAME }} ==="
            systemctl restart ${{ env.SERVICE_NAME }}
            sleep 15
            systemctl is-active ${{ env.SERVICE_NAME }} || { journalctl -u ${{ env.SERVICE_NAME }} -n 30 --no-pager; exit 1; }
            echo "=== Service is active ==="
          ENDSSH

      - name: Health check (ORIGIN-pinned — a deployolt Hetzner hostot méri, nem az edge-et)
        run: |
          set -euo pipefail
          ORIGIN_RESOLVE="excvaluta.com:443:${{ secrets.VPS_SERVER_IP }}"
          JAR_NAME="${{ needs.build.outputs.jar_name }}"
          DEPLOY_VERSION="${JAR_NAME#valuta-backend-}"; DEPLOY_VERSION="${DEPLOY_VERSION%.jar}"
          echo "Deployolt verzió: $DEPLOY_VERSION | origin: ${{ secrets.VPS_SERVER_IP }}"
          echo "Waiting for service startup..."
          for i in 1 2 3 4 5 6; do
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              --resolve "$ORIGIN_RESOLVE" "${{ env.HEALTH_URL }}" || echo 000)
            echo "Attempt $i: origin HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              ORIGIN_VERSION=$(curl -s --max-time 15 --resolve "$ORIGIN_RESOLVE" \
                "${{ env.VERSION_URL }}" | jq -r '.version // empty' || echo "")
              echo "Origin /version: '${ORIGIN_VERSION:-?}' (elvárt: $DEPLOY_VERSION)"
              if [[ "$ORIGIN_VERSION" == "$DEPLOY_VERSION" ]]; then
                echo "Health check PASSED — az új jar ($DEPLOY_VERSION) fut az originen."
                exit 0
              fi
              echo "::error::Origin él (200), de a /version '$ORIGIN_VERSION' != deployolt '$DEPLOY_VERSION' — a symlink/restart nem az új jart szolgálja."
              exit 1
            fi
          done
          echo "::error::Health check FAILED — az ORIGIN nem ad 200-at 6 próbálkozás után."
          exit 1

      - name: Edge version drift check (publikus edge vs deployolt — NEM blokkoló)
        if: always()
        run: |
          # Szándékosan NEM 'set -e': ez a step SOHA nem buktathatja a deployt (korai riasztás a célja).
          JAR_NAME="${{ needs.build.outputs.jar_name }}"
          DEPLOY_VERSION="${JAR_NAME#valuta-backend-}"; DEPLOY_VERSION="${DEPLOY_VERSION%.jar}"
          EDGE_VERSION=$(curl -s --max-time 15 "${{ env.VERSION_URL }}" | jq -r '.version // empty' 2>/dev/null || echo "")
          echo "Edge /version: '${EDGE_VERSION:-UNREACHABLE}' | deployolt: $DEPLOY_VERSION"
          {
            echo "## Edge version drift check"
            echo "- Deployolt (Hetzner origin): \`$DEPLOY_VERSION\`"
            echo "- Publikus edge (excvaluta.com): \`${EDGE_VERSION:-UNREACHABLE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EDGE_VERSION" ]; then
            echo "::warning::PROD-VERSION-DRIFT? A publikus edge /version NEM olvasható — ellenőrizd, melyik originre mutat a Cloudflare DNS."
            echo "- ⚠️ Az edge /version nem olvasható — DNS/edge ellenőrzés javasolt." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EDGE_VERSION" != "$DEPLOY_VERSION" ]; then
            echo "::warning::PROD-VERSION-DRIFT! A publikus edge $EDGE_VERSION-t szolgál, a frissen deployolt $DEPLOY_VERSION helyett — a Cloudflare DNS valószínűleg NEM a Hetzner originre mutat (lásd 2026-07-05 PROD-VERSION-STALE incidens). Failback: deploy/hetzner/ha/cloudflare-dns-failover.sh"
            echo "- 🚨 **DRIFT**: az edge NEM a frissen deployolt verziót adja — DNS-failback ellenőrzés KÖTELEZŐ." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ Edge == deployolt verzió." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
        # (Nem kell continue-on-error: a step logikailag mindig exit 0.)

      - name: Deployment summary
        if: always()
        run: |
          echo "## Hetzner Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ secrets.VPS_SERVER_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health check URL:** ${{ env.HEALTH_URL }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # DB-MIGRÁCIÓ VERIFY. Minden deploy után:
  #   TOPOLÓGIA (Local-First, 2026-06-16 prod-probe-bal igazolva): a backend PRIMARY (futásidejű)
  #   datasource-a a LOKÁLIS Hetzner 'valuta' (DATABASE_URL=localhost:6432, PgBouncer→lokális Postgres).
  #   Bizonyíték: `pg_stat_activity` mutatja a Hikari-poolt a lokálison; .env NEON_SYNC_ENABLED=true,
  #   de az explicit @Primary lokális DataSource (PrimaryDataSourceConfig, #1175) garantálja, hogy a
  #   neon-sync NEM hijackolja a primaryt. A Neon = egyirányú BACKUP-cél (NeonReplicationService,
  #   5 percenként lokális→Neon FULL_SYNC upsert).
  #   Gate A: a Hetzner LOKÁLIS 'valuta' (a TÉNYLEGES szolgáló DB) Flyway-szintje — EZ a valódi,
  #     BLOKKOLÓ gate: ha a szolgáló DB nincs a repo max sémáján, a deploy hibás.
  #   Gate B: a Neon (BACKUP DB) Flyway-migrate + verify — backup-séma karbantartás, INFORMÁLIS
  #     (a Neon-eltérés nem blokkolja a primer deployt, de loud warning + summary).
  # ─────────────────────────────────────────────────────────────────────────────
  verify-hetzner-db:
    name: Gate A — Hetzner LOKÁLIS DB migration (BLOKKOLÓ — szolgáló DB)
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repo max migration version
        id: repo
        run: |
          set -euo pipefail
          MIGR_DIR="backend/src/main/resources/db/migration"
          REPO_MAX=$(ls "$MIGR_DIR"/V*__*.sql | sed -E 's#.*/V([0-9]+)__.*#\1#' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "repo_max=$REPO_MAX" >> "$GITHUB_OUTPUT"
          echo "Repo max migration: V$REPO_MAX"

      - name: Set up SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Assert prod Flyway version == repo max, no failed migrations
        run: |
          set -euo pipefail
          REPO_MAX="${{ steps.repo.outputs.repo_max }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              "REPO_MAX='$REPO_MAX' bash -s" << 'ENDSSH'
            set -o pipefail
            # version !~ '[^0-9]'  ->  csak tiszta-egesz verziok (a decimal legacy V3_5 kihagyva),
            # igy nem kell '$' anchor (heredoc-escape buktato elkerulese).
            PROD_MAX=$(sudo -u postgres psql -d valuta -tAc "SELECT max(version::int) FROM flyway_schema_history WHERE success=true AND version !~ '[^0-9]'" 2>/dev/null | tr -d '[:space:]')
            FAILED=$(sudo -u postgres psql -d valuta -tAc "SELECT count(*) FROM flyway_schema_history WHERE success=false" 2>/dev/null | tr -d '[:space:]')
            echo "Hetzner LOKÁLIS Flyway max = V${PROD_MAX:-?} | repo max = V${REPO_MAX} | failed sorok = ${FAILED:-?}"
            # BLOKKOLÓ gate (Local-First): a lokális Hetzner 'valuta' a TÉNYLEGES szolgáló DB.
            # Ha a sémája nem a repo max-on van, vagy van failed migráció, a deploy hibás → fail.
            GATE_FAIL=0
            if [ -z "${PROD_MAX:-}" ]; then
              echo "::error::Hetzner LOKÁLIS DB Flyway-verzió NEM olvasható (psql/SSH hiba?) — a szolgáló DB állapota ismeretlen, blokkol."
              GATE_FAIL=1
            fi
            if [ "${FAILED:-1}" != "0" ]; then
              echo "::error::Hetzner LOKÁLIS (szolgáló) DB: ${FAILED} db FAILED Flyway sor."
              sudo -u postgres psql -d valuta -c "SELECT version, description, success FROM flyway_schema_history WHERE success=false ORDER BY installed_rank DESC LIMIT 10" 2>/dev/null || true
              GATE_FAIL=1
            fi
            if [ -n "${PROD_MAX:-}" ] && [ "${PROD_MAX}" != "${REPO_MAX}" ]; then
              echo "::error::Hetzner LOKÁLIS (szolgáló) DB V${PROD_MAX} != repo V${REPO_MAX} — a deployolt backend Flyway-e nem migrálta fel a szolgáló DB-t a repo max sémára."
              GATE_FAIL=1
            elif [ -n "${PROD_MAX:-}" ]; then
              echo "OK — a lokális (szolgáló) Hetzner DB a repo max verzión (V${REPO_MAX})."
            fi
            echo "Gate A BLOKKOLÓ: ez a tényleges szolgáló DB; a deploy-blokkolást EZ a gate végzi."
            exit "$GATE_FAIL"
          ENDSSH

      - name: Summary
        if: always()
        run: |
          {
            echo "## Gate A — Hetzner DB migration verify"
            echo "- Repo max: V${{ steps.repo.outputs.repo_max }}"
            echo "- Eredmeny: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  migrate-verify-neon:
    name: Gate B — Migrate + verify Neon BACKUP DB (INFORMÁLIS)
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repo max migration version
        id: repo
        run: |
          set -euo pipefail
          MIGR_DIR="backend/src/main/resources/db/migration"
          REPO_MAX=$(ls "$MIGR_DIR"/V*__*.sql | sed -E 's#.*/V([0-9]+)__.*#\1#' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "repo_max=$REPO_MAX" >> "$GITHUB_OUTPUT"

      - name: Parse NEON_DATABASE_URL -> JDBC (jelszo maszkolva)
        id: parse
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_URL:-}" ]; then
            echo "::warning::NEON_DATABASE_URL repo-secret ures/hianyzik — a Neon BACKUP-DB sema-verify kihagyva (informalis gate)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOSCHEME="${NEON_URL#postgresql://}"; NOSCHEME="${NOSCHEME#postgres://}"
          CREDS="${NOSCHEME%%@*}"; HOSTPART="${NOSCHEME#*@}"
          NUSER="${CREDS%%:*}"; NPASS="${CREDS#*:}"
          echo "::add-mask::$NPASS"
          {
            echo "jdbc=jdbc:postgresql://${HOSTPART}"
            echo "nuser=$NUSER"
          } >> "$GITHUB_OUTPUT"
          echo "NPASS=$NPASS" >> "$GITHUB_ENV"
          echo "Neon JDBC host: $(echo "$HOSTPART" | sed -E 's#/.*##')"

      - name: Flyway migrate Neon (pending migraciok felvitele; idempotens)
        id: neon_migrate
        if: steps.parse.outputs.skip != 'true'
        continue-on-error: true
        env:
          FLYWAY_URL: ${{ steps.parse.outputs.jdbc }}
          FLYWAY_USER: ${{ steps.parse.outputs.nuser }}
          FLYWAY_PASSWORD: ${{ env.NPASS }}
        run: |
          set -euo pipefail
          docker run --rm -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            redgate/flyway:10 -locations=filesystem:/flyway/sql -connectRetries=3 migrate

      - name: Verify Neon schema version == repo max (informalis)
        id: neon_verify
        if: steps.parse.outputs.skip != 'true'
        continue-on-error: true
        env:
          FLYWAY_URL: ${{ steps.parse.outputs.jdbc }}
          FLYWAY_USER: ${{ steps.parse.outputs.nuser }}
          FLYWAY_PASSWORD: ${{ env.NPASS }}
          REPO_MAX: ${{ steps.repo.outputs.repo_max }}
        run: |
          set -euo pipefail
          docker run --rm -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            redgate/flyway:10 -locations=filesystem:/flyway/sql -connectRetries=3 info | tee neon-info.txt
          NEON_VER=$(grep -E 'Schema version:' neon-info.txt | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "Neon BACKUP schema version = V${NEON_VER:-?} | repo max = V${REPO_MAX}"
          if [ "${NEON_VER:-x}" != "${REPO_MAX}" ]; then
            echo "::warning::Neon BACKUP-DB sema V${NEON_VER} != repo V${REPO_MAX} — a backup-sema migracio nem ert celba (informalis; a primer szolgalo DB a lokalis Hetzner, Gate A)."
          else
            echo "OK — Neon BACKUP-DB a repo max verzion (V${REPO_MAX})."
          fi

      - name: Summary
        if: always()
        env:
          SKIPPED: ${{ steps.parse.outputs.skip }}
          MIGRATE_OUTCOME: ${{ steps.neon_migrate.outcome }}
          VERIFY_OUTCOME: ${{ steps.neon_verify.outcome }}
        run: |
          # A migrate/verify continue-on-error → a job.status mindig 'success'. Ezért a TÉNYLEGES
          # step-eredményeket (outcome) jelenítjük meg, hogy a Neon backup-hibája NE legyen láthatatlan
          # (Codex/Copilot review #1189). A gate maradon informális (nem blokkol), de a hiba LÁTHATÓ.
          {
            echo "## Gate B — Neon BACKUP DB migrate + verify (INFORMÁLIS)"
            echo "- Repo max: V${{ steps.repo.outputs.repo_max }}"
            if [ "${SKIPPED:-}" = "true" ]; then
              echo "- Neon migrate/verify: ⏭️ KIHAGYVA (nincs NEON_DATABASE_URL secret)"
            else
              echo "- Neon migrate: \`${MIGRATE_OUTCOME:-?}\` | verify: \`${VERIFY_OUTCOME:-?}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Loud warning, ha a backup-séma migrate/verify ténylegesen hibázott (de NEM blokkol).
          if [ "${MIGRATE_OUTCOME:-}" = "failure" ] || [ "${VERIFY_OUTCOME:-}" = "failure" ]; then
            echo "::warning::Gate B (Neon BACKUP) migrate/verify HIBA (migrate=${MIGRATE_OUTCOME:-?}, verify=${VERIFY_OUTCOME:-?}) — informális, a primer deploy érvényes, de a Neon backup NINCS szinkronban. Ellenőrzés: neon-schema-verify.yml."
            echo "- ⚠️ A Neon backup-séma migrate/verify NEM zöld — a backup lemaradhatott (nem blokkoló)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- ℹ️ Ez INFORMÁLIS gate: a Neon a BACKUP-cél. A deploy-blokkolast a Gate A (lokalis szolgalo DB) vegzi." >> "$GITHUB_STEP_SUMMARY"

  # 2026-06-05: Scaleway warm standby JAR-szinkron. ELOTTE a standby orokke 2.5.49-en
  # ragadt (a deploy csak Hetznert frissitette) -> egy 10 oras Hetzner-outage alatt a
  # tartalek elavult koddal NEM tudta volna atvenni a forgalmat.
  # AKTÍV (2026-07-06 user-mandátum): a #1319 scaleway-ha-restore ujraepitette a
  # Hetzner↔Scaleway streaming-HA-t; a standby hot modban, friss backenddel kell fusson
  # minden sikeres Hetzner backend deploy utan. A split-brain guard tovabbra is ved:
  # promote-olt standby-n (pg_is_in_recovery() != 't') ez a job ABORT-al.
  deploy-standby:
    name: Sync JAR to Scaleway standby (hot)
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    # A health-ablak 30x8s (~240s) — a hideg standby-indulas ennyit is igenyelhet.
    # Az elozo futas 2p17s volt 80s ablakkal, igy a legrosszabb eset ~5 perc;
    # a 15 perc bizonsagos rahagyas, es NEM fedi el a valodi elakadast.
    timeout-minutes: 15
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: ./deploy-artifacts

      - name: Set up SSH (standby)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/scaleway_key
          chmod 600 ~/.ssh/scaleway_key
          ssh-keyscan -H ${{ secrets.SCALEWAY_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      # 2026-07-11 (run 29158727601): a standby diskje betelt, ezert az scp
      # "write remote: Failure" hibaval leallt. Az upload elotti preflight csak
      # recovery-ben levo standby-t takarit, megtartja a current targetet es a
      # legujabb rollback JAR-okat, majd byte- es inode-szinten ellenorzi a helyet.
      - name: Standby preflight — recovery guard + prune + disk check
        run: |
          set -euo pipefail
          JAR=$(ls ./deploy-artifacts/valuta-backend-*.jar 2>/dev/null | grep -v SNAPSHOT | tail -1 || true)
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::Standby preflight: lokalis JAR nem talalhato"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR")
          JAR_BYTES=$(stat -c%s "$JAR")
          if [ -z "$JAR_NAME" ] || [ "$JAR_NAME" = "${{ env.JAR_SYMLINK }}" ] \
             || ! [[ "$JAR_BYTES" =~ ^[0-9]+$ ]] || [ "$JAR_BYTES" -le 0 ]; then
            echo "::error::Standby preflight: ervenytelen JAR (name='$JAR_NAME', bytes='${JAR_BYTES:-}')"
            exit 1
          fi
          echo "Preflight: $JAR_NAME ($JAR_BYTES bytes)"
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s -- "$JAR_NAME" "$JAR_BYTES" << 'ENDSSH'
            set -euo pipefail
            JAR_NAME="$1"
            JAR_BYTES="$2"
            TARGET=${{ env.VPS_DEPLOY_PATH }}/target

            # Fail-closed split-brain guard: semmilyen fajlrendszer-mutacio nem
            # tortenhet, amig a tavoli PostgreSQL recovery allapota nem pontosan t.
            IN_REC=$(sudo -u postgres psql -tAc "SELECT pg_is_in_recovery();" 2>/dev/null || echo "x")
            if [ "$IN_REC" != "t" ]; then
              echo "::error::Standby preflight ABORT: pg_is_in_recovery()='$IN_REC' (nem 't') — lehet aktiv primary, semmihez nem nyulunk"
              exit 1
            fi

            CURRENT=$(readlink -f "$TARGET/${{ env.JAR_SYMLINK }}" 2>/dev/null || true)
            FINAL="$TARGET/$JAR_NAME"
            INCOMING="$TARGET/$JAR_NAME.incoming"

            # Elozo, megszakadt feltoltes csak regularis, nem-symlink fajl lehet.
            if [ -e "$INCOMING" ] || [ -L "$INCOMING" ]; then
              if [ -f "$INCOMING" ] && [ ! -L "$INCOMING" ]; then
                echo "Stale incoming torlese: $INCOMING"
                rm -f "$TARGET/$JAR_NAME.incoming"
              else
                echo "::error::Standby preflight: az incoming utvonal nem regularis fajl: $INCOMING"
                exit 1
              fi
            fi

            # Azonos verzio ujradeploynal a futo JVM current inode-jat megorizzuk;
            # mas, azonos nevu regularis celfajlt az atomikus finalize elott torlunk.
            if { [ -e "$FINAL" ] || [ -L "$FINAL" ]; } && [ "$FINAL" != "$CURRENT" ]; then
              if [ -f "$FINAL" ] && [ ! -L "$FINAL" ]; then
                echo "Regi celfajl torlese: $FINAL"
                rm -f "$FINAL"
              else
                echo "::error::Standby preflight: a vegleges JAR-utvonal nem regularis fajl: $FINAL"
                exit 1
              fi
            fi

            # Determinisztikus rollback-prune: current target + a verzio szerint
            # legujabb KEEP_N regularis JAR mindig megmarad. Symlinket nem torlunk.
            KEEP_N=2
            mapfile -t JARS < <(
              find "$TARGET" -maxdepth 1 -type f -name 'valuta-backend-*.jar' -print \
                | grep -v current \
                | sort -V
            )
            JAR_COUNT=${#JARS[@]}
            PRUNE_COUNT=$(( JAR_COUNT > KEEP_N ? JAR_COUNT - KEEP_N : 0 ))
            for ((I=0; I<PRUNE_COUNT; I++)); do
              FILE=${JARS[$I]}
              if [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ "$FILE" != "$CURRENT" ]; then
                echo "Prune: $FILE"
                rm -f "$FILE"
              fi
            done

            echo "=== df -h ($TARGET) ==="
            df -h "$TARGET"
            echo "=== df -i ($TARGET) ==="
            df -i "$TARGET"
            if ! AVAIL_BYTES=$(df -B1 --output=avail "$TARGET" | tail -1 | tr -d '[:space:]'); then
              echo "::error::Standby preflight: a szabad kapacitas nem merheto"
              exit 1
            fi
            if ! [[ "$AVAIL_BYTES" =~ ^[0-9]+$ ]]; then
              echo "::error::Standby preflight: ervenytelen szabadkapacitas-ertek: '$AVAIL_BYTES'"
              exit 1
            fi
            NEED_BYTES=$(( JAR_BYTES * 2 ))
            echo "Szabad: $AVAIL_BYTES B | szukseges (2x JAR): $NEED_BYTES B"
            if [ "$AVAIL_BYTES" -lt "$NEED_BYTES" ]; then
              echo "::error::Standby diszk-preflight FAILED: $AVAIL_BYTES B szabad < $NEED_BYTES B szukseges ($JAR_NAME merete $JAR_BYTES B)"
              exit 1
            fi
            echo "=== Preflight OK ==="
          ENDSSH

      - name: Upload JAR to standby
        run: |
          set -euo pipefail
          JAR=$(ls ./deploy-artifacts/valuta-backend-*.jar 2>/dev/null | grep -v SNAPSHOT | tail -1 || true)
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::Standby upload: lokalis JAR nem talalhato"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR")
          JAR_BYTES=$(stat -c%s "$JAR")
          if [ -z "$JAR_NAME" ] || [ "$JAR_NAME" = "${{ env.JAR_SYMLINK }}" ] \
             || ! [[ "$JAR_BYTES" =~ ^[0-9]+$ ]] || [ "$JAR_BYTES" -le 0 ]; then
            echo "::error::Standby upload: ervenytelen JAR (name='$JAR_NAME', bytes='${JAR_BYTES:-}')"
            exit 1
          fi
          echo "Uploading $JAR_NAME.incoming to standby ..."
          scp -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
              "$JAR" \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}:${{ env.VPS_DEPLOY_PATH }}/target/$JAR_NAME.incoming"
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s -- "$JAR_NAME" "$JAR_BYTES" << 'ENDSSH'
            set -euo pipefail
            JAR_NAME="$1"
            JAR_BYTES="$2"
            TARGET=${{ env.VPS_DEPLOY_PATH }}/target
            INCOMING="$TARGET/$JAR_NAME.incoming"
            FINAL="$TARGET/$JAR_NAME"

            # A preflight es az SCP kozotti promote-race ellen finalize elott is
            # fail-closed recovery guard fut. A post-upload swap guard valtozatlan.
            IN_REC=$(sudo -u postgres psql -tAc "SELECT pg_is_in_recovery();" 2>/dev/null || echo "x")
            if [ "$IN_REC" != "t" ]; then
              echo "::error::Standby finalize ABORT: pg_is_in_recovery()='$IN_REC' (nem 't'); az incoming fajl nem lesz aktivalva"
              exit 1
            fi
            if [ ! -f "$INCOMING" ] || [ -L "$INCOMING" ]; then
              echo "::error::Standby finalize: az incoming JAR hianyzik vagy nem regularis fajl: $INCOMING"
              exit 1
            fi
            REMOTE_BYTES=$(stat -c%s "$INCOMING")
            if [ "$REMOTE_BYTES" != "$JAR_BYTES" ]; then
              echo "::error::Standby finalize: merethiba, remote=$REMOTE_BYTES B, local=$JAR_BYTES B ($JAR_NAME)"
              exit 1
            fi
            echo "Meretellenorzes OK: $REMOTE_BYTES B; atomikus finalize: $INCOMING -> $FINAL"
            mv -f "$INCOMING" "$FINAL"
          ENDSSH

      - name: Swap symlink + restart (warm, read-only) + health
        run: |
          ssh -i ~/.ssh/scaleway_key -o StrictHostKeyChecking=accept-new \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              bash -s << 'ENDSSH'
            set -euo pipefail
            TARGET=${{ env.VPS_DEPLOY_PATH }}/target
            # 1) BIZTONSAG: a standby DB recovery-ben (warm) kell legyen. Ha promote-olt
            #    (failover utan), NE nyuljunk hozza ezzel a jobbal -> split-brain veszely.
            IN_REC=$(sudo -u postgres psql -tAc "SELECT pg_is_in_recovery();" 2>/dev/null || echo "x")
            if [ "$IN_REC" != "t" ]; then
              echo "::error::Standby PG nem recovery modban van ('$IN_REC') — ABORT (lehet aktiv primary egy failover utan; kezi ellenorzes kell)"
              exit 1
            fi
            # 2) logs mappa — a 2.27.x logback ide ir; ha hianyzik/rossz a tulajdonos,
            #    a backend crash-loopol ("Failed to create parent directories").
            mkdir -p ${{ env.VPS_DEPLOY_PATH }}/logs
            chown -R ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} ${{ env.VPS_DEPLOY_PATH }}/logs
            # 3) current.jar -> legujabb verziozott jar (a regi marad rollbackhez)
            JAR=$(ls $TARGET/valuta-backend-*.jar | grep -v SNAPSHOT | grep -v current | sort -V | tail -1)
            echo "=== Standby symlink: $JAR -> current ==="
            ln -sfn "$JAR" "$TARGET/${{ env.JAR_SYMLINK }}"
            chown -h ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} "$TARGET/${{ env.JAR_SYMLINK }}"
            chown ${{ env.VPS_USER_OWNER }}:${{ env.VPS_USER_OWNER }} "$JAR"
            # 4) restart a meglevo warm .env-vel (SPRING_FLYWAY_ENABLED=false, read-only).
            #    NEM modositjuk az env-et — a Flyway tiltva marad (read-only replikan nem futhat).
            echo "=== Restarting standby valuta-backend (warm) ==="
            systemctl enable valuta-backend.service
            systemctl reset-failed valuta-backend.service 2>/dev/null || true
            systemctl restart valuta-backend.service
            # 5) health — a standby HIDEG indulasa lassabb, mint a primary-e.
            #    Meres (run 32728860407, 2026-08-24): a restart 12:50:24-kor indult,
            #    a Spring context 12:51:44-kor (Tomcat) es 12:51:46-kor (Flyway/DB) meg
            #    epult, az utolso init-log 12:52:03-kor jott — az akkori 10x8s (~80s)
            #    ablak 12:52:04-kor jart le, azaz a backend ~1-2 masodperccel a kapu
            #    utan allt volna fel. A job maga 10 perces timeouttal fut, ezert a
            #    30x8s (~240s) ablak bőven belefer, es megszunteti a hamis FAILURE-t,
            #    ami a standby-t elavult kodon hagyta (failover-kockazat).
            for i in $(seq 1 30); do
              sleep 8
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 http://localhost:8080/api/v1/auth/bootstrap-status || echo 000)
              echo "standby health attempt $i/30: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                journalctl -u valuta-backend.service -n 200 --no-pager | grep -oE '"service_version":"[^"]*"' | tail -1
                # vegso assert: meg mindig recovery-ben (a restart nem promote-olt)
                STILL=$(sudo -u postgres psql -tAc "SELECT pg_is_in_recovery();")
                echo "standby pg_is_in_recovery (t=jo): $STILL"
                echo "=== Standby warm backend UP (${i} probalkozas utan) ==="
                exit 0
              fi
            done
            echo "::error::Standby health check FAILED — a tartalek nem all keszen az atvetelre (240s utan sem)"
            journalctl -u valuta-backend.service -n 40 --no-pager
            exit 1
          ENDSSH

      - name: Standby summary
        if: always()
        run: |
          STANDBY_VERSION="UNREACHABLE"
          if [ -f ~/.ssh/scaleway_key ]; then
            STANDBY_VERSION=$(ssh -i ~/.ssh/scaleway_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              "root@${{ secrets.SCALEWAY_SERVER_IP }}" \
              "curl -s --max-time 8 http://localhost:8080/api/v1/version || true" 2>/dev/null || true)
          fi
          [ -n "$STANDBY_VERSION" ] || STANDBY_VERSION="UNREACHABLE"
          echo "## Scaleway standby sync (hot)" >> $GITHUB_STEP_SUMMARY
          echo "- **Standby:** ${{ secrets.SCALEWAY_SERVER_IP }} (read-only, Flyway off)" >> $GITHUB_STEP_SUMMARY
          echo "- **Standby localhost /version:** \`$STANDBY_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Result:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" != "success" ]; then
            echo "- ⚠️ A standby NEM frissult — failover eseten elavult kod indulna. Kezi beavatkozas kell." >> $GITHUB_STEP_SUMMARY
          fi

  deploy-frontend:
    name: Build + Deploy frontend-react
    runs-on: ubuntu-latest
    # Fuggetlen a deploy (backend) futasatol - a frontend akkor is deploy-olunk,
    # ha csak frontend valtozott (backend JAR valtozatlan maradhat).
    # A build job csak JAR-epit, nem backend deploy-t.
    needs: [build]
    if: always() && needs.build.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend-react
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist/ a szerverre
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"             frontend-react/dist/             "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/opt/valutavalto/frontend-react/dist/"

      - name: Nginx reload
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new             "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}"             "nginx -t && systemctl reload nginx && echo 'Frontend deploy COMPLETED'"

      - name: Verify title (v2.2.2+ expected)
        run: |
          TITLE=$(curl -s -H "Cache-Control: no-cache" https://excvaluta.com/ --max-time 10 | grep -o "<title>[^<]*</title>" | head -1)
          echo "Live title: $TITLE"
          if echo "$TITLE" | grep -q "RepZtecH"; then
            echo "WARNING: regi title (RepZtecH) meg megjelenik, lehet Cloudflare cache"
          fi

  update-systemd-units:
    name: Sync systemd units (if changed)
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      contains(github.event.commits.*.modified, 'deploy/hetzner/systemd/') ||
      contains(github.event.commits.*.added, 'deploy/hetzner/systemd/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy systemd units to server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              mkdir -p /etc/systemd/system/postgresql@16-main.service.d

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              deploy/hetzner/systemd/pgdata-luks.service \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/etc/systemd/system/pgdata-luks.service"

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              deploy/hetzner/systemd/valuta-backend.service \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/etc/systemd/system/valuta-backend.service"

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "deploy/hetzner/systemd/postgresql@16-main.service.d/luks-dependency.conf" \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}:/etc/systemd/system/postgresql@16-main.service.d/luks-dependency.conf"

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SERVER_IP }}" \
              systemctl daemon-reload

          echo "Systemd units synced and daemon reloaded."
