name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Heti biztonsagi scan (hetfo 06:00 UTC)
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build:
    name: Backend Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Test backend
        run: cd backend && mvn -B test --no-transfer-progress

      - name: Build backend
        run: cd backend && mvn -B package --no-transfer-progress -DskipTests

  backend-dependency-check:
    name: Backend OWASP Dependency Check
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: OWASP Dependency Check
        run: |
          cd backend && mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DnvdApiKey=$NVD_API_KEY \
            -DsuppressionFile=owasp-suppressions.xml \
            --no-transfer-progress || true
      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  npm-audit:
    name: npm audit (frontend + penztar-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend npm audit
        run: |
          cd frontend-react && npm ci --legacy-peer-deps
          npm audit --audit-level=high || true

      - name: Penztar-client npm audit
        run: |
          cd penztar-client && npm ci --legacy-peer-deps
          npm audit --audit-level=high || true

  penztar-lint:
    name: penztar-client Test + Lint + TypeCheck + IPC Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: penztar-client/package-lock.json
      - run: cd penztar-client && npm ci --legacy-peer-deps
      - run: cd penztar-client && npm run test --if-present
      - run: cd penztar-client && npm run typecheck
      - run: cd penztar-client && npm run check:ipc
      - run: cd penztar-client && npm run lint --if-present

  frontend-lint:
    name: frontend-react Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json
      - run: cd frontend-react && npm ci --legacy-peer-deps
      - run: cd frontend-react && npm run typecheck --if-present
      - run: cd frontend-react && npm run lint --if-present
