name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Heti biztonsagi scan (hetfo 06:00 UTC) — ezen az esemenyen fut a lassu OWASP Dependency Check is
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2.3.9 (audit-iter3 P1: pinned to SHA, CodeQL actions/unpinned-tag fix)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build:
    name: Backend Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test backend
        run: cd backend && mvn -B test --no-transfer-progress

      - name: Build backend
        run: cd backend && mvn -B package --no-transfer-progress -DskipTests

  # -----------------------------------------------------------------------------
  # GYORS SCA — PR gate (masodpercek alatt). A lassu OWASP Dependency Check
  # csak schedule / workflow_dispatch esemenyre fut, lasd: backend-owasp-weekly.
  # -----------------------------------------------------------------------------
  trivy-backend-scan:
    name: Trivy Backend SCA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Trivy fs scan (backend pom.xml)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (audit-iter3 P1: pinned to SHA, CodeQL actions/unpinned-tag fix)
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: 'true'
          format: 'sarif'
          output: 'trivy-backend.sarif'

      - name: Upload Trivy SARIF (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif
          retention-days: 14

  dependency-review:
    name: GitHub Dependency Review
    # Csak PR-eken van ertelme — a PR-ben valtozott fuggosegeket ellenorzi.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # -----------------------------------------------------------------------------
  # LASSU (NVD-fuggo) OWASP Dependency Check — csak ütemezve / kezzel inditva.
  # Naponta / PR-enkent NEM fut, igy nem blokkol.
  # -----------------------------------------------------------------------------
  backend-owasp-weekly:
    name: Backend OWASP Dependency Check (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # FKH-035 (2026-08-10): 45 -> 120 perc. A 31362490156-os utemezett futas 45 perc
    # utan CANCELLED lett: az NVD-cache MISS-elt (owasp-nvd-Linux-2026-W33 es a
    # restore-key sem talalt), igy a job a teljes, 374 418 rekordos NVD-adatbazist
    # toltotte le 3500 ms-os keresi kesleltetessel. A PR-trigger azert zold ~10-12 perc
    # alatt, mert ott ez a job SKIP-el (`if: schedule || workflow_dispatch`) — nem
    # gyorsabb, hanem el sem indul.
    timeout-minutes: 120
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute ISO week for cache key
        id: nvd_cache_key
        run: echo "key=$(date -u +'%G-W%V')" >> "$GITHUB_OUTPUT"

      # FKH-035: restore + save SZETVALASZTVA. A kombinalt `actions/cache` a
      # post-step-ben ment, ami CANCELLED job eseten NEM fut le — ezert a timeout
      # onmagat tartotta fenn: minden heti futas nulla cache-sel indult, tullepte a
      # limitet, es megint nem mentett. A kulon `cache/save` mar a letoltes UTAN,
      # az elemzes ELOTT rogziti az adatbazist.
      - name: Restore OWASP NVD database
        id: nvd_restore
        uses: actions/cache/restore@v6
        with:
          path: backend/.owasp-dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ steps.nvd_cache_key.outputs.key }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Update NVD database only
        id: nvd_update
        continue-on-error: true
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY is empty – falling back to anonymous NVD (slow, 5 req / 30s)"
            # Kulcs nelkul az NVD 5 keres / 30 mp-re korlatoz: a nagy keslektetes KOTELEZO.
            DELAY=3500
          else
            # Ervenyes API-kulccsal az NVD dokumentalt biztonsagos kesleltetese ~700 ms;
            # a 3500 ms ilyenkor feleslegesen otszorozte a futasidot.
            DELAY=700
          fi
          cd backend && mvn -B org.owasp:dependency-check-maven:update-only \
            -DnvdApiKey="$NVD_API_KEY" \
            -DnvdApiDelay=$DELAY \
            -DnvdMaxRetryCount=10 \
            -DdataDirectory=.owasp-dependency-check-data \
            --no-transfer-progress

      # A friss adatbazis akkor is mentesre kerul, ha az update reszlegesen futott —
      # igy a kovetkezo heti futas mar nem nullarol indul.
      - name: Save OWASP NVD database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: backend/.owasp-dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ steps.nvd_cache_key.outputs.key }}

      - name: OWASP Dependency Check
        id: owasp
        continue-on-error: true
        run: |
          # autoUpdate=false: az adatbazis-frissites mar megtortent (es cache-elve lett)
          # a kulon lepesben; itt CSAK az elemzes fut, halozati fuggoseg nelkul.
          cd backend && mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DautoUpdate=false \
            -DsuppressionFile=owasp-suppressions.xml \
            -DdataDirectory=.owasp-dependency-check-data \
            --no-transfer-progress

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

      - name: Fail on high/critical OWASP findings
        if: steps.owasp.outcome == 'failure'
        run: |
          echo "::error::OWASP Dependency Check found high/critical vulnerabilities. See uploaded report."
          exit 1

  npm-audit:
    name: npm audit (frontend + penztar-client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Frontend npm audit
        id: frontend_audit
        continue-on-error: true
        run: |
          cd frontend-react && npm ci --legacy-peer-deps
          npm audit --audit-level=high

      - name: Penztar-client npm audit
        id: penztar_audit
        continue-on-error: true
        run: |
          cd penztar-client && npm ci --legacy-peer-deps
          npm audit --audit-level=high

      # AUDIT 2026-08-07: a kozponti-client (es az azota megszunt arfolyam-keszito-client)
      # eddig KIMARADT az auditbol, ezert bennuk eszrevetlenul allt egy brace-expansion
      # high (DoS) es egy electron moderate talalat. Mindketto Electron-kliens,
      # amit alairt installerkent szallitunk — ugyanaz a kockazati osztaly, mint a
      # penztar-client. (2026-08-11: az arfolyam-keszito-client torolve, a kozponti
      # rate-maker flavorja szolgalja ki az RFM modot — a lefedettseg megmaradt.)
      - name: Kozponti-client npm audit
        id: kozponti_audit
        continue-on-error: true
        run: |
          cd kozponti-client && npm ci --legacy-peer-deps
          npm audit --audit-level=high

      - name: Fail on high/critical npm audit findings
        if: |
          steps.frontend_audit.outcome == 'failure' ||
          steps.penztar_audit.outcome == 'failure' ||
          steps.kozponti_audit.outcome == 'failure'
        run: |
          echo "::error::npm audit found high/critical vulnerabilities in one or more packages."
          exit 1

  penztar-lint:
    name: penztar-client Test + Lint + TypeCheck + IPC Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: penztar-client/package-lock.json
      - run: cd penztar-client && npm ci --legacy-peer-deps
      # PLATFORM-REFAKTOR (2026-08-11): a penztar typecheckje a shim-importokon at
      # beforditja a packages/electron-platform forrasait is, amik sajat fuggeket
      # hasznalnak (electron-log). Ezeket a platform sajat lockfile-bol kell
      # telepiteni — pontosan ugy, ahogy az electron-clients-typecheck job teszi.
      # Nelkule TS2307: Cannot find module 'electron-log/main'.
      - run: cd packages/electron-platform && npm ci --legacy-peer-deps
      # CI-ELECTRON-RACE fix: az Electron binárist determinisztikusan, EGYSZER,
      # a tesztek ELŐTT töltjük le — különben több vitest-fájl futásidőben,
      # párhuzamosan próbálja letölteni ("Downloading Electron binary..."), és a
      # race miatt egy tesztfájl 0 test-tel Failed Suite-ként bukik (flaki).
      - run: cd penztar-client && node node_modules/electron/install.js
      - run: cd penztar-client && npm run test --if-present
      - run: cd penztar-client && npm run typecheck
      - run: cd penztar-client && npm run check:ipc
      - run: cd penztar-client && npm run lint --if-present

  frontend-lint:
    name: frontend-react Lint + TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json
      - run: cd frontend-react && npm ci --legacy-peer-deps
      - run: cd frontend-react && npm run typecheck --if-present
      - run: cd frontend-react && npm run lint --if-present
      # i18next regression gate (PR #374): a baseline most 2862 warning (PR #383 SetupWizard
      # offline-mode banner lokalizacio: -2). Korabbi: 2864 (PR #381 MainLayout: -11).
      # UJ violations (>2862) -> CI fail. Cel: a baseline fokozatosan csokken, mig egy
      # kovetkezo sprint-ben az osszes szoveg lokalizalva lesz t()-vel.
      - run: cd frontend-react && npm run lint:i18n-gate --if-present

  # Audit #1026 (2026-06-04): a kozponti (+ azota megszunt arfolyam) Electron-kliensek
  # typecheck-je eddig NEM volt CI-ben (csak a penztar + frontend-react) -> egy
  # kliens-specifikus type-hiba (pl. hianyzo @types/sql.js) eszrevetlen maradt.
  # EGY kombinalt job, mert a kliensek electron-kodja megosztott csomagokra epul.
  #
  # PLATFORM-REFAKTOR (2026-08-10): a korabbi CROSS-CLIENT csatolas MEGSZUNT.
  # Korabban:
  #   - kozponti/electron/google-oauth.ts  re-exportalt ../../penztar-client/electron/google-oauth
  #   - arfolyam/electron/google-oauth.ts  re-exportalt ../../penztar-client/electron/google-oauth
  #   - vv-logger.ts HAROM kulon peldanyban letezett (193/192/192 sor, csak a default
  #     clientContext-ben tertek el)
  # Mostantol minden kliens a KOZOS platform-retegen keresztul hivatkozik:
  #   packages/electron-platform  (kliens -> platform, SOHA kliens -> kliens)
  #
  # A penztar-client telepitese TOVABBRA IS szukseges, mert a platform google-oauth
  # modulja a penztar production-tesztelt RFC 8252 + PKCE implementaciojat
  # re-exportalja (a forras athelyezese kulon, viselkedes-semleges lepes lehet).
  #
  # 2026-08-11: az arfolyam-keszito-client torolve (a kozponti rate-maker flavorja
  # szolgalja ki az RFM modot) — a job kozponti-only lett.
  electron-clients-typecheck:
    name: Electron clients TypeCheck (kozponti)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: cd frontend-react && npm ci --legacy-peer-deps
      - run: cd packages/local-first-core && npm ci --legacy-peer-deps
      - run: cd packages/electron-platform && npm ci --legacy-peer-deps
      - run: cd penztar-client && npm ci --legacy-peer-deps
      - run: cd kozponti-client && npm ci --legacy-peer-deps
      - run: cd packages/electron-platform && npm run typecheck
      - run: cd kozponti-client && npm run typecheck
