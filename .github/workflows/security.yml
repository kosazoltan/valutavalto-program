name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build:
    name: Backend Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backend
        run: cd backend && mvn -B package --no-transfer-progress -DskipTests

  penztar-lint:
    name: penztar-client Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: penztar-client/package-lock.json
      - run: cd penztar-client && npm ci --legacy-peer-deps
      - run: cd penztar-client && npm run typecheck
      - run: cd penztar-client && npm run lint --if-present

  frontend-lint:
    name: frontend-react Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json
      - run: cd frontend-react && npm ci --legacy-peer-deps
      - run: cd frontend-react && npm run typecheck --if-present
      - run: cd frontend-react && npm run lint --if-present